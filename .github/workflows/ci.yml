name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test data pipeline
        run: npm test
      - name: Build static site and search index
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx --yes --package=@playwright/test@1.55.0 playwright install --with-deps chromium
      - name: Browser responsive and accessibility smoke
        run: npm run test:browser
