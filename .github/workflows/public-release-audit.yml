name: Public Release Audit

on:
  push:
    branches:
      - release/v0.1-public-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Scan full Git history for private local paths
        shell: bash
        run: |
          set -euo pipefail
          pattern='(/nishome/|/home/[^/[:space:]]+|/Users/[^/[:space:]]+|[A-Za-z]:\\(Users|github-repos|simulation_files)\\|vscode-webview://|file:///([A-Za-z]:|home/|Users/))'
          found=0
          while IFS= read -r commit; do
            if git grep -nI -E "$pattern" "$commit" -- . \
              ':!package-lock.json' \
              ':!.github/workflows/public-release-audit.yml'; then
              found=1
            fi
          done < <(git rev-list --all)
          if [[ "$found" -ne 0 ]]; then
            echo 'Private/local path patterns were found in Git history.' >&2
            exit 1
          fi
          echo 'Full-history private/local path scan PASS.'
