name: Temporary 2026 Source Scan

on:
  push:
    branches:
      - editorial/2026-incremental-intake
    paths:
      - .github/workflows/source-scan-2026-temp.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run deterministic arXiv scan
        run: >-
          npm run scan:sources --
          --start "2026-01-01"
          --end "2026-09-11"
          --max-results "2000"
          --output source-scan-output
      - name: Run deterministic official feed scan
        run: >-
          npm run scan:feeds --
          --start "2026-01-01"
          --end "2026-09-11"
          --max-results "2000"
          --output source-scan-output
      - name: Upload scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-source-scan-2026
          path: source-scan-output/
          if-no-files-found: error
          retention-days: 30
