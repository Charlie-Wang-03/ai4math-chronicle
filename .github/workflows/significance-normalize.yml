name: Significance normalization

on:
  push:
    branches:
      - release/v0.1-public-readiness

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.1-public-readiness
      - name: Normalize math-specific H3 events to H2
        run: |
          python - <<'PY'
          from pathlib import Path
          keep_h3 = {
              '2024-09-12-openai-o1-reasoning-aime.yaml',
              '2025-01-22-deepseek-r1-reinforcement-learning-reasoning.yaml',
          }
          changed = []
          for path in sorted(Path('data/events').glob('*.yaml')):
              if path.name in keep_h3:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'significance:\n  tier: H3\n' not in text:
                  continue
              text = text.replace('significance:\n  tier: H3\n', 'significance:\n  tier: H2\n', 1)
              text = text.replace('timeline:\n  featured: false\n  significance: context\n', 'timeline:\n  featured: true\n  significance: primary\n', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)
          print(f'Normalized {len(changed)} records to H2:')
          for name in changed:
              print(f'  {name}')
          if len(changed) != 12:
              raise SystemExit(f'Expected 12 H3→H2 changes, got {len(changed)}')
          PY
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events
          git commit -m 'content: align significance tiers with editorial policy'
          git push origin HEAD:release/v0.1-public-readiness
