name: Deterministic Source Scan

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive discovery-window start (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "Inclusive discovery-window end (YYYY-MM-DD)"
        required: true
        type: string
      max_results:
        description: "Maximum results per machine channel (1-2000)"
        required: false
        default: "80"
        type: string
  # Temporary branch smoke trigger; removed before merge after live feed validation.
  push:
    branches:
      - source/openai-rss-adapter

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run deterministic arXiv scan
        env:
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_MAX: ${{ inputs.max_results }}
        run: |
          START="${INPUT_START:-2026-09-01}"
          END="${INPUT_END:-2026-09-11}"
          MAX="${INPUT_MAX:-80}"
          npm run scan:sources -- --start "$START" --end "$END" --max-results "$MAX" --output source-scan-output
      - name: Run deterministic official feed scan
        env:
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_MAX: ${{ inputs.max_results }}
        run: |
          START="${INPUT_START:-2026-09-01}"
          END="${INPUT_END:-2026-09-11}"
          MAX="${INPUT_MAX:-80}"
          npm run scan:feeds -- --start "$START" --end "$END" --max-results "$MAX" --output source-scan-output
      - name: Upload scan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-source-scan
          path: source-scan-output/
          if-no-files-found: error
          retention-days: 30
