event_types:
- discovery
- system

significance:
  tier: H2
  rationale:
    en: >-
      HR extended automated mathematical discovery from heuristic conjecturing toward a broader theory-formation loop that invents concepts, calculates examples, formulates conjectures and later integrates theorem proving and model finding.
    zh-CN: >-
      HR 将自动数学发现从启发式猜想生成进一步推进为更完整的 theory-formation 循环，包括创造概念、计算例子、形成猜想，并在后续系统中结合定理证明与模型查找。

mathematical_novelty:
  type: new_conjecture
interfaces:
- symbolic

claim:
  en: >-
    Simon Colton presented HR at AAAI/IAAI 1998 as a system for automatically producing, assessing and displaying concepts in finite algebras; subsequent HR work expanded the same system into conjecturing and theorem-settling workflows.
  zh-CN: >-
    Simon Colton 在 AAAI/IAAI 1998 展示 HR：系统能够在有限代数中自动产生、评估与展示概念；后续 HR 工作又把同一系统扩展到猜想形成与定理判定流程。

summary:
  en: >-
    HR searches a space of mathematical concepts, evaluates their interest and uses generated concepts to drive further examples, classifications and conjectures.
  zh-CN: >-
    HR 搜索数学概念空间、评估概念的有趣程度，并利用生成概念继续驱动例子、分类与猜想探索。

why_it_matters:
  en: >-
    HR is a direct historical precursor to contemporary AI systems aimed at open-ended mathematical discovery rather than only proving supplied statements.
  zh-CN: >-
    HR 是当代开放式 AI 数学发现系统的直接历史前序之一，其目标并非只证明给定命题，而是参与形成数学理论本身。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      The system autonomously generated and assessed mathematical concepts and used them to structure subsequent theory exploration.
    zh-CN: >-
      系统自主生成并评估数学概念，并利用这些概念组织后续理论探索。

human_contribution:
  description:
    en: >-
      Simon Colton and collaborators designed the production rules, interestingness measures, domain representations and later theorem-proving integrations.
    zh-CN: >-
      Simon Colton 与合作者设计概念生成规则、有趣度指标、领域表示及后续定理证明集成。

