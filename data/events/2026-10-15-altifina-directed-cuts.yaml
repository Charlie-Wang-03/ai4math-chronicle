claim:
  en: >-
    Frederic Folz and Mykhaylo Tyomkyn prove the Lee–Loh–Sudakov conjecture on
    simultaneously large directed cuts for every fixed minimum outdegree d, establish
    the sharp asymptotic coefficient and an exact sufficiently-large-m bound, and settle
    Scott's d = 2 question for all m. Their paper states that the proof of the core
    asymptotic theorem was first discovered by the Altifina research framework using
    ChatGPT 6 Astra, GPT-6.1 Sol and Claude Opus 5.5.
  zh-CN: >-
    Frederic Folz 与 Mykhaylo Tyomkyn 证明了关于同时大有向割的 Lee–Loh–Sudakov 猜想，
    对每个固定最小出度 d 得到 sharp asymptotic coefficient 和充分大 m 的精确界，并对
    d = 2 的 Scott 问题给出所有 m 的完整结论。论文明确表示，核心渐近定理的证明最初由
    Altifina research framework 使用 ChatGPT 6 Astra、GPT-6.1 Sol 与 Claude Opus 5.5 发现。

summary:
  en: >-
    The authors state that the AI-discovered proof was revised and extended by Tyomkyn,
    aided by ChatGPT 6 Astra, to obtain the paper's main exact and stability results.
    They also state that the proofs were verified in Lean and that a certificate is
    available on request. The presentation itself is human-written. Because the formal
    certificate is not exposed as a public artifact in the current record, Chronicle
    keeps formal assurance at none pending an inspectable release.
  zh-CN: >-
    作者说明，AI 首先发现的证明随后由 Tyomkyn 在 ChatGPT 6 Astra 协助下修订和扩展，形成论文
    的主要精确结果与稳定性结论。论文还称证明已在 Lean 中验证，certificate 可按需索取；
    正文表述由人类完成。由于当前记录中没有公开可检查的形式化 artifact，Chronicle 暂不赋予
    formal assurance，等待可公开审计的发布。

why_it_matters:
  en: >-
    The event demonstrates a research workflow in which several frontier models are
    combined into a discovery framework that originates a publishable combinatorial proof,
    while expert mathematicians subsequently refine the result and take authorship
    responsibility. It provides a useful contrast with single-model autonomous runs and
    ordinary conversational assistance.
  zh-CN: >-
    本事件展示了另一种研究模式：多个前沿模型被组合进 discovery framework，首先产生可发表的
    组合数学证明，再由专家数学家完善结果并承担作者责任。它与单模型自主运行和普通对话式辅助
    都形成清晰对照。

