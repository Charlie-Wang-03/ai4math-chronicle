significance:
  tier: H2
  rationale:
    en: >-
      This is a field milestone because a multi-model AI research framework first found
      the key proof of a 2013 extremal-digraph conjecture and the human author then
      revised and extended it to sharper exact and stability results. The authors report
      Lean verification, although the certificate is not publicly inspectable in the
      sources recovered by Chronicle. The event therefore records substantive AI-originated
      mathematical discovery without overstating the verification surface.
    zh-CN: >-
      该成果构成领域级里程碑，因为多模型 AI 研究框架首先找到一个 2013 年极值有向图猜想的关键
      证明，随后人类作者进一步修订和扩展，得到更强的精确界与稳定性结果。作者报告证明已经
      Lean 验证，但 Chronicle 当前获取到的来源中没有可公开检查的 certificate，因此本记录
      确认实质性的 AI 原创数学发现，同时不夸大其验证界面。

