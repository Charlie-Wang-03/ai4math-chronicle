significance:
  tier: H2
  rationale:
    en: >-
      The result is a field milestone because it extends the emerging fixed-half-plane
      zero-free programme from restricted L-function families to the Dedekind zeta
      function of every number field, and it is accompanied by a public Lean proof.
      Named mathematicians directed the research and made the mathematical judgments,
      while AxiomProver generated the proofs and formalization. The result is a major
      advance in analytic/algebraic number theory but not a proof of the Riemann or
      generalized Riemann hypotheses.
    zh-CN: >-
      该成果构成领域级里程碑，因为它把新近出现的固定半平面零点空区路线从受限 L-function
      家族推广到任意数域的 Dedekind ζ 函数，并配有公开 Lean 证明。具名数学家负责研究
      方向和数学判断，AxiomProver 生成证明与形式化。它是解析/代数数论中的重要推进，但并非
      Riemann 猜想或广义 Riemann 猜想的证明。

