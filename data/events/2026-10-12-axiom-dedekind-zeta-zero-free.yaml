claim:
  en: >-
    Dean Cureton and Jesse Thorner report that for every number field K, the Dedekind
    zeta function ζ_K(s) has no zeros in Re(s) > 31/32, apart from the pole at s = 1.
    They also obtain the same zero-free half-plane for finite-order Hecke L-functions
    wherever holomorphic. Axiom Math publishes a Lean formalization of Theorem 1.1 and
    Corollary 1.2 using only Lean's standard axioms.
  zh-CN: >-
    Dean Cureton 与 Jesse Thorner 报告：对任意数域 K，Dedekind ζ 函数 ζ_K(s) 在
    Re(s) > 31/32 的半平面内没有零点（s = 1 的极点除外）；有限阶 Hecke L-functions
    在其全纯区域也满足同样的零点空区。Axiom Math 公开了 Theorem 1.1 与 Corollary 1.2
    的 Lean 形式化，仅依赖 Lean 的标准公理。

summary:
  en: >-
    The manuscript follows a strategy developed in recent OpenAI work but extends the
    scope to arbitrary number fields. Axiom Math states that Cureton and Thorner directed
    the research and made mathematical judgments, while AxiomProver generated the proofs
    and Lean formalization. The public challenge/solution project has zero project
    sorries outside the intentional challenge placeholders and reports only propext,
    Quot.sound and Classical.choice in the main declarations. A subsequent paper by
    Frei, Sofos and Widmer already cites the Cureton–Thorner result in deriving
    unconditional applications to class groups and small generators.
  zh-CN: >-
    论文沿用近期 OpenAI 工作中的策略，但把适用范围推广到任意数域。Axiom Math 明确说明
    Cureton 与 Thorner 负责研究方向与数学判断，AxiomProver 生成证明和 Lean 形式化。
    公开 Challenge/Solution 工程在有意的 challenge 占位之外没有项目 sorry，主要定理
    只报告 propext、Quot.sound 与 Classical.choice。随后 Frei、Sofos、Widmer 的论文
    已引用该结果，并用于推出关于类群和小生成元的无条件应用。

why_it_matters:
  en: >-
    This is an unusually concrete example of an AI system generating both a research
    proof and its formalization under expert mathematical direction, with the result
    immediately feeding into further human mathematical work. It also illustrates the
    rapid reuse of AI-generated mathematics through open formal libraries.
  zh-CN: >-
    这是 AI 系统在专家数学家指导下同时生成研究证明和形式化的清晰案例，而且成果很快被后续
    人类数学工作继续使用，也展示了开放形式化库如何加速 AI 生成数学的再利用。

