title:
  en: MathVista establishes a benchmark for mathematical reasoning in visual contexts
  zh-CN: MathVista 建立视觉场景中的数学推理评测基准

dates:
  event: '2023-10-03'
  first_public_claim: '2023-10-03'
  paper_release: '2023-10-03'
  artifact_release: null
  independently_verified: null
