- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      LeanAgent reframed neural theorem proving as a continual-learning problem over evolving mathematical repositories rather than a fixed benchmark, combining a dynamic knowledge database, curriculum ordering and progressive retriever training to preserve and extend proof capability across domains.
    zh-CN: >-
      LeanAgent 将神经定理证明重新表述为面向持续演化数学仓库的终身学习问题，而非固定基准任务；它结合动态知识数据库、课程排序和渐进式检索器训练，使证明能力能够跨领域持续保留与扩展。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    The LeanAgent paper reported formal proofs for 155 theorems whose Lean repositories previously contained missing proofs across 23 repositories, while improving lifelong-learning stability and backward transfer relative to a static theorem-proving baseline.
  zh-CN: >-
    LeanAgent 论文报告在 23 个 Lean 仓库中为 155 个此前缺少形式证明的定理生成了形式证明，并相较静态定理证明基线改善终身学习中的稳定性与向后迁移表现。

summary:
  en: >-
    LeanAgent repeatedly ingests new Lean repositories, traces theorem and premise data through LeanDojo, updates a dynamic database, progressively retrains premise retrieval and searches for proofs of `sorry` theorems. Successful proofs can be added back to the knowledge base for later learning.
  zh-CN: >-
    LeanAgent 持续接收新的 Lean 仓库，通过 LeanDojo 抽取定理与前提数据，更新动态数据库，渐进训练前提检索器，并搜索带有 `sorry` 的定理证明；成功证明还可回流知识库供后续学习。

why_it_matters:
  en: >-
    The work introduced a durable systems perspective for AI theorem proving in which mathematical knowledge, repositories and model competence evolve together, addressing a limitation of provers trained once on static snapshots.
  zh-CN: >-
    该工作为 AI 定理证明引入一种持续性的系统视角：数学知识、代码仓库与模型能力共同演化，从而回应“一次训练于静态快照”的证明器难以适应持续增长数学库的问题。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      Learned premise retrieval and tactic generation drove automated proof search across Lean repositories, while Lean mechanically checked candidate tactic sequences and accepted successful formal proofs.
    zh-CN: >-
      学习式前提检索与 tactic 生成驱动跨 Lean 仓库的自动证明搜索，Lean 则机械检查候选 tactic 序列并接受成功的形式证明。

human_contribution:
  description:
    en: >-
      Researchers designed the lifelong-learning architecture, repository curriculum, dynamic database and progressive training procedure, selected evaluation repositories, and analyzed stability and transfer.
    zh-CN: >-
      研究者设计终身学习架构、仓库课程、动态数据库与渐进训练流程，选择评测仓库，并分析稳定性与迁移表现。

