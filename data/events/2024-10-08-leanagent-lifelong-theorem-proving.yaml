title:
  en: LeanAgent brings lifelong learning to theorem proving across evolving Lean repositories
  zh-CN: LeanAgent 将终身学习引入持续演化 Lean 仓库的定理证明

dates:
  event: '2024-10-08'
  first_public_claim: '2024-10-08'
