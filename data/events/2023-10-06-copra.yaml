title:
  en: COPRA turns a general LLM into a stateful formal proof-search agent
  zh-CN: COPRA 将通用大模型转化为有状态的形式证明搜索 Agent

dates:
  event: "2023-10-06"
  first_public_claim: "2023-10-06"
  paper_release: "2023-10-06"
  artifact_release: null
  independently_verified: null
