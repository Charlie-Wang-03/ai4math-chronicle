significance:
  tier: H2
  rationale:
    en: The work showed that proof search interleaved with learning could create its own curriculum and reach a new state of the art on miniF2F.
    zh-CN: 该工作展示了证明搜索与学习交替进行可以形成自举式课程，并在 miniF2F 上取得当时领先结果。
mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic
claim:
  en: OpenAI reported 41.2% on miniF2F and automatic proofs of challenging AMC/AIME and two IMO-adapted problems using statement curriculum learning in Lean.
  zh-CN: OpenAI 报告其基于 Lean 的 statement curriculum learning 在 miniF2F 上达到 41.2%，并自动证明若干 AMC/AIME 及两道改编 IMO 问题。
summary:
  en: The prover alternated proof search with retraining on newly discovered proofs over statements of varied difficulty.
  zh-CN: 该证明器在不同难度的形式命题上交替执行证明搜索与基于新发现证明的再训练。
why_it_matters:
  en: It connected language-model theorem proving with expert-iteration ideas that later became central to formal reasoning systems.
  zh-CN: 它把语言模型定理证明与专家迭代结合，后者后来成为形式推理系统中的核心训练范式之一。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The neural prover searched for Lean proofs and used successful proofs as new training data.
    zh-CN: 神经证明器搜索 Lean 证明，并把成功证明作为新的训练数据。
human_contribution:
  description:
    en: Researchers curated statements, designed the expert-iteration loop and evaluated generated formal proofs.
    zh-CN: 研究者整理命题、设计专家迭代训练循环并评测生成的形式证明。
