slug: lean-statement-curriculum-learning
title:
  en: OpenAI's Lean prover uses expert iteration to solve formal Olympiad problems
  zh-CN: OpenAI Lean 证明器通过专家迭代求解形式化奥赛题
dates:
  event: '2022-02-02'
  first_public_claim: '2022-02-02'
