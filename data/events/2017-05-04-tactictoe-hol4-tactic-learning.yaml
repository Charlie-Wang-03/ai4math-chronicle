  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Thibault Gauthier, Cezary Kaliszyk and Josef Urban introduced TacticToe in the LPAR-21 proceedings published on 4 May 2017. The system learned tactic and premise choices from previous HOL4 proofs and used modified A* search to explore tactic-level proof paths, re-proving 39% of 7,902 HOL4 theorems within five seconds in the reported evaluation. A later expanded study published in 2018 replaced the search with Monte Carlo tree search and reported stronger results on the HOL4 standard library.
  zh-CN: >-
    Thibault Gauthier、Cezary Kaliszyk 与 Josef Urban 在 2017 年 5 月 4 日发布的 LPAR-21 proceedings 中提出 TacticToe。系统从既有 HOL4 证明中学习 tactic 与前提选择，并使用改进 A* 搜索探索 tactic 级证明路径；论文报告在五秒限制下重新证明了 7,902 个 HOL4 定理中的 39%。2018 年发布的扩展研究进一步把搜索机制发展为蒙特卡洛树搜索，并在 HOL4 标准库上报告了更强结果。

summary:
  en: >-
    TacticToe records tactic-level proof information from HOL4, learns which proof actions are promising in a new goal state, and searches over complete tactic sequences directly in higher-order logic rather than translating every problem to first-order logic. The 2017 system used a modified A*-style search with tactic prediction and small-scale hammering; the later expanded implementation developed the search machinery further and remains available in the HOL4 repository.
  zh-CN: >-
    TacticToe 从 HOL4 中记录 tactic 级证明信息，学习在新目标状态下哪些证明动作更有希望，并直接在高阶逻辑环境中搜索完整 tactic 序列，而不是把每个问题都翻译到一阶逻辑。2017 年系统采用改进 A* 风格搜索并结合 tactic prediction 与小规模 hammering；后续扩展实现进一步发展搜索机制，相关代码至今仍可在 HOL4 仓库中检查。

why_it_matters:
  en: >-
    The work demonstrated that machine learning could guide proof-assistant-native tactic search rather than only premise filtering for an external automated prover. This combination of learned action prediction, search and kernel-checked proof construction became a recurring design pattern in later neural interactive theorem proving.
  zh-CN: >-
    该工作展示了机器学习可以直接引导证明助手原生的 tactic 搜索，而不仅仅为外部自动证明器筛选前提。“学习式动作预测 + 搜索 + 内核检查证明”的组合后来成为神经交互式定理证明中反复出现的设计范式。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      Learned predictors ranked tactics and supporting premises while the search algorithm explored proof paths; successful proof scripts were constructed and checked inside HOL4.
    zh-CN: >-
      学习式预测器负责排序 tactics 与支持前提，搜索算法负责探索证明路径；成功的证明脚本最终在 HOL4 内构造并接受检查。

human_contribution:
  description:
    en: >-
      Researchers designed the proof-trace recording, learned predictors, tactic-level search procedure, HOL4 integration and evaluation protocol, while the learning signal came from existing human-written HOL4 proofs.
    zh-CN: >-
      研究者设计证明轨迹记录、学习式预测器、tactic 级搜索机制、HOL4 集成与评测协议；学习信号来自既有人工编写的 HOL4 证明。

