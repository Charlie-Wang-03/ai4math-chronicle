significance:
  tier: H2
  rationale:
    en: >-
      TacticToe was an important early proof-assistant-native learning system that used recorded human HOL4 proofs to guide tactic-level proof search directly inside a mature interactive theorem prover. The initial LPAR-21 publication combined learned tactic and premise selection with modified A* search; an expanded 2018 study developed the same system further with Monte Carlo tree search. Together the work established a line later continued by reinforcement-learning systems such as TacticZero.
    zh-CN: >-
      TacticToe 是较早具有代表性的证明助手原生学习系统之一，利用既有人工 HOL4 证明，在成熟交互式定理证明器内部直接引导 tactic 级证明搜索。LPAR-21 的初始版本将学习式 tactic / premise selection 与改进 A* 搜索结合，2018 年扩展研究又进一步以蒙特卡洛树搜索发展同一系统；这一路线后来由 TacticZero 等强化学习系统继续推进。

