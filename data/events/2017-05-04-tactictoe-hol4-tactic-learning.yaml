  history:
  - date: '2017-05-04'
    status: paper_released
    evidence_level: E2
    note:
      en: >-
        The LPAR-21 proceedings establish the initial public TacticToe system, its learned tactic-level proof search and the reported HOL4 evaluation. Machine checking refers to proof scripts accepted by HOL4 and does not imply independent reproduction of the reported success rate.
      zh-CN: >-
        LPAR-21 proceedings 确认了首次公开的 TacticToe 系统、其学习式 tactic 级证明搜索以及论文报告的 HOL4 评测。machine_checked 仅指证明脚本通过 HOL4 检查，并不表示论文报告的成功率已获得独立复现。
  - date: '2018-04-02'
    status: paper_released
    evidence_level: E2
    note:
      en: >-
        The expanded 2018 research record documents the later Monte Carlo tree-search version and stronger HOL4 standard-library evaluation without changing the identity of the underlying TacticToe milestone.
      zh-CN: >-
        2018 年扩展研究记录描述了后续蒙特卡洛树搜索版本及更强的 HOL4 标准库评测，但并未构成另一个独立的 TacticToe 历史事件。
  - date: '2026-09-15'
    status: paper_released
    evidence_level: E3
    note:
      en: >-
        The maintained public HOL4 repository contains the TacticToe implementation, recording workflow, evaluation support and usage instructions. E3 denotes inspectable artifacts rather than independent verification of every experimental claim.
      zh-CN: >-
        持续维护的 HOL4 公开仓库包含 TacticToe 实现、证明记录流程、评测支持与使用说明。E3 表示存在可直接检查的 artifacts，而非对全部实验结论的独立验证。

