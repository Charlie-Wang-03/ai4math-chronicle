title:
  en: Ramanujan Library reports automated discovery of new relations among mathematical constants
  zh-CN: Ramanujan Library 报告自动发现数学常数之间的新关系

dates:
  event: '2024-12-16'
  first_public_claim: '2024-12-16'
  paper_release: '2024-12-16'
  artifact_release: null
  independently_verified: null
