event_types:
- discovery
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      The Ramanujan Library extended automated-conjecture work from searching formulas for individual constants to a structured hypergraph of relations among constants, and the authors reported dozens of previously unknown relations generated during construction and testing of the system.
    zh-CN: >-
      Ramanujan Library 将自动猜想工作从“为单个常数寻找公式”推进到“构建常数之间关系的结构化超图”；作者报告称，在系统构建与测试过程中自动得到数十个此前未知的常数关系。

mathematical_novelty:
  type: new_result

interfaces:
- symbolic
- numeric

claim:
  en: >-
    The authors reported that a PSLQ-based automated enrichment strategy discovered 75 previously unknown connections between mathematical constants, including a new formula for the first continued-fraction constant, new logarithmic formulas and formulas relating pi and e.
  zh-CN: >-
    作者报告称，基于 PSLQ 的自动扩充策略发现了 75 个此前未知的数学常数关系，其中包括首个连分数常数的新公式、新的对数公式，以及连接 π 与 e 的公式。

summary:
  en: >-
    The project represents mathematical constants as vertices and formulas as hyperedges, then searches for integer relations that can expand this graph. The associated LIReC software provides a public database and numerical relation-identification tools for inspecting and extending the library.
  zh-CN: >-
    该项目把数学常数表示为顶点、公式表示为超边，再搜索能够扩充该关系图的整数关系。配套的 LIReC 软件提供公开数据库与数值关系识别工具，可用于检查和继续扩展这一常数关系库。

why_it_matters:
  en: >-
    The work supplied a concrete research-level example of automated mathematical discovery outside theorem proving and language-model benchmarking, while making the resulting discovery substrate available as reusable experimental-mathematics infrastructure.
  zh-CN: >-
    该工作提供了一个区别于定理证明与语言模型基准的研究级自动数学发现案例，并把支撑这些发现的基础设施作为可复用的实验数学资源公开。

ai_role:
  level: computation_only
  description:
    en: >-
      Automated numerical and symbolic search based on PSLQ proposed candidate integer relations among constants; this event does not rely on an LLM or autonomous agent making semantic mathematical judgments.
    zh-CN: >-
      基于 PSLQ 的自动数值与符号搜索提出数学常数之间的候选整数关系；该事件并不依赖 LLM 或自主 Agent 进行语义层面的数学判断。

human_contribution:
  description:
    en: >-
      Researchers designed the hypergraph representation, discovery and filtering procedure, curated the constants database, analyzed the generated relations and prepared the mathematical claims and software infrastructure.
    zh-CN: >-
      研究者设计常数关系的超图表示、发现与筛选流程，维护常数数据库，分析自动生成的关系，并整理数学结论与软件基础设施。

