significance:
  tier: H1
  rationale:
    en: >-
      This result is a Historical Milestone because it reports the first polynomial
      exponent improvements for 3SUM and APSP, two problems whose conjectured
      near-quadratic and near-cubic barriers structured fine-grained complexity for
      decades. The paper attributes the core algorithmic discovery to an Anthropic
      research model operating in a long session without human input, after which Josh
      Alman and Virginia Vassilevska Williams independently understood, simplified,
      strengthened and extended the method. Anthropic subsequently released a substantial
      Lean formalization of the principal deterministic claims.
    zh-CN: >-
      该结果被列为 Historical Milestone，因为它报告了 3SUM 与 APSP 的首次多项式级
      指数改进，而这两个问题长期以来的近二次与近三次复杂度假设塑造了 fine-grained
      complexity 的研究框架。论文把核心算法发现归因于一个 Anthropic 研究模型在无人类
      输入的长程 session 中完成；随后 Josh Alman 与 Virginia Vassilevska Williams
      独立理解、简化、强化并扩展该方法。Anthropic 又公开了主要 deterministic claims
      的大规模 Lean 形式化。

