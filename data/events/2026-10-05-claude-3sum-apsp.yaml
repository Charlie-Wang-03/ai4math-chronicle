claim:
  en: >-
    Alman and Vassilevska Williams report deterministic algorithms solving 3SUM on
    polynomial-size integer inputs in O(n^1.9992) time and APSP with polynomially
    bounded integer weights in O(n^2.99942) time in their word-RAM formulation, together
    with related improvements for Exact Triangle, min-plus product and zero-weight
    k-Clique. The paper states that these are the first truly subquadratic and truly
    subcubic algorithms in the corresponding settings and that they refute the standard
    3SUM and APSP hypotheses used in fine-grained complexity.
  zh-CN: >-
    Alman 与 Vassilevska Williams 报告 deterministic algorithms：在其 word-RAM
    模型中，对多项式大小整数输入的 3SUM 达到 O(n^1.9992)，对多项式有界整数权重的
    APSP 达到 O(n^2.99942)，并同时改进 Exact Triangle、min-plus product 与
    zero-weight k-Clique。论文称这些是在相应设定下首次真正次二次与真正次三次算法，
    并由此推翻 fine-grained complexity 中常用的 3SUM 与 APSP hypotheses。

summary:
  en: >-
    The paper's methodology section says an Anthropic employee initially asked an
    internal research model to study a cryptographic question based on average-case
    Zero-k-Clique. Claude unexpectedly developed a new algorithm, first for the
    average-case setting and then for the worst case, during a session producing about
    16 million output tokens with no human input. Anthropic shared the result with Alman
    and Vassilevska Williams, who reconstructed the argument, simplified it, improved
    constants and exponents, derived additional consequences and wrote the research
    paper. After the paper was complete, Anthropic used a research model to formalize
    major deterministic claims in Lean.
  zh-CN: >-
    论文的方法部分说明，Anthropic 员工最初让内部研究模型研究一个基于 average-case
    Zero-k-Clique 的密码学问题。Claude 在约 1,600 万 output tokens、无人类输入的
    session 中意外发展出新算法，先处理平均情形，再推广到最坏情形。Anthropic 将结果
    提供给 Alman 与 Vassilevska Williams；两位作者随后重新理解论证、简化方法、
    改进常数与指数、推出更多后果并撰写论文。论文完成后，Anthropic 又使用研究模型
    把主要 deterministic claims 形式化到 Lean 中。

why_it_matters:
  en: >-
    This event provides unusually explicit provenance for a frontier mathematical
    algorithm originating in a long autonomous model run and then surviving expert human
    reconstruction. The result does not merely improve a benchmark: it changes the
    conjectural landscape of fine-grained complexity and forces reconsideration of
    reductions and hardness assumptions built on 3SUM and APSP. The accompanying Lean
    artifact further makes a subset of the headline claims mechanically inspectable.
  zh-CN: >-
    本事件为“前沿数学算法由长程自主模型运行产生、随后经专家重新理解”的过程提供了罕见的
    明确 provenance。它不是 benchmark 提升，而是改变 fine-grained complexity 的
    猜想格局，并迫使研究者重新审视建立在 3SUM 与 APSP 假设上的归约和困难性框架。
    配套 Lean artifact 还使部分 headline claims 可以接受机械检查。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      The paper attributes the core algorithmic discovery to an Anthropic research model
      in a 16-million-output-token session with no human input. Human authors then
      independently understood the method, simplified and strengthened it, derived new
      consequences and took responsibility for the final paper. This classification
      applies to the reported discovery workflow, not to every theorem and exposition
      choice in the final manuscript.
    zh-CN: >-
      论文把核心算法发现归因于 Anthropic 研究模型在约 1,600 万 output tokens 且
      无人类输入的 session 中完成。人类作者随后独立理解该方法、简化并强化论证、
      推出新的后果，并对最终论文负责。该分类描述的是公开披露的发现流程，并不表示
      最终论文中的每个定理和阐释选择都由模型完成。

human_contribution:
  description:
    en: >-
      Josh Alman and Virginia Vassilevska Williams reconstructed the model's algorithm,
      simplified and strengthened it, improved quantitative bounds, developed further
      consequences and wrote the paper. Anthropic researchers supplied the model run and
      later formalization infrastructure.
    zh-CN: >-
      Josh Alman 与 Virginia Vassilevska Williams 重新构建模型算法、简化并强化方法、
      改进定量界、发展进一步后果并撰写论文；Anthropic 研究人员提供模型运行以及后续
      形式化基础设施。

