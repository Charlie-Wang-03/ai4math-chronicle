event_types:
- system
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      Sledgehammer established a practical architecture for combining an interactive proof assistant with powerful external ATP systems, automatically selecting relevant facts and turning external search into proof-assistant-native progress.
    zh-CN: >-
      Sledgehammer 建立了交互式证明助手与强大外部 ATP 的实用结合架构，自动选择相关事实，并把外部搜索转化为证明助手内部可用的证明进展。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: >-
    At PAAR-2010 on 14 July 2010, Lawrence Paulson and Jasmin Blanchette presented three years of experience with Sledgehammer as a practical link between Isabelle and automatic theorem provers.
  zh-CN: >-
    Lawrence Paulson 与 Jasmin Blanchette 在 2010 年 7 月 14 日 PAAR-2010 报告三年 Sledgehammer 使用经验，将其定位为 Isabelle 与自动定理证明器之间的实用桥梁。

summary:
  en: >-
    Sledgehammer selects relevant Isabelle facts, translates proof obligations to external ATPs and uses the returned information to help construct proof-assistant-checked proofs.
  zh-CN: >-
    Sledgehammer 自动选择 Isabelle 相关事实，将证明义务翻译给外部 ATP，并利用返回结果帮助构造由证明助手检查的证明。

why_it_matters:
  en: >-
    The system made strong automation accessible in routine interactive proving and became an important precedent for later AI assistants that orchestrate external search while retaining trusted proof checking.
  zh-CN: >-
    该系统让强自动化进入日常交互式证明流程，并成为后来“外部搜索 + 可信证明检查”AI 助手的重要前史。

ai_role:
  level: ai_substantive_support
  description:
    en: >-
      Automated premise selection and external provers supplied substantial proof search, while Isabelle retained the trusted formal proof environment.
    zh-CN: >-
      自动前提选择与外部证明器承担大量证明搜索，Isabelle 保留可信形式证明环境。

human_contribution:
  description:
    en: >-
      Researchers designed the translation, relevance filtering, prover orchestration and proof reconstruction mechanisms; users supplied formal goals and integrated resulting proof steps.
    zh-CN: >-
      研究者设计翻译、相关性筛选、证明器编排与证明重建机制；用户提供形式目标并整合所得证明步骤。

