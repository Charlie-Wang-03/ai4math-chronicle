significance:
  tier: H2
  rationale:
    en: >-
      This case connects agent-generated proofs of cryptographic properties to the compiled instructions
      of a deployed protocol library. The released development makes its trusted assumptions inspectable.
    zh-CN: 这项工作把智能体生成的密码学证明与实际部署的协议库机器指令联系起来。公开的形式化工程列出了证明依赖的可信假设。

mathematical_novelty:
  type: tooling_only

interfaces:
  - formal

claim:
  en: >-
    Google DeepMind reports machine-checked proofs for selected properties of libsignal’s PQXDH handshake
    and Triple Ratchet on AArch64, including forward secrecy and security after a compromise under the paper’s
    assumptions.
  zh-CN: >-
    Google DeepMind 报告称，团队对 AArch64 上 libsignal 的 PQXDH 握手与 Triple Ratchet 完成了若干性质的机器检查证明，涵盖论文假设下的前向保密性与失陷后安全性。

summary:
  en: >-
    A specification agent helped researchers state the obligations in Lean. Prover agents then discharged
    them against a model of AArch64 instructions. The report identifies the binary components covered and
    lists the trusted specifications and semantics.
  zh-CN: 研究人员借助智能体用 Lean 编写规约，再由证明智能体基于 AArch64 指令语义完成证明。报告列出了受验证的二进制组件、可信规约及指令语义。

why_it_matters:
  en: >-
    A reader can follow a protocol-level guarantee down to the binary components it covers and see where
    trust in a specification enters the argument.
  zh-CN: 读者可以从协议级安全保证追溯到证明覆盖的二进制组件，并查明论证在哪些环节依赖可信规约。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      Agents helped draft specifications and generated proofs checked by the Lean kernel against approved
      statements.
    zh-CN: 智能体协助起草规约，并生成由 Lean 内核按照已批准命题检查的证明。

human_contribution:
  description:
    en: >-
      Researchers guided and approved specifications, selected the properties to verify, and documented
      the trusted computing base.
    zh-CN: 研究人员指导并审核规约，选定验证目标，记录可信计算基。

