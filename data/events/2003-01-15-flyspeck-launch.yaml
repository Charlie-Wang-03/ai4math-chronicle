event_types:
- formalization
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      Flyspeck turned the verification of a major, computer-intensive mathematical proof into a long-running collaborative formalization project spanning proof text, computation and reusable proof-assistant infrastructure.
    zh-CN: >-
      Flyspeck 将一个重要且高度依赖计算的数学证明验证问题转化为长期协作形式化工程，同时覆盖数学文本、计算过程与可复用证明助手基础设施。

mathematical_novelty:
  type: formalization_of_known_result
interfaces:
- formal
- symbolic

claim:
  en: >-
    Thomas Hales announced the Flyspeck project at the January 15–18, 2003 Joint Mathematics Meetings in Baltimore with the goal of producing a fully formal proof of the Kepler conjecture; because the exact announcement day is not preserved in the cited record, the canonical date uses the meeting opening day.
  zh-CN: >-
    Thomas Hales 在 2003 年 1 月 15–18 日巴尔的摩 Joint Mathematics Meetings 上宣布 Flyspeck，目标是给出克卜勒猜想的完整形式证明；由于所引史料未保留具体宣布日，本条以会议开幕日作为 canonical 日期锚点。

summary:
  en: >-
    The project aimed to formalize both the written mathematical argument and the computer calculations underlying Hales's proof, eventually using HOL Light and Isabelle.
  zh-CN: >-
    项目计划同时形式化 Hales 证明中的书面数学论证与计算机计算部分，最终主要使用 HOL Light 与 Isabelle 完成。

why_it_matters:
  en: >-
    Flyspeck became a defining large-scale demonstration that proof assistants could audit extremely complex research mathematics end to end.
  zh-CN: >-
    Flyspeck 后来成为大型证明助手工程的代表案例，展示形式系统能够端到端审计极其复杂的研究数学。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      Humans led the formalization while proof assistants executed trusted inference, proof checking and large verified computations.
    zh-CN: >-
      人类主导形式化，证明助手执行可信推理、证明检查与大规模验证计算。

human_contribution:
  description:
    en: >-
      Hales and an international collaboration organized the formalization, decomposed the original proof and implemented the formal libraries and verification pipeline.
    zh-CN: >-
      Hales 与国际协作团队组织形式化、拆解原始证明，并实现形式库与验证流程。

