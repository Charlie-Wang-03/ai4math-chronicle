slug: math-shepherd-process-reward-model
title:
  en: Math-Shepherd automates step-level process supervision for math reasoning
  zh-CN: Math-Shepherd 自动化数学推理的步骤级过程监督
dates:
  event: '2023-12-14'
  first_public_claim: '2023-12-14'
