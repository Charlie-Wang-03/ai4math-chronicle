significance:
  tier: H3
  rationale:
    en: The Dartmouth proposal is broad AI history rather than a mathematics-specific result, but it supplies the field-formation context from which symbolic reasoning, theorem proving and machine mathematical problem solving soon emerged.
    zh-CN: 达特茅斯提案属于广义人工智能史而非数学专属成果，但它提供了符号推理、自动定理证明与机器数学求解随后发展的学科起点背景。

mathematical_novelty:
  type: not_applicable
interfaces:
- not_applicable

claim:
  en: The proposal dated 31 August 1955 proposed a 1956 Dartmouth summer research project under the name “artificial intelligence” and treated learning, abstraction, reasoning and problem solving as machine-research problems.
  zh-CN: 1955 年 8 月 31 日的提案为 1956 年达特茅斯夏季研究计划提出“人工智能”这一名称，并把学习、抽象、推理与问题求解作为机器智能研究问题。

summary:
  en: The proposal did not establish AI4Math as a separate field. It established the broader AI research frame within which mathematical reasoning became one of the earliest domains for testing machine intelligence.
  zh-CN: 该提案并未建立独立的 AI4Math 领域，但确立了更广义的 AI 研究框架，而数学推理很快成为检验机器智能的早期核心场景之一。

why_it_matters:
  en: It provides the historical vocabulary and institutional starting point for understanding why Logic Theorist and other early mathematical reasoning programs were regarded as artificial-intelligence research.
  zh-CN: 它提供了理解 Logic Theorist 等早期数学推理程序为何被视为人工智能研究的历史术语与制度起点。

ai_role:
  level: not_applicable
  description:
    en: This is a field-formation event; no AI system performed mathematical work in the event itself.
    zh-CN: 这是领域形成事件；事件本身没有 AI 系统执行数学任务。

human_contribution:
  description:
    en: John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon formulated the proposal and organized the research program.
    zh-CN: John McCarthy、Marvin Minsky、Nathaniel Rochester 与 Claude Shannon 制订提案并组织研究计划。

