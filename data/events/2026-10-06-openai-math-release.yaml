      en: >-
        OpenAI released the manuscripts, source files and a substantial public
        formalization library. The repository explicitly states that verification stages
        differ across results, that not all manuscripts have Lean formalizations and
        that some unformalized results may contain issues.
      zh-CN: >-
        OpenAI 公开发布手稿、源码以及大规模形式化库。仓库明确说明不同成果处于不同验证阶段，
        并非全部手稿都有 Lean 形式化，而且部分未形式化结果可能存在问题。
  - date: '2026-10-06'
    status: under_verification
    evidence_level: E3
    note:
      en: >-
        AGMAI independently confirmed its consultation role and the importance of public
        scrutiny while explicitly declining to endorse the mathematical claims or certify
        OpenAI's compliance with its recommendations. Aggregate release significance is
        therefore kept separate from per-result mathematical verification.
      zh-CN: >-
        AGMAI 独立确认了其咨询角色以及公开审查的重要性，同时明确不对数学主张背书，也不认证
        OpenAI 已完全遵守其建议。因此 Chronicle 将整体发布的历史意义与逐项数学验证严格分离。

