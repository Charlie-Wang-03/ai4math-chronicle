significance:
  tier: H2
  rationale:
    en: >-
      Holophrasm was an important early neural theorem prover that moved beyond premise scoring to search over complete formal proof trees in Metamath. It combined learned proof-step generation, neural evaluation and bandit-style search in one system, creating a direct historical precursor to later Metamath neural provers and synthetic-data systems such as MetaGen.
    zh-CN: >-
      Holophrasm 是较早具有代表性的神经定理证明器之一，从前提评分进一步走向在 Metamath 中搜索完整形式证明树。它把学习式证明步骤生成、神经评估与 bandit 风格搜索整合到统一系统中，成为后来 Metamath 神经证明器以及 MetaGen 等合成数据系统的直接历史前序。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Daniel Whalen introduced Holophrasm, a neural automated theorem prover for Metamath that explored partial proof trees with a neural-network-augmented bandit algorithm and used a sequence-to-sequence model to enumerate proof actions. The paper reported proving about 14% of its held-out test theorems from Metamath's `set.mm` corpus.
  zh-CN: >-
    Daniel Whalen 提出 Holophrasm：一个面向 Metamath 的神经自动定理证明器，使用神经网络增强的 bandit 算法探索部分证明树，并利用序列到序列模型枚举证明动作。论文报告其在 Metamath `set.mm` 留出测试定理上证明了约 14%。

summary:
  en: >-
    Holophrasm parses Metamath statements into tree structures, learns neural models for proof-step generation and proof-state evaluation, and combines them with search over candidate proof trees. The public release includes model-training and proof-search code, saved proof outputs, and instructions for replaying generated proofs through Metamath's verifier.
  zh-CN: >-
    Holophrasm 将 Metamath 陈述解析为树结构，训练用于证明步骤生成与证明状态评估的神经模型，并与候选证明树搜索结合。公开版本包含模型训练与证明搜索代码、保存的证明结果，以及通过 Metamath verifier 重放和检查生成证明的说明。

why_it_matters:
  en: >-
    The project demonstrated a pre-Transformer route to neural proof generation in which learned models actively construct formal proof steps rather than only rank premises. Its Metamath data-processing and prover structure were reused by later work, including MetaGen, making it a durable part of the lineage of neural formal theorem proving.
  zh-CN: >-
    该项目在 Transformer 时代之前就展示了一条神经证明生成路线：学习模型主动构造形式证明步骤，而不仅仅为前提排序。其 Metamath 数据处理与证明器结构后来被包括 MetaGen 在内的工作继续使用，因此成为神经形式定理证明演化中的重要前序。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      Learned neural models proposed proof actions and evaluated proof states while the search procedure assembled complete formal proofs; successful outputs could then be checked by Metamath without human step-by-step proof construction.
    zh-CN: >-
      学习式神经模型负责提出证明动作并评估证明状态，搜索过程组装完整形式证明；成功输出随后可由 Metamath 检查，无需人类逐步构造证明。

human_contribution:
  description:
    en: >-
      The researcher designed the Metamath parser, neural models, search algorithm, training pipeline and evaluation protocol, and packaged the generated proofs for replay and verification.
    zh-CN: >-
      研究者设计 Metamath 解析器、神经模型、搜索算法、训练流程和评测协议，并将生成证明整理为可重放和验证的形式。

