title:
  en: Natural-language premise selection turns mathematical reference retrieval into a benchmark task
  zh-CN: 自然语言前提选择将数学参考资料检索转化为基准任务

dates:
  event: '2020-04-30'
  first_public_claim: '2020-04-30'
