claim:
  en: >-
    Captain Sude publicly attributed to GPT-6 Astra an unconditional proof that every
    even integer N > 2 can be written as N = a + b with positive integers a and b
    satisfying lambda(a) = lambda(b) = -1. The released paper and Lean theorem state
    this all-even result without GRH or a sufficiently-large restriction. This is a
    Liouville analogue of binary Goldbach, not a proof of the classical Goldbach conjecture.
  zh-CN: >-
    Captain Sude 公开将一项无条件证明归因于 GPT-6 Astra：对每个大于 2 的偶数 N，
    都存在正整数 a、b，使 N = a + b 且 lambda(a) = lambda(b) = -1。公开论文与
    Lean 定理均陈述这一覆盖全部偶数的结论，不依赖 GRH，也没有“充分大”限制。
    这是二元哥德巴赫问题的 Liouville 类比，并非经典哥德巴赫猜想的证明。

summary:
  en: >-
    The public project supplies an authorless mathematical paper, a complete Lean 4
    formalization against mathlib's Liouville function, pinned toolchain metadata,
    build and axiom audits, and proof-route checks. A separate audit repository
    independently rebuilt the frozen v1.0.0 artifact on Linux, matched the source
    hashes, repeated the axiom and route audits, and reported no sorry, custom theorem
    axiom, or native_decide. The public paper and repository do not preserve a detailed
    model–human derivation trace, so the precise division of intellectual labor remains
    source-attributed rather than independently reconstructed by the Chronicle.
  zh-CN: >-
    公开项目提供一篇未署名数学论文、基于 mathlib Liouville 函数的完整 Lean 4
    形式化、固定工具链元数据、构建与公理审计以及证明路线检查。另一个独立审计仓库
    在 Linux 上重新构建冻结的 v1.0.0 产物，对照源码哈希并重复公理与路线审计，
    报告未发现 sorry、自定义定理公理或 native_decide。由于公开论文和仓库没有保存
    详细的模型—人类推导轨迹，Chronicle 对具体智力分工只做来源归因，不作独立重建。

why_it_matters:
  en: >-
    Mangerel's 2024 Shusterman paper obtained the same (-1,-1) sign-pattern conclusion
    only under GRH and for sufficiently large even N. The new release claims to remove
    both restrictions and packages the argument as a reproducible formal artifact.
    If the mathematical novelty and reported Astra provenance continue to withstand
    specialist scrutiny, it is evidence of AI participation in resolving a concrete
    open research problem rather than merely improving a benchmark.
  zh-CN: >-
    Mangerel 2024 年关于 Shusterman 问题的论文，只在 GRH 假设下并对充分大的偶数 N
    得到相同的 (-1,-1) 符号模式结论。此次发布声称同时去掉这两个限制，并把论证
    封装为可复现的形式化产物。如果其数学新颖性与 Astra 来源归因继续经受专业审查，
    该事件将体现 AI 参与解决具体开放研究问题，而不是仅仅提升基准成绩。

ai_role:
  level: unclear
  description:
    en: >-
      Captain Sude publicly attributes the proof discovery to GPT-6 Astra, including
      a first multiples-of-four argument followed by a new route covering every even
      integer greater than two. The released paper and repository do not document
      enough interaction provenance to independently separate model-generated ideas
      from human problem selection, prompting, editing, proof repair, or formalization work.
    zh-CN: >-
      Captain Sude 公开将证明发现归因于 GPT-6 Astra，包括先得到 4 的倍数情形，
      随后找到覆盖全部大于 2 偶数的新路线。但公开论文与仓库没有记录足够详细的
      交互 provenance，无法独立区分模型生成思想与人类的问题选择、提示、编辑、
      证明修复或形式化工作。

human_contribution:
  description:
    en: >-
      Captain Sude maintained and released the public project materials and publicly
      described the Astra attribution. The released record does not document the exact
      human contribution to target selection, prompting, manuscript editing, Lean proof
      repair, or verification, so those roles are not inferred more specifically here.
    zh-CN: >-
      Captain Sude 维护并发布公开项目材料，同时公开说明 Astra 的归因。现有记录没有
      具体说明人类在目标选择、提示、论文编辑、Lean 证明修复或验证中的精确贡献，
      因此本记录不对这些角色作进一步推断。

