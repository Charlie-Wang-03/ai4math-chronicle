significance:
  tier: H2
  rationale:
    en: >-
      The release addresses a named open Liouville–Goldbach problem by giving an
      unconditional all-even theorem where the closest direct predecessor required
      GRH and sufficiently large even inputs. The result is accompanied by a complete
      Lean formalization and an independent technical replay, making it a substantive
      AI-associated research milestone while remaining distinct from the classical
      binary Goldbach conjecture and below the Chronicle's H1 historical threshold.
    zh-CN: >-
      该成果针对一个已有明确记录的 Liouville–Goldbach 开放问题，给出覆盖全部偶数的
      无条件定理，而最直接的前驱结果仍依赖 GRH 且只适用于充分大的偶数。公开成果同时
      提供完整 Lean 形式化，并已有独立技术重放，因此足以构成实质性的 AI 参与研究里程碑；
      但它不同于经典二元哥德巴赫猜想，且目前尚不足以达到 Chronicle 的 H1 历史级门槛。

