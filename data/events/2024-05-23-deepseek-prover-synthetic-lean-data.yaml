significance:
  tier: H2
  rationale:
    en: DeepSeek-Prover demonstrated that large-scale synthetic Lean data could materially raise whole-proof generation performance.
    zh-CN: DeepSeek-Prover 展示了大规模合成 Lean 数据能够显著提升整段形式证明生成能力。
mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic
claim:
  en: DeepSeek-Prover trained on a synthetic corpus containing about eight million formal statements with proofs and reported 52% cumulative accuracy on Lean 4 miniF2F plus five FIMO proofs.
  zh-CN: DeepSeek-Prover 在包含约 800 万条带证明形式命题的合成语料上训练，并报告 Lean 4 miniF2F 累计 52% 的证明率以及 5 道 FIMO 证明。
summary:
  en: Natural-language competition problems are translated into Lean statements, filtered, proved and recycled as synthetic training data.
  zh-CN: 自然语言竞赛题被翻译为 Lean 陈述、过滤、搜索证明，再作为合成训练数据回流。
why_it_matters:
  en: The work established synthetic formal-data generation as a scalable route to stronger neural theorem provers.
  zh-CN: 该工作确立了“合成形式数据生成”作为扩展神经定理证明器的重要路线。
ai_role:
  level: ai_primary_human_verified
  description:
    en: Models generate formal statements and whole proofs that Lean checks mechanically.
    zh-CN: 模型生成形式命题与整段证明，由 Lean 进行机械检查。
human_contribution:
  description:
    en: Researchers designed the translation, filtering, proof-generation and training pipeline.
    zh-CN: 研究者设计翻译、过滤、证明生成与训练管线。
