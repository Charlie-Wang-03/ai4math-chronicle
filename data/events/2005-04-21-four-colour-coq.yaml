significance:
  tier: H2
  rationale:
    en: >-
      Gonthier's Coq development showed that a celebrated theorem whose earlier proof depended on extensive custom computation could be recast as a fully machine-checked formal proof covering both mathematical and computational reasoning.
    zh-CN: >-
      Gonthier 的 Coq 工程展示了：一个此前高度依赖定制计算的著名定理，可以被重构为同时覆盖数学论证与计算部分的完整机器检查形式证明。

mathematical_novelty:
  type: formalization_of_known_result
interfaces:
- formal
- symbolic

claim:
  en: >-
    By 21 April 2005, Georges Gonthier's report “A computer-checked proof of the Four Colour Theorem” was publicly circulating and described a successful formalization fully checked by Coq v7.3.1.
  zh-CN: >-
    至 2005 年 4 月 21 日，Georges Gonthier 的“A computer-checked proof of the Four Colour Theorem”报告已公开传播，其中描述了由 Coq v7.3.1 完整检查的成功形式化证明。

summary:
  en: >-
    The formal development encoded the combinatorial argument and computational case checking inside Coq so that correctness reduced to the proof assistant's general verification mechanisms rather than theorem-specific external programs.
  zh-CN: >-
    该形式化把组合论证与计算机分类检查都纳入 Coq，使正确性依赖通用证明助手验证机制，而非四色定理专用外部程序。

why_it_matters:
  en: >-
    It became a landmark demonstration that large computer-assisted proofs could be transformed into auditable machine-checked mathematics.
  zh-CN: >-
    它成为大型计算机辅助证明可以转化为可审计机器检查数学的标志性示范。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      Humans engineered the formal proof while Coq executed and checked all formal logical and computational steps.
    zh-CN: >-
      人类设计形式证明工程，Coq 执行并检查全部形式逻辑与计算步骤。

human_contribution:
  description:
    en: >-
      Georges Gonthier designed and implemented the formalization, proof scripts, tactics and mathematical encodings.
    zh-CN: >-
      Georges Gonthier 设计并实现形式化、证明脚本、tactics 与数学编码。

