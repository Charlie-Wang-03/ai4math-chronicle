    note:
      en: >-
        Palomar's own public statement and service document the registry rules and
        machine-readable records. Terence Tao's announcement establishes the 18 August
        opening date, and ICARM independently documents the launch and three-part
        automated checking workflow. This verifies the infrastructure event, not every
        registered mathematical result.
      zh-CN: >-
        Palomar 官方声明和服务页面记录注册规则及机器可读记录；Terence Tao 的公告确认
        8 月 18 日开放日期，ICARM 另行记录发布及三部分自动检查工作流。这些证据支持
        基础设施事件本身，并不等于验证其中每一条注册数学结果。

