significance:
  tier: H2
  rationale:
    en: >-
      AGMAI's responsible-release recommendations are a field-building milestone because
      they translate the 2026 debate over AI-generated mathematics into a concrete,
      public set of norms for frontier AI labs. The recommendations address human
      understanding, publication channels, citations, provenance, model and prompt
      disclosure, compute reporting, formalization standards, failure disclosure,
      community-led assimilation and equitable access. They were informed by more than
      six hundred community responses and were subsequently discussed with OpenAI before
      its large October mathematics release.
    zh-CN: >-
      AGMAI 的负责任发布建议构成领域建构里程碑，因为它把 2026 年围绕 AI 生成数学成果的
      争论转化为一套面向前沿 AI 实验室的公开、具体规范。建议覆盖人类理解、发布渠道、
      引用、provenance、模型与 prompt 披露、算力报告、形式化标准、失败样本披露、
      共同体主导的成果吸收以及公平访问。该规范吸收了六百余份共同体反馈，并在 OpenAI
      10 月大规模数学成果发布前与其进行了讨论。

