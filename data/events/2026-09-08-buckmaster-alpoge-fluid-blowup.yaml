verification:
  evidence_level: E3
  status: partially_verified
  formal_assurance: artifact_available
  history:
    - date: "2026-09-08"
      status: paper_released
      evidence_level: E3
      note:
        en: >-
          Three manuscripts and a public Lean repository were released. The repository contains dedicated formalization projects for Euler and Boussinesq, while no corresponding IPM Lean project is present in the public repository tree.
        zh-CN: >-
          三份稿件与一个公开 Lean 仓库同期发布。该仓库包含 Euler 与 Boussinesq 的专门形式化项目，而公开仓库目录中没有对应的 IPM Lean 项目。
    - date: "2026-09-11"
      status: partially_verified
      evidence_level: E3
      note:
        en: >-
          Terence Tao independently discussed the mathematical work and its relationship to the Córdoba–Martínez-Zoroa program, and OpenAI independently acknowledged Buckmaster and Alpöge's priority on the forced Euler result. These sources corroborate the event and its historical context but are not treated here as independent verification of all three underlying theorems or as an independent replay of the Lean artifacts.
        zh-CN: >-
          Terence Tao 独立讨论了这项数学工作及其与 Córdoba–Martínez-Zoroa 研究路线的关系；OpenAI 也独立承认 Buckmaster 与 Alpöge 在 forced Euler 结果上的优先权。这些来源佐证了事件及其历史背景，但 Chronicle 不据此认定三个底层定理均已得到独立验证，也不视为对 Lean 产物的独立重放。

