title:
  en: Buckmaster and Alpöge release AI-assisted smooth-forcing blowup results for Euler, Boussinesq and IPM
  zh-CN: Buckmaster 与 Alpöge 发布 AI 辅助的 Euler、Boussinesq 与 IPM 光滑外力爆破结果

