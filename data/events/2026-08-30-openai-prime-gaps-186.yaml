significance:
  tier: H1
  rationale:
    en: >-
      This result is a Historical Milestone because it is an AI-attributed advance on a
      prominent frontier problem in analytic number theory rather than a benchmark or a
      reformulation of known mathematics. The OpenAI preprint claims the bound
      liminf(p_(n+1)-p_n) <= 186, improving the long-standing 246 record of Polymath8b;
      Terence Tao's Optimization Problems record lists 186 as the current best known
      upper bound and notes that 246 had stood for twelve years. The result is accompanied
      by a substantial Lean and numerical verification artifact. Historical significance
      is recorded separately from the still-incomplete verification of the mathematical
      inputs and provenance.
    zh-CN: >-
      该结果被列为 Historical Milestone，因为它不是 benchmark 提升或对已知数学的重新
      形式化，而是一个被归因于 AI 的解析数论前沿推进。OpenAI 预印本声称得到
      liminf(p_(n+1)-p_n) <= 186，把 Polymath8b 长期保持的 246 上界进一步降低；
      Terence Tao 的 Optimization Problems 记录把 186 列为当前最好已知上界，并注明
      246 纪录保持了十二年。该成果同时提供大规模 Lean 与数值验证产物。这里的历史
      重要性与数学输入及 provenance 仍未完全验证的状态严格分开记录。

mathematical_novelty:
  type: new_result

interfaces:
- informal
