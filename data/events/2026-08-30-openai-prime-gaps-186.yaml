claim:
  en: >-
    OpenAI's 30 August 2026 preprint claims that GPT-6 Astra found a proof establishing
    DHL[40,2], which, when applied to an explicit admissible 40-tuple of diameter 186,
    yields liminf_(n->infinity)(p_(n+1)-p_n) <= 186 for consecutive prime gaps.
    The result improves the prior 246 record associated with Polymath8b and predates
    Julia Stadlmann's independently obtained 240 bound by one day.
  zh-CN: >-
    OpenAI 在 2026 年 8 月 30 日发布的预印本声称 GPT-6 Astra 找到了一项证明，
    建立 DHL[40,2]；将其应用于一个直径为 186 的显式 admissible 40-tuple，可得到
    连续素数间隔满足 liminf_(n->infinity)(p_(n+1)-p_n) <= 186。该结果改进了
    Polymath8b 对应的 246 纪录，并比 Julia Stadlmann 独立得到的 240 上界早一天发布。

summary:
  en: >-
    The public PrimeGaps186 repository contains a Lean 4 development for DHL[40,2] and
    the 186 prime-gap consequence together with a Python/FLINT numerical certificate.
    The registered main Lean declarations contain no sorry, and OpenAI reports that
    Comparator, Nanoda and Lean's kernel accepted the conditional proofs. The formal
    development nevertheless depends on three explicit project axioms: a rank-three
    hyper-Kloosterman estimate, a rank-two Kloosterman correlation estimate, and a
    collection of physical-integral and cap bounds. The first two are attributed to
    established literature; the numerical input is checked by the companion certificate
    rather than proved inside Lean. OpenAI's own metadata labels the review self-assessed
    and states that no independent human semantic review had been completed.
  zh-CN: >-
    公开的 PrimeGaps186 仓库包含 DHL[40,2] 与 186 素数间隔结论的 Lean 4 开发，
    并附带 Python/FLINT 数值 certificate。登记的主要 Lean declaration 均无 sorry，
    OpenAI 报告 Comparator、Nanoda 与 Lean kernel 均接受这些条件式证明。但形式化
    仍依赖三个显式项目公理：一个 rank-three hyper-Kloosterman 估计、一个 rank-two
    Kloosterman correlation 估计，以及一组 physical-integral 与 cap bounds。前两个
    输入来自既有文献；数值输入由配套 certificate 检查，而没有在 Lean 内证明。
    OpenAI 自身的 metadata 将审查状态标为 self-assessed，并明确说明尚无独立人类
    semantic review。

why_it_matters:
  en: >-
    The bounded-prime-gap problem is one of the best-known modern examples of sustained
    progress on the distribution of primes. Moving the unconditional published record
    from 246 to 186 after roughly twelve years would be mathematically notable on its own;
    having the proof publicly attributed to a frontier AI model makes the event a direct
    test case for AI systems contributing new frontier mathematics. The accompanying
    formal artifact also illustrates a new verification boundary: machine checking can
    strongly validate a large conditional derivation while still leaving cited and
    numerical inputs outside the proof assistant.
  zh-CN: >-
    有界素数间隔问题是现代素数分布研究中最知名的持续推进路线之一。在约十二年后把公开
    无条件纪录从 246 推进至 186，本身就具有显著数学意义；而证明又被公开归因于前沿 AI
    模型，使该事件成为 AI 系统直接贡献新前沿数学的代表案例。配套形式化同时清楚展示一种
    新的验证边界：机器检查可以强力验证庞大的条件式推导，但被引用的数学估计和数值输入
    仍可能位于 proof assistant 之外。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      OpenAI and the public formalization metadata attribute the proof to GPT-6 Astra
      operating through Codex. The metadata also states that the artifact was refined
      through human-guided edits and automated proof checks. This AI-role classification
      records the disclosed workflow; it does not mean that Chronicle independently
      reconstructed the full model-human derivation trace.
    zh-CN: >-
      OpenAI 及公开 formalization metadata 将证明归因于通过 Codex 工作的 GPT-6 Astra，
      同时注明产物经过 human-guided edits 与自动证明检查。本 AI-role 分类记录的是公开
      披露的工作流，并不表示 Chronicle 已独立重建完整的模型—人类推导轨迹。

human_contribution:
  description:
    en: >-
      Humans selected and released the research target and artifacts, guided refinement
      of the generated formal development, connected unproved mathematical estimates to
      the literature, and built or reviewed the numerical-certificate and checking
      pipeline. The public metadata does not provide a complete person-by-person division
      of intellectual labor.
    zh-CN: >-
      人类负责研究目标与成果的选择和发布，引导生成式形式化的修订，把未在 Lean 中证明的
      数学估计对应到既有文献，并建立或审查数值 certificate 与验证流程。公开 metadata
      没有提供完整的逐人智力分工记录。

