significance:
  tier: H2
  rationale:
    en: >-
      The alliance is a field-building milestone because it creates a standing
      multi-institutional AI4Math organization spanning eight major mathematical
      institutes and roughly one thousand researchers, with explicit plans for
      mathematics-specific foundation models, shared training resources, formal-mathematics
      libraries, computing infrastructure and AI-assisted theorem proving and conjecture
      discovery. Its significance is institutional scale and durable shared infrastructure,
      not a single model or mathematical result.
    zh-CN: >-
      该联盟构成领域建构里程碑，因为它由八家主要数学研究机构共同建立，汇聚约千名科研人员，
      并明确规划数学专用基础模型、共享训练资源、形式化数学库、算力平台以及 AI 辅助证明与
      猜想发现。其历史意义来自跨机构规模和持续性共享基础设施，而不是某一个模型或数学成果。

