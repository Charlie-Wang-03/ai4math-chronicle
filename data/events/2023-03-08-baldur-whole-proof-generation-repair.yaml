title:
  en: Baldur generates and repairs whole formal proofs with language models
  zh-CN: Baldur 使用语言模型生成并修复完整形式证明

dates:
  event: '2023-03-08'
  first_public_claim: '2023-03-08'
  paper_release: '2023-03-08'
  artifact_release: null
  independently_verified: null
  added_to_chronicle: '2026-09-11'
