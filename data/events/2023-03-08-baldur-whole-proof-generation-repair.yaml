event_types:
- proof
- system

significance:
  tier: H2
  rationale:
    en: >-
      Baldur established whole-proof generation plus checker-guided proof repair as a distinct alternative to step-by-step formal proof search, showing that a transformer could emit complete Isabelle/HOL proofs and use failed attempts and error messages as repair context.
    zh-CN: >-
      Baldur 将“完整证明生成 + 检查器反馈修复”确立为逐步形式证明搜索之外的一条独立路线，展示 Transformer 可以一次生成完整 Isabelle/HOL 证明，并利用失败证明与错误信息进行修复。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic
- hybrid

claim:
  en: >-
    On a benchmark of 6,336 Isabelle/HOL theorems, Baldur generated whole proofs and repaired failed generations, proving an additional 8.7% of theorems beyond Thor; the paper reported that Baldur and Thor together proved 65.7% fully automatically.
  zh-CN: >-
    在包含 6,336 个 Isabelle/HOL 定理的基准上，Baldur 生成完整证明并修复失败结果；论文报告它相较 Thor 额外证明了 8.7% 的定理，而 Baldur 与 Thor 合计可全自动证明 65.7%。

summary:
  en: >-
    Instead of predicting one proof step and searching over continuations, Baldur fine-tuned language models to generate an entire proof in one pass. A separate repair model then received a failed proof attempt together with proof-assistant error feedback and proposed a corrected proof.
  zh-CN: >-
    与逐步预测证明动作并搜索后续路径不同，Baldur 微调语言模型一次生成完整证明；随后由独立的修复模型读取失败证明及证明助手的错误反馈，再提出修正后的证明。

why_it_matters:
  en: >-
    The work made complete-proof synthesis and feedback-driven repair a credible formal-reasoning pattern, complementing search-heavy theorem provers and anticipating later generate-check-revise workflows.
  zh-CN: >-
    该工作使完整证明合成与反馈驱动修复成为可信的形式推理模式，补充了依赖搜索的定理证明路线，并预示了后来常见的“生成—检查—修订”工作流。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      Fine-tuned language models generated complete candidate proofs and repaired failed attempts using checker feedback; Isabelle/HOL mechanically accepted or rejected the resulting proof text.
    zh-CN: >-
      微调后的语言模型生成完整候选证明，并根据检查器反馈修复失败尝试；Isabelle/HOL 对最终证明文本进行机械接受或拒绝。

human_contribution:
  description:
    en: >-
      Researchers designed the whole-proof and repair training setup, assembled the evaluation protocol, trained the models and analyzed performance against prior theorem-proving systems.
    zh-CN: >-
      研究者设计完整证明与修复训练方案、构建评测流程、训练模型，并分析其相对既有定理证明系统的表现。

