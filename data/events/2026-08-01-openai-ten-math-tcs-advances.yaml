verification:
  evidence_level: E3
  status: disputed
  formal_assurance: machine_checked
  history:
  - date: '2026-08-01'
    status: under_verification
    evidence_level: E2
    note:
      en: The Chronicle records this event from the cited primary or official source; the status does not imply independent Chronicle verification.
      zh-CN: Chronicle 依据所引 primary / official source 记录该事件；该状态不表示 Chronicle 已完成独立验证。
  - date: '2026-09-10'
    status: under_verification
    evidence_level: E3
    note:
      en: The Chronicle confirmed that OpenAI publicly released the 253-page paper and a repository containing Lean 4 certificates for all ten results. These primary artifacts strengthen the evidence record but do not by themselves establish independent mathematical verification.
      zh-CN: Chronicle 已确认 OpenAI 公开发布 253 页论文，以及包含全部十项结果 Lean 4 certificates 的仓库。这些一手产物加强了证据记录，但其本身不足以构成独立数学验证。
  - date: '2026-09-10'
    status: independently_verified
    evidence_level: E3
    note:
      en: >-
        Independent technical and media coverage corroborates the core publication event: OpenAI released ten claimed mathematics/TCS advances together with a long paper and public Lean certificates. The Chronicle's `independently_verified` label concerns that event-level record; it does not certify that every one of the ten underlying mathematical claims has completed independent expert review.
      zh-CN: >-
        独立技术评论与媒体报道已经对该发布事件的核心事实形成佐证：OpenAI 公开了十项数学 / TCS 研究进展主张、一份长篇论文以及公开 Lean certificates。Chronicle 的 `independently_verified` 标签针对这一事件级记录，并不表示十项底层数学主张都已完成独立专家审查。
  - date: '2026-09-11'
    status: disputed
    evidence_level: E3
    note:
      en: >-
        Reliable independent reporting and Andreas Thom's public account document a material attribution and provenance dispute around the non-sofic-groups result, one of the ten published advances. The dispute concerns the initial treatment of recent Kun–Thom work and an unresolved question about whether unpublished ChatGPT research discussions could have contributed indirectly through model-improvement training data. The Chronicle does not assert that such data use occurred; the publication event and released artifacts remain independently corroborated.
      zh-CN: >-
        可靠独立报道与 Andreas Thom 的公开说明记录了十项进展之一——非 sofic 群结果——所涉及的实质性归属与来源争议。争议包括最初对 Kun–Thom 近期工作的呈现，以及一个尚未解决的问题：未公开的 ChatGPT 数学研究讨论是否可能通过模型改进训练数据间接产生影响。Chronicle 不断言此类数据使用确实发生；该发布事件及其公开产物本身仍有独立佐证。
