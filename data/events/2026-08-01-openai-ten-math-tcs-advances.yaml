significance:
  tier: H1
  rationale:
    en: A portfolio of AI-generated advances across multiple active areas of mathematics and theoretical computer science marks a historical shift from isolated successes toward repeated research-level mathematical contributions; H1 records that historical significance without upgrading the still-pending verification of the individual results.
    zh-CN: 跨多个活跃数学与理论计算机科学领域的一组 AI 生成研究进展，标志着从孤立成功走向可重复研究级数学贡献的历史性转折；H1 记录的是这一历史重要性，并不提升各项结果仍待审查的 verification 状态。
mathematical_novelty:
  type: new_result
interfaces:
- informal
- formal
- symbolic
- hybrid
claim:
  en: OpenAI released ten results resolving or substantially advancing longstanding problems in areas including sphere packing, group theory, circuit complexity, quantum complexity, lattice problems and extremal combinatorics.
  zh-CN: OpenAI 发布十项结果，声称解决或实质推进球堆积、群论、算术电路复杂度、量子复杂性、格问题与极值组合等领域的长期问题。
summary:
  en: OpenAI states that an internal Astra model generated the mathematical arguments, humans prepared manuscripts with the model, and the model formalized each argument into a Lean certificate.
  zh-CN: OpenAI 表示内部 Astra 模型生成数学论证，人类与模型共同整理稿件，随后模型把每项论证形式化为 Lean certificate。
why_it_matters:
  en: If the individual results survive expert review, the release indicates a shift from isolated AI mathematics successes toward repeated research-level contributions.
  zh-CN: 如果这些结果经受住专家审查，该发布意味着 AI 数学可能从孤立成功转向可重复的研究级贡献。
ai_role:
  level: autonomous_primary
  description:
    en: OpenAI attributes the mathematical arguments to its internal Astra model and says the model also produced Lean formalizations.
    zh-CN: OpenAI 将数学论证归因于内部 Astra 模型，并称模型还生成了 Lean 形式化。
human_contribution:
  description:
    en: Humans selected problems, prepared manuscripts with the model and take responsibility for correctness; broader community review is still relevant.
    zh-CN: 人类选择问题、与模型整理稿件并对正确性负责；更广泛的社区审查仍然重要。
