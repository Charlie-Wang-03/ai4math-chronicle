significance:
  tier: H1
  rationale:
    en: A portfolio of AI-generated advances across multiple active areas of mathematics and theoretical computer science marks a historical shift from isolated successes toward repeated research-level mathematical contributions; H1 records the historical importance of the publication event separately from the ultimate correctness or reception of each individual result.
    zh-CN: 跨多个活跃数学与理论计算机科学领域的一组 AI 生成研究进展，标志着从孤立成功走向可重复研究级数学贡献的历史性转折；H1 记录的是该发布事件的历史重要性，与其中每项结果最终是否正确或如何被学界接受分开判断。
mathematical_novelty:
  type: new_result
interfaces:
- informal
- formal
- symbolic
- hybrid
claim:
  en: OpenAI released ten results resolving or substantially advancing longstanding problems in areas including sphere packing, group theory, circuit complexity, quantum complexity, lattice problems and extremal combinatorics.
  zh-CN: OpenAI 发布十项结果，声称解决或实质推进球堆积、群论、算术电路复杂度、量子复杂性、格问题与极值组合等领域的长期问题。
summary:
  en: OpenAI states that an internal Astra model generated the mathematical arguments, humans prepared manuscripts with the model, and the model formalized each argument into a Lean certificate. Subsequent reporting documented attribution and training-data provenance concerns around the non-sofic-groups result, including Andreas Thom's unresolved question about whether unpublished mathematical discussions conducted through ChatGPT could have contributed indirectly through model-improvement data.
  zh-CN: OpenAI 表示内部 Astra 模型生成数学论证，人类与模型共同整理稿件，随后模型把每项论证形式化为 Lean certificate。后续报道记录了围绕非 sofic 群结果的归属与训练数据来源争议，其中包括 Andreas Thom 尚未得到解决的问题：他与同事通过 ChatGPT 进行的未公开数学讨论，是否可能通过模型改进数据间接影响相关系统。
why_it_matters:
  en: If the individual results survive expert review, the release indicates a shift from isolated AI mathematics successes toward repeated research-level contributions.
  zh-CN: 如果这些结果经受住专家审查，该发布意味着 AI 数学可能从孤立成功转向可重复的研究级贡献。
ai_role:
  level: autonomous_primary
  description:
    en: OpenAI attributes the mathematical arguments to its internal Astra model and says the model also produced Lean formalizations. The provenance dispute does not establish that unpublished user material was used, but it leaves an unresolved question about whether the model's research route may have been influenced by de-identified model-improvement data.
    zh-CN: OpenAI 将数学论证归因于内部 Astra 模型，并称模型还生成了 Lean 形式化。当前 provenance 争议并未证明未公开用户材料确实被使用，但仍留下一个尚未解决的问题：模型的研究路径是否可能受到去标识化模型改进数据的间接影响。
human_contribution:
  description:
    en: Humans selected problems, prepared manuscripts with the model and take responsibility for correctness; broader community review is still relevant. For the non-sofic-groups result specifically, OpenAI's proof builds substantially on prior work by Gábor Kun and Andreas Thom, whose contribution and the public framing of that result became part of the subsequent attribution discussion.
    zh-CN: 人类选择问题、与模型整理稿件并对正确性负责；更广泛的社区审查仍然重要。具体到非 sofic 群结果，OpenAI 的证明大量建立在 Gábor Kun 与 Andreas Thom 的既有工作之上；两人的贡献以及该结果最初的公开表述随后成为归属讨论的一部分。
