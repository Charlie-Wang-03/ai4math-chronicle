  rationale:
    en: FM:OP created a denominator for autonomous mathematical discovery by tracking significant unsolved problems whose candidate solutions can be computationally verified.
    zh-CN: FM:OP 通过跟踪可计算验证候选解的显著未解问题，为衡量自主数学发现提供了一个更有意义的“分母”。
