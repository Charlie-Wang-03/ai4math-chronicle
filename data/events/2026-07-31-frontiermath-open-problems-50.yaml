  type: tooling_only
interfaces:
- informal
- symbolic
- numeric
- hybrid
claim:
  en: 'Epoch AI expanded FrontierMath: Open Problems to 50 significant unsolved research problems and tracked AI solutions separately by mathematical notability.'
  zh-CN: 'Epoch AI 将 FrontierMath: Open Problems 扩展到 50 个重要未解研究问题，并按数学重要性分层跟踪 AI 解答。'
summary:
  en: Problems are selected by mathematicians, paired with bespoke computational verifiers where possible, and categorized by the significance of a solution.
  zh-CN: 问题由数学家筛选，并尽可能配套专用计算验证器，同时按解答的重要性进行分级。
why_it_matters:
  en: The benchmark focuses evaluation on whether AI advances human mathematical knowledge rather than only reproducing known solutions.
  zh-CN: 该基准把评测重点放在 AI 是否真正推进人类数学知识，而不只是复现已知答案。
ai_role:
  level: computation_only
  description:
    en: Frontier systems attempt open problems under long-horizon scaffolds and are tested by problem-specific verifiers.
    zh-CN: 前沿系统在长程脚手架下尝试开放问题，并由问题专用验证器检查候选解。
human_contribution:
  description:
    en: Mathematicians propose and review problems while Epoch AI builds verifiers and maintains attribution and solution status.
    zh-CN: 数学家提出并审核问题，Epoch AI 构建验证器并维护归属与解答状态。
