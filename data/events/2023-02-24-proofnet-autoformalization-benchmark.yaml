title:
  en: ProofNet benchmarks autoformalization and proving of undergraduate mathematics
  zh-CN: ProofNet 建立本科数学自动形式化与形式证明基准
dates:
  event: '2023-02-24'
  first_public_claim: '2023-02-24'
