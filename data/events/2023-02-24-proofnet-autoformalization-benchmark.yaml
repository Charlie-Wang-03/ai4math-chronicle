significance:
  tier: H2
  rationale:
    en: ProofNet broadened evaluation beyond Olympiad statements to textbook-level undergraduate mathematics and paired informal statements, proofs and Lean formalizations.
    zh-CN: ProofNet 把评测从奥赛题扩展到本科教材数学，并配对自然语言陈述、证明与 Lean 形式化。
mathematical_novelty:
  type: tooling_only
interfaces:
- informal
- formal
- hybrid
claim:
  en: ProofNet introduced 371 undergraduate-level examples pairing natural-language theorem statements and proofs with Lean 3 formal statements.
  zh-CN: ProofNet 引入 371 个本科层次样例，将自然语言定理陈述与证明和 Lean 3 形式陈述配对。
summary:
  en: The benchmark covers analysis, linear algebra, abstract algebra, topology and other textbook mathematics.
  zh-CN: 该基准覆盖分析、线性代数、抽象代数、拓扑等本科教材数学。
why_it_matters:
  en: It created a shared target for measuring whether models can translate ordinary mathematical prose into proof-assistant representations.
  zh-CN: 它为衡量模型能否把普通数学文本转化为证明助手表示建立了共享目标。
ai_role:
  level: computation_only
  description:
    en: Models are evaluated on autoformalization and formal proving tasks built from the benchmark.
    zh-CN: 模型在该基准构建的自动形式化与形式证明任务上接受评测。
human_contribution:
  description:
    en: Researchers curated textbook problems, natural-language proofs and corresponding Lean statements.
    zh-CN: 研究者整理教材题目、自然语言证明与对应 Lean 陈述。
