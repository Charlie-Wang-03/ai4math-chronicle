schema_version: 1
id: evt-2024-minictx
slug: minictx-long-context-theorem-proving
title:
  en: miniCTX tests theorem provers on long, unseen project context
  zh-CN: miniCTX 测试定理证明器使用长篇、未见项目上下文的能力
dates:
  event: '2024-08-05'
  first_public_claim: '2024-08-05'
  paper_release: '2024-08-05'
  artifact_release: null
  independently_verified: null
  added_to_chronicle: '2026-09-10'
