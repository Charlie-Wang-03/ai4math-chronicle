event_types:
- benchmark
- dataset
- infrastructure
significance:
  tier: H2
  rationale:
    en: miniCTX moved evaluation toward repository-scale theorem proving where definitions and lemmas live in long, previously unseen context.
    zh-CN: miniCTX 把评测推进到仓库级定理证明：所需定义与引理存在于长篇、训练时未见的上下文中。
mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic
claim:
  en: miniCTX introduced Lean theorem-proving tasks with repository context spanning up to tens of thousands of tokens and showed that context-aware methods outperform state-only baselines.
  zh-CN: miniCTX 引入带有可达数万 token 仓库上下文的 Lean 定理证明任务，并显示利用上下文的方法明显优于只看 proof state 的基线。
summary:
  en: The benchmark draws theorems from real Lean projects and textbooks and includes tooling for extracting new project contexts.
  zh-CN: 该基准从真实 Lean 项目和教材中抽取定理，并提供提取新项目上下文的工具。
why_it_matters:
  en: It better approximated the conditions faced by practical proof agents operating inside large formal codebases.
  zh-CN: 它更接近实际证明 Agent 在大型形式化代码库中工作的真实条件。
ai_role:
  level: computation_only
  description:
    en: Models must retrieve and use relevant definitions and lemmas from long project context while proving.
    zh-CN: 模型在证明过程中必须从长篇项目上下文中检索并利用相关定义与引理。
human_contribution:
  description:
    en: Researchers constructed the benchmark and ntp-toolkit for context-aware theorem-proving data extraction.
    zh-CN: 研究者构建基准与 ntp-toolkit，用于提取上下文感知的定理证明数据。
