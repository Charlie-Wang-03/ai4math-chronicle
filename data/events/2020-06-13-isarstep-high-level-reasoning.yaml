significance:
  tier: H2
  rationale:
    en: >-
      IsarStep created a large non-synthetic benchmark from human-written Isabelle proofs and focused evaluation on recovering missing intermediate propositions rather than only predicting low-level tactics. It helped establish high-level proof-step generation over real formal mathematics as a distinct learning problem before later language-model theorem-proving systems scaled similar ideas.
    zh-CN: >-
      IsarStep 从人工编写的 Isabelle 证明中构建大规模非合成 benchmark，并把评测重点放在恢复缺失的中间命题，而不只是预测低层 tactic。它推动“在真实形式数学中生成高层证明步骤”成为独立学习问题，早于后来语言模型定理证明系统对类似路线的扩展。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Wenda Li, Lei Yu, Yuhuai Wu and Lawrence C. Paulson introduced IsarStep, a benchmark mined from Isabelle's Archive of Formal Proofs in which models must predict a missing intermediate proposition from surrounding proof context, covering undergraduate- and research-level mathematics and computer science material.
  zh-CN: >-
    Wenda Li、Lei Yu、Yuhuai Wu 与 Lawrence C. Paulson 提出 IsarStep：一个从 Isabelle Archive of Formal Proofs 中抽取的 benchmark，要求模型根据周围证明上下文预测缺失的中间命题，覆盖本科与研究级数学及计算机科学形式化内容。

summary:
  en: >-
    IsarStep converts declarative Isar proofs into sequence-to-sequence examples where a proof fragment has an intermediate proposition removed. The task tests whether a model can reconstruct a semantically useful bridge between surrounding proof states, and the authors evaluated Transformer-based baselines including a hierarchical architecture designed for long proof context.
  zh-CN: >-
    IsarStep 将声明式 Isar 证明转换为序列到序列样本，并移除其中的中间命题。任务要求模型重建连接前后证明状态的语义桥梁；作者评测了 Transformer 类基线，并设计面向长证明上下文的分层架构。

why_it_matters:
  en: >-
    The benchmark shifted part of learned theorem proving toward human-readable intermediate reasoning over real proof corpora. Together with contemporaneous formal-math pretraining work, it supplied an important pre-LLM testbed for learning reusable mathematical representations and proof steps from mature proof-assistant libraries.
  zh-CN: >-
    该 benchmark 将部分学习式定理证明研究从低层动作预测推进到真实证明语料上的可读中间推理。它与同期形式数学预训练研究一起，为后来的 LLM 时代之前从成熟证明助手数学库学习可复用数学表示与证明步骤提供了重要试验场。

ai_role:
  level: computation_only
  description:
    en: >-
      Neural sequence models were trained and evaluated to predict missing formal propositions from proof context; the underlying Isabelle developments, benchmark extraction and evaluation protocol were human-authored or researcher-designed.
    zh-CN: >-
      神经序列模型被训练和评测，用于根据证明上下文预测缺失的形式命题；底层 Isabelle 证明、benchmark 抽取和评测协议由人类编写或研究者设计。

human_contribution:
  description:
    en: >-
      Researchers mined and processed the Isabelle proof corpus, defined the missing-proposition task and data splits, designed sequence-to-sequence and hierarchical Transformer baselines, and evaluated model generalization on held-out proofs.
    zh-CN: >-
      研究者抽取并处理 Isabelle 证明语料、定义缺失命题任务与数据划分、设计序列到序列及分层 Transformer 基线，并在留出证明上评估模型泛化能力。

