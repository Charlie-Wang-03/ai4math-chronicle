significance:
  tier: H2
  rationale:
    en: >-
      AITP is a field-building milestone because its 2016 inaugural meeting created a dedicated scholarly forum at the intersection of artificial intelligence, automated and interactive theorem proving, machine learning, proof assistants and computer-understandable mathematics. The series then continued annually through 2026, with a 2027 edition announced, demonstrating durable institutional continuity rather than a one-off workshop.
    zh-CN: >-
      AITP 构成领域建构里程碑，因为其 2016 年首届会议建立了一个专门连接人工智能、自动与交互式定理证明、机器学习、证明助手和机器可理解数学的学术论坛。该系列随后持续每年举办至 2026 年，并已公布 2027 年会议，体现出持续性的学术制度化，而非一次性 workshop。

