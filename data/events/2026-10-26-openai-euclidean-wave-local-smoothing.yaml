significance:
  tier: H1
  rationale:
    en: >-
      A proof in every spatial dimension would connect a longstanding question about wave propagation to
      sharp bounds for thin tubes and to the dimension of Kakeya sets. The public manuscript and precise
      formal statements make the claim open to mathematical scrutiny.
    zh-CN: 若在所有空间维数成立，该结果将把波传播中的长期公开问题与细管极大估计、Kakeya 集的维数联系起来。公开的手稿与形式命题使同行能够逐项审查这一主张。

mathematical_novelty:
  type: new_result

interfaces:
  - informal
  - formal

claim:
  en: >-
    OpenAI reports a model-generated proof of Sogge’s Euclidean local smoothing conjecture in spatial dimensions
    two and higher. Among the stated consequences are the Kakeya maximal estimate with arbitrarily small
    power loss and full Hausdorff dimension for Euclidean Kakeya sets.
  zh-CN: >-
    OpenAI 报告其模型给出了 Sogge 欧氏局部光滑性猜想在所有空间维数 n ≥ 2 的证明。公布的推论包括允许任意小幂次损失的 Kakeya 极大估计，以及欧氏 Kakeya 集具有满 Hausdorff
    维数。

summary:
  en: >-
    The manuscript studies spatial regularity gained by averaging a wave over time. Its argument introduces
    an auxiliary PDE. The companion Lean scope document identifies the half-wave inequality, Kakeya statements
    and spherical extension estimates in their stated parameter ranges.
  zh-CN: 手稿研究对时间取平均后，波的空间正则性可以改善多少，并引入了一个辅助偏微分方程。配套 Lean 文档逐项列出半波估计、Kakeya 命题以及限定参数范围内的球面延拓估计。

why_it_matters:
  en: >-
    The release lets analysts compare the manuscript’s harmonic analysis with the quantifiers, parameter
    ranges and losses in the formal statements. The significance of the problem and the level of independent
    scrutiny can be tracked separately.
  zh-CN: 分析学研究者可以将手稿中的论证与形式命题的量词、参数范围及正则性损失逐项对照，并继续跟踪同行审查的进展。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      OpenAI attributes the natural-language proof to its models and reports that a Lean formalization followed
      the next day.
    zh-CN: OpenAI 将自然语言证明归于其模型，并称次日完成了 Lean 形式化。

human_contribution:
  description:
    en: >-
      OpenAI researchers consulted an expert about how to share the work and published the model output,
      the manuscript and the scope of the formalization for public examination.
    zh-CN: OpenAI 研究人员就发布方式咨询了领域专家，随后公开模型输出、手稿和形式化覆盖范围，供同行检查。

