significance:
  tier: H3
  rationale:
    en: >-
      DeepSeek-R1 is historically important to general-purpose reasoning-model development, but its relevance to AI4Math is primarily contextual: mathematics served as a capability benchmark rather than the release contributing a mathematical result, proof, formalization, or math-specific system.
    zh-CN: >-
      DeepSeek-R1 对通用推理模型发展具有重要意义，但对 AI4Math 主要属于背景事件：数学主要作为能力评测，而该发布本身并未贡献数学新结果、证明、形式化或数学专项系统。
mathematical_novelty:
  type: benchmark_result
interfaces:
- informal
- symbolic
claim:
  en: DeepSeek-R1 and R1-Zero demonstrated strong reasoning behavior from large-scale reinforcement learning, with R1 reported as comparable to OpenAI o1 on reasoning tasks.
  zh-CN: DeepSeek-R1 与 R1-Zero 展示了由大规模强化学习产生的强推理行为，论文报告 R1 在推理任务上可与 OpenAI o1 相比。
summary:
  en: R1-Zero used reinforcement learning without an SFT cold start, while R1 added multi-stage training and released several distilled open models.
  zh-CN: R1-Zero 在无 SFT 冷启动的情况下使用强化学习；R1 则加入多阶段训练并开放多个蒸馏模型。
why_it_matters:
  en: The release accelerated open research on reasoning models, verifier-guided RL and math-specific post-training, providing context for later dedicated AI4Math systems.
  zh-CN: 该发布加速了开放社区对推理模型、验证器引导强化学习与数学专项后训练的研究，为后续专门的 AI4Math 系统提供背景。
ai_role:
  level: computation_only
  description:
    en: The models perform extended mathematical reasoning learned through reinforcement-learning objectives.
    zh-CN: 模型通过强化学习目标学习并执行长程数学推理。
human_contribution:
  description:
    en: Researchers designed the RL and cold-start recipes, trained the models and released weights.
    zh-CN: 研究者设计 RL 与冷启动方案、训练模型并开放权重。
