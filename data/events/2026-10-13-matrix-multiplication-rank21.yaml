significance:
  tier: H2
  rationale:
    en: >-
      The result is a field milestone because it reports a uniform lower bound of 21
      multiplications for exact 3×3 matrix multiplication over every field, improving
      the long-standing general-field lower bound of 19 while remaining only two below
      Laderman's universal 23-multiplication upper bound. The theorem is publicly
      formalized in Lean and mechanically registered, but specialist mathematical review
      is still absent and the author deliberately makes no priority claim.
    zh-CN: >-
      该结果构成领域级里程碑，因为它报告对任意域上的精确 3×3 矩阵乘法建立统一的 21 次乘法
      下界，相比长期 general-field 下界 19 有实质提升，并距离 Laderman 通用于任意域的
      23 次乘法上界只差 2。定理已公开用 Lean 形式化并完成机械注册，但尚缺专业数学审查，
      作者本人也有意不作优先权声明。

mathematical_novelty:
  type: new_result

interfaces:
- formal
- symbolic

claim:
  en: >-
    Andrey Ivanov's public Lean development proves that every exact bilinear algorithm
    for multiplying two 3×3 matrices over an arbitrary field uses at least 21 products
    of input linear forms. The theorem includes finite and infinite fields in every
    characteristic and concerns exact bilinear complexity, not border rank or arbitrary
    arithmetic circuits.
  zh-CN: >-
    Andrey Ivanov 的公开 Lean 开发证明：在任意域上，任何精确计算两个 3×3 矩阵乘积的
    bilinear algorithm 至少需要 21 个输入线性形式乘积。该定理覆盖所有特征的有限域和无限域，
    讨论的是 exact bilinear complexity，而不是 border rank 或一般 arithmetic circuits。

summary:
  en: >-
    The project reports substantial ChatGPT/Codex assistance in mathematical
    exploration, Lean implementation, proof refactoring and documentation. Its main
    statement is an ordinary Mathlib interface and the audit rejects nonstandard axioms.
    Palomar registered the all-fields theorem on 13 October. MathWorld subsequently
    incorporated the reported 21 lower bound into its matrix-multiplication entry while
    noting that independent specialist review had not yet been reported.
  zh-CN: >-
    项目报告 ChatGPT/Codex 在数学探索、Lean 实现、证明重构与文档中提供了实质协助。主定理
    使用普通 Mathlib 接口，审计会拒绝非标准公理。Palomar 于 10 月 13 日注册该任意域定理；
    MathWorld 随后把所报告的 21 下界纳入矩阵乘法条目，同时注明尚未见独立专业审查。

why_it_matters:
  en: >-
    Small matrix multiplication is a classical testbed for algebraic complexity.
    Improving a uniform all-fields lower bound after more than two decades, with a
    kernel-checkable proof from the outset, is materially different from stronger
    field-specific computer searches over F2 and provides a notable AI-assisted
    formal-mathematics result.
  zh-CN: >-
    小规模矩阵乘法是代数复杂度的经典试验场。时隔二十余年提升统一适用于任意域的下界，并从
    一开始就提供 kernel-checkable 证明，与只针对 F2 的更强计算搜索有本质区别，也构成一个
    值得记录的 AI 辅助形式数学成果。

