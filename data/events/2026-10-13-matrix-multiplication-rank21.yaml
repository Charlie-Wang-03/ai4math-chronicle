title:
  en: Ivanov reports an AI-assisted Lean proof raising the general 3×3 matrix-multiplication rank lower bound to 21
  zh-CN: Ivanov 报告 AI 辅助 Lean 证明，将任意域 3×3 矩阵乘法 rank 下界提升至 21

