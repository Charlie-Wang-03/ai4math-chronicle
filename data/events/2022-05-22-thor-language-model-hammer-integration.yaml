event_types:
- proof
- system
significance:
  tier: H2
  rationale:
    en: Thor was an early explicit neuro-symbolic architecture in which language models delegated premise-selection bottlenecks to classical automated provers.
    zh-CN: Thor 是较早明确采用神经符号分工的架构之一：语言模型把前提选择瓶颈交给传统自动定理证明器处理。
mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic
- hybrid
claim:
  en: Thor increased a language model's success on the PISA dataset from 39% to 57% and matched leading miniF2F methods with less compute.
  zh-CN: Thor 将语言模型在 PISA 数据集上的成功率从 39% 提升到 57%，并以更少算力在 miniF2F 上达到当时领先方法水平。
summary:
  en: The framework uses theorem-prover hammers for premise selection while leaving other proof decisions to the language model.
  zh-CN: 该框架使用定理证明器 hammer 进行前提选择，其余证明决策由语言模型完成。
why_it_matters:
  en: 'It highlighted a durable design principle: use symbolic tools where exhaustive reliability is strong and learned models where generation is needed.'
  zh-CN: 它体现了一条长期有效的设计原则：把符号工具用于可靠的结构化搜索，把学习模型用于需要生成与启发式判断的环节。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The language model generated proof actions while automated provers supplied premise-search assistance.
    zh-CN: 语言模型生成证明动作，自动定理证明器负责提供前提搜索支持。
human_contribution:
  description:
    en: Researchers designed the integration protocol and evaluation across theorem-proving environments.
    zh-CN: 研究者设计集成协议并在多个定理证明环境中进行评测。
