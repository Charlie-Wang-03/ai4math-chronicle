id: evt-2022-thor
slug: thor-language-model-hammer-integration
title:
  en: Thor integrates language models with automated theorem-prover hammers
  zh-CN: Thor 将语言模型与自动定理证明器 Hammer 集成
dates:
  event: '2022-05-22'
  first_public_claim: '2022-05-22'
  paper_release: '2022-05-22'
