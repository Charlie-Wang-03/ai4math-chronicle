significance:
  tier: H2
  rationale:
    en: Goedel-Prover-V2 showed that scaffolded synthetic data and Lean-guided self-correction could deliver strong open theorem-proving performance with much smaller models.
    zh-CN: Goedel-Prover-V2 展示了分阶段合成数据与 Lean 引导自我纠错能让较小开放模型达到很强的形式证明性能。
mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic
claim:
  en: Goedel-Prover-V2-32B reported 90.4% miniF2F in self-correction mode and 86 solved PutnamBench problems under its reported evaluation.
  zh-CN: Goedel-Prover-V2-32B 报告在自我纠错模式下 miniF2F 达到 90.4%，并在其评测设置中解出 86 道 PutnamBench。
summary:
  en: The system uses scaffolded data synthesis, verifier-guided iterative repair and model averaging.
  zh-CN: 系统采用脚手架式数据合成、验证器引导的迭代修复与模型平均。
why_it_matters:
  en: It strengthened the case for compact open provers that spend computation on correction rather than only increasing parameter count.
  zh-CN: 它强化了“小型开放证明器通过测试时纠错而非只增大参数规模获得能力”的路线。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The model generates Lean proofs and iteratively repairs them using compiler feedback.
    zh-CN: 模型生成 Lean 证明并根据编译器反馈迭代修复。
human_contribution:
  description:
    en: Researchers designed staged synthesis, self-correction and model-merging procedures.
    zh-CN: 研究者设计分阶段数据合成、自我纠错与模型合并流程。
