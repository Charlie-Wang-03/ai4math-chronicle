significance:
  tier: H2
  rationale:
    en: The QED Manifesto articulated a collective vision of representing important mathematical knowledge formally and mechanically checking all proofs, making formalized mathematics a community-scale infrastructure goal.
    zh-CN: QED Manifesto 提出把重要数学知识形式表示并机械检查全部证明的共同愿景，使形式化数学成为共同体规模的基础设施目标。

mathematical_novelty:
  type: not_applicable
interfaces:
- not_applicable

claim:
  en: The manifesto dated 15 May 1994 proposed the QED project: a computer system representing important mathematical knowledge and techniques with strict formal internal representation and mechanical proof checking.
  zh-CN: 1994 年 5 月 15 日的宣言提出 QED Project：建立表示重要数学知识与技术的计算机系统，内部采用严格形式表示并机械检查证明。

summary:
  en: QED was a field-building vision rather than a single software release, calling for broad cooperation around shared formal mathematical knowledge.
  zh-CN: QED 是领域建构愿景而非单一软件发布，主张围绕共享形式数学知识开展广泛协作。

why_it_matters:
  en: The manifesto anticipated later large formal libraries, interoperability ambitions and AI systems trained or evaluated over machine-readable mathematics.
  zh-CN: 该宣言预示了后来的大型形式数学库、互操作愿景以及在机器可读数学上训练和评测的 AI 系统。

ai_role:
  level: not_applicable
  description:
    en: The milestone is a community vision and governance document, not an AI system performing mathematics.
    zh-CN: 该节点属于共同体愿景与治理文献，不是 AI 系统执行数学任务。

human_contribution:
  description:
