significance:
  tier: H2
  rationale:
    en: >-
      This work is a field milestone because a single frontier-model research run
      autonomously developed several nontrivial theorems about transformer expressivity,
      including an exact linear-fractional normal form, a threshold-degree lower bound
      and an exact characterization for symmetric Boolean functions, and the resulting
      theory was subsequently formalized in Lean. The result is narrow in architectural
      scope but provides an unusually transparent example of autonomous theorem discovery
      about modern AI itself.
    zh-CN: >-
      该工作构成领域级里程碑，因为单个前沿模型的长程研究运行自主发展出多个关于 Transformer
      表达能力的非平凡定理，包括精确的线性分式 normal form、threshold-degree 下界和对称
      Boolean 函数的精确刻画，随后又将所得理论形式化到 Lean。其模型范围较窄，但它是“AI
      自主发现关于现代 AI 本身的数学定理”的高度透明案例。

