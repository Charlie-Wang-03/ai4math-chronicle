claim:
  en: >-
    Viswanathan, Dimitrov, Rocca and Sirikonda define the head complexity H*(f) of a
    Boolean function in a one-layer attention-only transformer. They prove an exact
    linear-fractional normal form, the lower bound deg±(f) <= H*(f), exact values
    including H*(parity_n)=n, and a symmetric-function characterization. The paper
    reports that a single GPT-5.6 Sol agent derived the main Section 2 theorems in an
    approximately 9.5-hour one-shot run without web access or human intervention after
    the initial goal; the main results and an explicit strict-separation example are
    machine-checked in Lean.
  zh-CN: >-
    Viswanathan、Dimitrov、Rocca 与 Sirikonda 定义单层 attention-only Transformer
    中 Boolean 函数的 head complexity H*(f)，证明精确线性分式 normal form、
    deg±(f) <= H*(f) 下界、包括 H*(parity_n)=n 在内的精确值以及对称函数刻画。论文报告称，
    一个 GPT-5.6 Sol Agent 在约 9.5 小时、无网络且初始目标给出后无人类介入的 one-shot
    运行中推导出 Section 2 的主要定理；主要结果及一个显式 strict-separation 例子已由 Lean 检查。

summary:
  en: >-
    Human researchers invested substantial effort in specifying the mathematical model
    and acceptance criteria, but the theorem-generation run was then autonomous. The
    paper distinguishes this core run from a later author-initiated counterexample search.
    The public repository formalizes twelve foundational results plus the separation
    counterexample, with no sorry/admit and only Lean's three standard axioms reported.
    Concurrent work establishes overlapping symmetric-function results in a different model.
  zh-CN: >-
    人类研究者投入大量工作精确定义数学模型与验收条件，此后核心定理生成运行保持自主。论文把该
    核心运行与后来由作者另行发起的 counterexample 搜索明确区分。公开仓库形式化了 12 个基础
    结果和一个 separation counterexample，报告无 sorry/admit，且只使用 Lean 三个标准公理。
    同期独立工作在不同模型下得到部分重叠的对称函数结论。

why_it_matters:
  en: >-
    The project exposes prompts, traces, theorem ledgers and formal proofs rather than
    only a polished final paper. It therefore provides unusually inspectable evidence for
    a long-horizon autonomous mathematical research workflow and connects AI4Math
    directly to the theoretical analysis of transformer architectures.
  zh-CN: >-
    该项目不仅发布最终论文，还公开 prompts、研究 traces、定理 ledger 与形式证明，因此为长程
    自主数学研究流程提供了罕见的可审计证据，并把 AI4Math 直接连接到 Transformer 架构的理论分析。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      GPT-5.6 Sol generated the main theorem statements, derivations and constructions
      during a one-shot research run and later generated the Lean formalizations. A
      separate author-initiated search produced the strict-separation example.
    zh-CN: >-
      GPT-5.6 Sol 在 one-shot 研究运行中生成主要定理陈述、推导和构造，并在后续生成 Lean
      形式化；strict-separation 例子来自另一次由作者发起的搜索。

human_contribution:
  description:
    en: >-
      The human authors chose the high-level research question, precisely specified the
      attention model and acceptance criteria, reviewed the generated mathematics,
      refined Lean code for readability and reuse, and curated the final paper.
    zh-CN: >-
      人类作者选择高层研究问题，精确定义 attention 模型和验收标准，审查生成的数学内容，
      为可读性与复用性整理 Lean 代码，并策划最终论文。

