significance:
  tier: H2
  rationale:
    en: >-
      The Leiden Declaration is a field-building milestone because it turned a broad, cross-institutional consultation into an AI4Math-specific set of recommendations on transparency, attribution, verification, research autonomy, publication practice and scholarly governance. Its endorsement by the International Mathematical Union, independent scholarly discussion in Nature, and presentation at ICM 2026 provide evidence of field-level institutional significance beyond signatory count or short-lived media attention.
    zh-CN: >-
      Leiden Declaration 构成领域建构里程碑，因为它把广泛、跨机构的共同体讨论凝结为一套面向 AI4Math 的具体建议，涉及透明度、署名与归属、验证、研究自主性、出版实践和学术治理。International Mathematical Union 的正式 endorsement、Nature 的独立学术讨论以及 ICM 2026 的公开讨论，表明其领域级制度影响并非仅来自签名数量或短期媒体热度。

