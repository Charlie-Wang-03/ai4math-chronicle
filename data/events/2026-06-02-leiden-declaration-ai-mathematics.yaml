claim:
  en: >-
    On 2 June 2026, a 16-author international working group published the Leiden Declaration on Artificial Intelligence and Mathematics after a consultation process that grew from the 2025 Mechanization and Mathematical Research meeting in Leiden. The International Mathematical Union endorsed the declaration on publication. The document calls for explicit norms around AI use in mathematical research, including transparency and disclosure, attribution, independent verification, open scholarly practice, research autonomy and institutional responsibility.
  zh-CN: >-
    2026 年 6 月 2 日，一个由 16 位作者组成的国际工作组发布 Leiden Declaration on Artificial Intelligence and Mathematics；该声明源于 2025 年在 Leiden 举行的 Mechanization and Mathematical Research 会议，并经过后续共同体咨询形成。International Mathematical Union 在声明发布时给予正式 endorsement。该文件围绕数学研究中的 AI 使用提出明确规范，包括透明度与披露、署名与归属、独立验证、开放学术实践、研究自主性与机构责任。

summary:
  en: >-
    The declaration grew from a September 2025 Lorentz Center meeting of around 60 participants from 10 countries spanning mathematics, computer science, philosophy, history, social science, industry and government. A smaller working group developed the text over the following months with extensive community feedback. The declaration was archived on Zenodo with a DOI, endorsed by the IMU, later discussed at ICM 2026, and the subject of supportive editorials and reporting in major scientific publications.
  zh-CN: >-
    该声明源于 2025 年 9 月 Lorentz Center 举办的一次会议，约 60 名参与者来自 10 个国家，背景覆盖数学、计算机科学、哲学、历史、社会科学、产业与政府。随后较小的工作组在数月内结合广泛共同体反馈形成文本。声明以 DOI 形式存档于 Zenodo，获得 IMU endorsement，之后在 ICM 2026 公开讨论，并受到主要科学出版物的社论与报道关注。

why_it_matters:
  en: >-
    As AI systems became more capable participants in mathematical research, the declaration moved the discussion from isolated reactions to an explicit community-governance agenda. It supplies a durable reference point for questions that recur across AI4Math results: how AI use should be disclosed, how credit and training data should be handled, what independent verification requires, and how mathematical institutions should preserve rigor, access and human judgment while adopting new tools.
  zh-CN: >-
    随着 AI 系统越来越深地参与数学研究，该声明把零散的个体反应推进为明确的共同体治理议程。它为 AI4Math 中反复出现的问题提供了持续性的参考点：应如何披露 AI 使用、如何处理署名与训练数据、独立验证意味着什么，以及数学机构在采用新工具时如何维护严谨性、可访问性与人类判断。

ai_role:
  level: not_applicable
  description:
    en: >-
      This Event records a human-authored community governance statement about AI in mathematics rather than an AI system performing mathematical work, so an operative AI role is not applicable.
    zh-CN: >-
      本事件记录的是人类共同体围绕数学中的 AI 制定治理与规范声明，而不是 AI 系统执行数学工作，因此不存在适用的具体 AI role。

human_contribution:
  description:
    en: >-
      Human participants convened the preceding interdisciplinary meeting, formed the working group, drafted and revised the declaration through community feedback, published the citable record, and sought institutional discussion and endorsement.
    zh-CN: >-
      人类参与者组织前期跨学科会议、组成工作组、依据共同体反馈起草和修订声明、发布可引用记录，并推动机构层面的讨论与 endorsement。

