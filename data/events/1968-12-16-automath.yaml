significance:
  tier: H2
  rationale:
    en: Automath was a foundational early effort to encode substantial mathematics in a formal language whose derivations could be checked mechanically, anticipating dependent-type proof assistants and large formal libraries.
    zh-CN: Automath 是把大规模数学编码进可由机器检查推导的形式语言的奠基性早期尝试，预示了依赖类型证明助手与大型形式数学库。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: N. G. de Bruijn presented Automath as a language for expressing mathematical texts in a form suitable for automatic checking; the 1968 Symposium on Automatic Demonstration provides a precise public anchor for the system's early record.
  zh-CN: N. G. de Bruijn 将 Automath 提出为一种把数学文本表达成适合自动检查形式的语言；1968 年 Automatic Demonstration Symposium 为其早期公开记录提供了精确时间锚点。

summary:
  en: Automath represented definitions, propositions and proofs in a highly explicit typed formal language so a computer could verify the correctness of derivations.
  zh-CN: Automath 以高度显式的有类型形式语言表示定义、命题与证明，使计算机能够检查推导的正确性。

why_it_matters:
  en: It helped establish the idea that whole mathematical texts—not only isolated logical formulas—could be represented and mechanically checked.
  zh-CN: 它推动了“完整数学文本而非孤立逻辑公式也可以形式表示并由机器检查”的理念。

ai_role:
  level: computation_only
  description:
    en: Computers checked formally encoded mathematical derivations; proof discovery was not the central AI role.
    zh-CN: 计算机负责检查形式编码的数学推导；自动发现证明并非核心 AI 角色。

human_contribution:
  description:
    en: De Bruijn designed the formal language and the methodology for encoding mathematical texts for mechanical checking.
    zh-CN: de Bruijn 设计形式语言及把数学文本编码为可机械检查表示的方法。

