significance:
  tier: H2
  rationale:
    en: >-
      This work was an important early autoformalization milestone because it treated the mapping from ambiguous, informalized mathematical expressions to formal syntax as a learnable parsing problem and combined statistical structure prediction with formal semantic checks. It established a concrete pre-neural-machine-translation route from informal mathematical text toward machine-checkable representations and directly preceded later Mizar autoformalization systems.
    zh-CN: >-
      该工作是早期自动形式化的重要里程碑之一：它把从带歧义的 informalized 数学表达映射到形式语法的问题明确建模为可学习的解析任务，并将统计结构预测与形式语义检查结合。它在神经机器翻译路线之前就建立了从非形式数学文本走向机器可检查表示的具体方案，并直接早于后来的 Mizar 自动形式化系统。

mathematical_novelty:
  type: tooling_only

interfaces:
- informal
- formal
- hybrid

claim:
  en: >-
    Cezary Kaliszyk, Josef Urban and Jiří Vyskočil proposed a context-based parser for mathematical expressions that learned deep parse trees from aligned informal/formal corpora and pruned candidate parses using type checking and large-theory automated theorem proving. The paper reported substantial improvements over earlier parsing results on the Flyspeck-derived evaluation.
  zh-CN: >-
    Cezary Kaliszyk、Josef Urban 与 Jiří Vyskočil 提出一种面向数学表达的上下文解析方法：从对齐的 informal / formal 语料中学习深层解析树，并利用类型检查与大型理论自动定理证明对候选解析进行语义剪枝。论文报告该方法在基于 Flyspeck 的评测上显著改善了此前的解析结果。

summary:
  en: >-
    The system learns how ambiguous mathematical notation is parsed from aligned corpora and then uses formal semantic constraints to reject syntactically plausible but mathematically ill-typed or unsupported interpretations. This creates a hybrid statistical-symbolic pipeline in which learning proposes formal structures and theorem-proving machinery helps validate them.
  zh-CN: >-
    该系统从对齐语料中学习如何解析有歧义的数学记号，再使用形式语义约束排除语法上合理但类型不成立或缺乏支持的解释。由此形成统计学习与符号推理结合的混合流程：学习模型提出形式结构，类型检查和定理证明机制帮助筛选与验证候选。

why_it_matters:
  en: >-
    Autoformalization depends on bridging human mathematical notation and formal proof languages. This work showed before modern neural translation and LLMs that aligned mathematical corpora plus formal semantic feedback could make that interface empirically tractable, establishing a lineage that later moved toward neural translation and large-language-model formalization.
  zh-CN: >-
    自动形式化的核心难点之一，是连接人类数学记号与形式证明语言。该工作在现代神经翻译和 LLM 之前就展示了：对齐数学语料与形式语义反馈可以把这一接口问题转化为可实验研究任务，并形成后来走向神经翻译与大语言模型形式化的历史谱系。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      Statistical learning produced candidate formal parse trees from informalized mathematical expressions, while type checking and automated theorem proving supplied machine-executable semantic filtering of those candidates.
    zh-CN: >-
      统计学习模型从 informalized 数学表达生成候选形式解析树，类型检查与自动定理证明则为这些候选提供机器可执行的语义筛选。

human_contribution:
  description:
    en: >-
      Researchers constructed aligned corpora, designed the context-based parser and semantic-pruning pipeline, selected formal checking components and evaluated the resulting system on Flyspeck-derived material.
    zh-CN: >-
      研究者构建对齐语料、设计上下文解析器与语义剪枝流程、选择形式检查组件，并在 Flyspeck 衍生数据上评测系统。

