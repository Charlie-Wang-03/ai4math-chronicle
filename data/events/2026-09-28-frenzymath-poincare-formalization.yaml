significance:
  tier: H2
  rationale:
    en: >-
      FrenzyMath's Poincaré development is a field milestone in AI-assisted
      formalization because it packages a complete smooth/topological Poincaré proof
      route into a multi-million-line Lean project and reports completion of most of the
      work within roughly half a month using agentic pipelines and publicly available
      commercial language models. The project exposes a Mathlib-facing statement,
      full-build evidence and Comparator/Nanoda verification. A separate team released
      another complete Lean development essentially concurrently, showing that
      research-scale geometric-analysis formalization had moved from an isolated
      demonstration to a reproducible frontier. Because the mathematical theorem was
      already known and the exact agent/human division is not reconstructed theorem by
      theorem, H2 is more appropriate than H1.
    zh-CN: >-
      FrenzyMath 的庞加莱猜想形式化构成 AI 辅助形式化方向的领域级里程碑：该项目把完整的
      smooth/topological Poincaré 证明路线组织成数百万行 Lean 工程，并报告主要工作在约
      半个月内通过 agentic pipelines 与公开商用大语言模型完成。项目公开了面向 Mathlib
      的独立 statement、全量构建证据以及 Comparator/Nanoda 验证。几乎同期，另一支团队
      也发布了独立完整 Lean 开发，表明研究级几何分析形式化已经从孤立演示走向可重复的
      前沿实践。由于数学定理本身早已解决，且逐定理的人机分工并未被完整重建，因此 H2
      比 H1 更合适。

