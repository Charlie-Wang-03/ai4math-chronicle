claim:
  en: >-
    On 28 September 2026, FrenzyMath announced a complete Lean 4 formalization of the
    smooth and topological three-dimensional Poincaré conjecture, primarily following
    Morgan and Tian's exposition of the Hamilton–Perelman proof. The team reports a full
    Lean build and Comparator verification of two public endpoint statements using
    Lean's kernel and Nanoda with only the standard axioms propext, Classical.choice and
    Quot.sound. FrenzyMath reports that three AI developers with mathematical
    backgrounds and several volunteer mathematicians completed most of the work within
    half a month using publicly available commercial LLMs.
  zh-CN: >-
    2026 年 9 月 28 日，FrenzyMath 宣布完成三维 smooth 与 topological 庞加莱猜想的
    Lean 4 形式化，证明路线主要跟随 Morgan–Tian 对 Hamilton–Perelman 证明的阐释。
    团队报告全量 Lean build 已通过，并使用 Comparator 对两个公开 endpoint statement
    进行验证，同时由 Lean kernel 与 Nanoda 检查，允许的公理仅为 propext、
    Classical.choice 与 Quot.sound。FrenzyMath 表示，三名具有数学背景的 AI 开发者与
    数名志愿数学家使用公开商用 LLM，在约半个月内完成了大部分工作。

summary:
  en: >-
    FrenzyMath reports about 3.2 million lines of Lean and less than USD 30,000 in LLM
    and compute costs for the project. The repository separates the Mathlib-only
    endpoint statements from the proof library and preserves Comparator configuration,
    verifier revisions, logs and source-provenance records. The announcement also notes
    that an independent team led by Ziyang Qin, Yuan Liao, Ayush Khaitan and Bennett
    Chow released another complete Poincaré Lean development earlier the same day; that
    separate arXiv paper records a full public build and says automated assistance was
    used for proofs and prose.
  zh-CN: >-
    FrenzyMath 报告该项目约包含 320 万行 Lean，LLM 与计算服务器总成本低于 3 万美元。
    仓库将仅依赖 Mathlib 的 endpoint statements 与证明库分离，并保存 Comparator 配置、
    verifier 版本、日志和源码 provenance 记录。公告同时指出，Ziyang Qin、Yuan Liao、
    Ayush Khaitan 与 Bennett Chow 等组成的独立团队在同一天稍早也发布了另一套完整
    庞加莱 Lean 开发；该独立 arXiv 论文记录了公开全量构建，并说明证明与文字工作中使用了
    自动化辅助。

why_it_matters:
  en: >-
    Poincaré is a foundational modern theorem whose standard proof uses a large stack of
    geometric analysis, topology, partial differential equations and Ricci-flow
    machinery. Compressing a project of this scope into weeks of AI-assisted
    formalization demonstrates that frontier formal-mathematics agents can now operate
    over extensive prerequisite libraries rather than only isolated olympiad theorems
    or short research arguments. The near-simultaneous second formalization reinforces
    the historical signal while also discouraging a simplistic single-project priority claim.
  zh-CN: >-
    庞加莱猜想是现代数学的基础性定理，其标准证明依赖庞大的几何分析、拓扑、偏微分方程与
    Ricci flow 理论体系。把这种规模的项目压缩到数周 AI 辅助形式化，说明前沿形式数学 Agent
    已能处理广泛前置理论库，而不再局限于孤立奥赛定理或短篇研究论证。近乎同期出现的第二套
    独立形式化进一步强化了这一历史信号，同时也提醒 Chronicle 不应把里程碑简单归为单一项目
    的优先权。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      FrenzyMath describes the project as a collaboration among AI developers with
      mathematical backgrounds, volunteer mathematicians and publicly available
      commercial LLMs coordinated through agentic pipelines. The public announcement
      establishes substantial AI assistance but does not give a theorem-by-theorem
      reconstruction of model versus human intellectual contributions.
    zh-CN: >-
      FrenzyMath 将该项目描述为具有数学背景的 AI 开发者、志愿数学家与公开商用 LLM 在
      agentic pipelines 中协作完成。公开材料足以确认 AI 的实质参与，但没有逐定理重建
      模型与人类的具体智力贡献。

human_contribution:
  description:
    en: >-
      Human developers and mathematicians designed and operated the pipelines, selected
      the proof route and sources, reviewed integration and provenance, and maintained
      the public verification surface and mathematical blueprint.
    zh-CN: >-
      人类开发者与数学家负责设计和运行 pipeline、选择证明路线与文献来源、审查集成与
      provenance，并维护公开验证界面及数学 blueprint。

