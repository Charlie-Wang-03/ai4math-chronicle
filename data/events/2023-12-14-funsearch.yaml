title:
  en: FunSearch reports new cap-set constructions with LLM-guided program search
  zh-CN: FunSearch 通过 LLM 引导的程序搜索报告新的 cap set 构造

dates:
  event: "2023-12-14"
  first_public_claim: "2023-12-14"
