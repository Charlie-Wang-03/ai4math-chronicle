  last_updated: "2026-09-10"

event_types: [discovery, system]

significance:
  tier: H1
  rationale:
    en: The Nature paper demonstrated an LLM-based search loop producing improved constructions for an established extremal-combinatorics problem, making it a useful early reference point for AI-assisted mathematical discovery.
    zh-CN: Nature 论文展示了基于 LLM 的搜索闭环在一个既有极值组合问题上产生改进构造，是 AI 辅助数学发现的重要早期参照点。

mathematical_novelty:
  type: new_result
interfaces: [informal, numeric]

claim:
  en: FunSearch found cap-set constructions exceeding previously known constructions in finite-dimensional and asymptotic settings, and also found improved heuristics for online bin packing.
  zh-CN: FunSearch 在有限维与渐近情形中找到超过此前已知结果的 cap set 构造，并在在线装箱问题上找到改进启发式算法。

summary:
  en: Google DeepMind paired a pretrained language model with an evaluator and evolutionary program search. The resulting system searched over executable programs rather than directly emitting final mathematical answers.
  zh-CN: Google DeepMind 将预训练语言模型、评估器与进化式程序搜索结合，让系统搜索可执行程序，而不是直接生成最终数学答案。

why_it_matters:
  en: The result supplied a concrete, checkable example of LLM-generated code participating in a search process that improved the known solution landscape of an established mathematical problem.
  zh-CN: 该结果提供了一个可检查的具体案例：LLM 生成的代码参与系统化搜索，并改进了一个既有数学问题的已知解空间。

ai_role:
  level: ai_primary_human_verified
  description:
    en: The language model generated candidate programs inside an automated evolutionary loop, while deterministic evaluators selected and scored candidates.
    zh-CN: 语言模型在自动化进化搜索闭环中生成候选程序，确定性的评估器负责筛选与评分。

human_contribution:
  description:
    en: Researchers designed the search procedure and evaluators, chose the mathematical tasks and representations, interpreted the discovered programs, and authored the scientific analysis.
    zh-CN: 研究人员设计搜索流程与评估器，选择数学任务和表示方式，解释发现的程序，并完成科学分析。

