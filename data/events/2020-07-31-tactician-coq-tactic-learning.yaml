title:
  en: Tactician integrates adaptive tactic learning and proof synthesis into Coq
  zh-CN: Tactician 将自适应 tactic 学习与证明合成直接集成进 Coq

dates:
  event: '2020-07-31'
  first_public_claim: '2020-07-31'
