event_types:
- proof
- system
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      Tactician turned learned tactic prediction into an integrated, interactive Coq workflow that could learn from existing developments, suggest the next tactic or synthesize a proof, and continue adapting as users worked across package dependencies.
    zh-CN: >-
      Tactician 将学习式 tactic 预测发展为直接嵌入 Coq 的交互工作流：它可以从既有开发中学习、建议下一步 tactic 或自动合成证明，并在跨 package dependency 的实际使用中持续适应。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: >-
    Tactician provided a Coq plugin that learns from previously written tactic scripts and can either recommend the next tactic interactively or perform automated tactic-level proof synthesis, with tooling designed to learn across installed Coq developments.
  zh-CN: >-
    Tactician 提供 Coq 插件，从已有 tactic script 中学习，既能交互式推荐下一步 tactic，也能执行 tactic 层面的自动证明合成，并支持从已安装的 Coq 开发中持续学习。

summary:
  en: >-
    The project combines online tactic learning, proof search and package-aware instrumentation so machine-learning assistance lives inside the proof assistant rather than as a detached benchmark-only experiment.
  zh-CN: >-
    该项目把在线 tactic 学习、证明搜索与 package-aware instrumentation 结合起来，使机器学习辅助直接存在于证明助手工作流中，而不是停留在独立的 benchmark 实验里。

why_it_matters:
  en: >-
    It is an early example of a maintained proof-assistant-native learning platform, anticipating later AI theorem-proving infrastructure that exposes interactive proof states to continuously improving learned agents.
  zh-CN: >-
    它是较早的、持续维护的 proof-assistant-native 学习平台之一，预示了后来把交互式证明状态暴露给持续改进学习 Agent 的 AI 定理证明基础设施路线。

ai_role:
  level: ai_substantive_support
  description:
    en: >-
      Learned models rank tactic choices and drive tactic-level proof search while remaining embedded in a human-controlled Coq proof-development loop.
    zh-CN: >-
      学习模型对 tactic 选择进行排序并驱动 tactic 层面的证明搜索，同时仍嵌入由人控制的 Coq 证明开发循环。

human_contribution:
  description:
    en: >-
      Researchers designed the learning and search machinery, implemented the Coq plugin and dependency-aware instrumentation, and human Coq developments provide the tactic traces from which the system learns.
    zh-CN: >-
      研究者设计学习与搜索机制、实现 Coq 插件及 dependency-aware instrumentation；人工编写的 Coq 开发则提供系统学习所需的 tactic 轨迹。

