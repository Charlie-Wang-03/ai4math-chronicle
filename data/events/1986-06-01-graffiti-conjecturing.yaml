significance:
  tier: H2
  rationale:
    en: Graffiti made automated conjecture generation a sustained research activity in graph theory, producing machine-suggested inequalities and conjectures that mathematicians could investigate.
    zh-CN: Graffiti 将自动猜想生成发展为持续的图论研究活动，机器提出不等式与猜想，再由数学家研究其真伪与意义。

mathematical_novelty:
  type: new_conjecture
interfaces:
- symbolic

claim:
  en: Fajtlowicz's Graffiti program generated graph-theoretic conjectures from a library of graphs and numerical invariants; the First Japan Conference on Graph Theory and Applications began on 1 June 1986 and provides the public conference anchor for the early Graffiti record.
  zh-CN: Fajtlowicz 的 Graffiti 程序从图数据库与数值不变量自动生成图论猜想；1986 年 6 月 1 日开幕的 First Japan Conference on Graph Theory and Applications 为其早期公开记录提供会议锚点。

summary:
  en: Graffiti evaluated candidate relations between graph invariants, retained statements without known counterexamples and used heuristics to suppress trivial or redundant conjectures.
  zh-CN: Graffiti 评估图不变量之间的候选关系，保留在已知图中没有反例的陈述，并用启发式删除平凡或重复猜想。

why_it_matters:
  en: It demonstrated a durable human–machine discovery workflow in which a computer proposes mathematical conjectures and the research community proves, disproves and refines them.
  zh-CN: 它展示了长期的人机数学发现流程：计算机提出猜想，研究共同体负责证明、反驳与改进。

ai_role:
  level: autonomous_primary
  description:
    en: The program autonomously generated and filtered candidate graph-theory conjectures from its knowledge base.
    zh-CN: 程序从其知识库自动生成并筛选图论候选猜想。

human_contribution:
  description:
    en: Siemion Fajtlowicz designed the invariant library and conjecturing heuristics, while mathematicians evaluated and developed the generated conjectures.
    zh-CN: Siemion Fajtlowicz 设计不变量库与猜想启发式，数学家评估并发展机器生成的猜想。

