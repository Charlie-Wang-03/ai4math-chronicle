  tier: H3
  rationale:
    en: OlympiadBench provided a large bilingual benchmark that combined mathematics, physics and multimodal problem statements at Olympiad difficulty.
    zh-CN: OlympiadBench 提供大规模双语奥赛级基准，把数学、物理和多模态题目结合起来。
