  type: tooling_only
interfaces:
- informal
- symbolic
- numeric
claim:
  en: OlympiadBench introduced 8,476 bilingual multimodal Olympiad-level math and physics problems with expert step-by-step annotations.
  zh-CN: OlympiadBench 引入 8,476 道双语多模态奥赛级数学与物理问题，并提供专家逐步推理标注。
summary:
  en: The benchmark was designed to remain difficult for frontier text and multimodal models and includes detailed evaluation methodology.
  zh-CN: 该基准面向前沿文本与多模态模型保持较高难度，并提供细致的评测方法。
why_it_matters:
  en: It broadened AI4Math evaluation beyond English text-only competition problems.
  zh-CN: 它把 AI4Math 评测从英语纯文本竞赛题扩展到双语与多模态场景。
ai_role:
  level: computation_only
  description:
    en: Language and multimodal models are evaluated on the benchmark.
    zh-CN: 语言模型与多模态模型在该基准上接受评测。
human_contribution:
