significance:
  tier: H2
  rationale:
    en: Mizar established a durable program for writing mathematics in a formal language close to mathematical practice and for accumulating a machine-checkable mathematical library.
    zh-CN: Mizar 建立了长期工程：以贴近数学实践的形式语言书写数学，并持续积累机器可检查的数学知识库。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: Mizar's official historical record dates Andrzej Trybulec's first public presentation of the Mizar ideology to 14 November 1973.
  zh-CN: Mizar 官方历史记录把 Andrzej Trybulec 首次公开介绍 Mizar 理念的日期标为 1973 年 11 月 14 日。

summary:
  en: Mizar developed a formal mathematical language, checker and library model aimed at building a cumulative body of computer-verifiable mathematics.
  zh-CN: Mizar 发展形式数学语言、检查器与数学库模式，目标是形成可累积的计算机可验证数学体系。

why_it_matters:
  en: The Mizar Mathematical Library later became a major formal corpus for automated reasoning and machine-learning research, including DeepMath and neural autoformalization.
  zh-CN: Mizar Mathematical Library 后来成为自动推理与机器学习研究的重要形式语料，包括 DeepMath 与神经自动形式化路线。

ai_role:
  level: computation_only
  description:
    en: The system mechanically checks formal mathematical texts; the historical milestone is the formal knowledge infrastructure rather than autonomous discovery.
    zh-CN: 系统机械检查形式数学文本；该历史节点的核心是形式知识基础设施，而非自主发现。

human_contribution:
  description:
    en: Andrzej Trybulec and the Mizar community designed the language, verification discipline and growing formal library.
    zh-CN: Andrzej Trybulec 与 Mizar 社群设计语言、验证规范并建设持续增长的形式数学库。

