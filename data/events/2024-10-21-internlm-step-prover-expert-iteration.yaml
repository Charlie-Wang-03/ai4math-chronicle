significance:
  tier: H2
  rationale:
    en: StepProver showed how large problem banks and compute-intensive expert iteration can steadily raise open formal theorem-proving performance.
    zh-CN: StepProver 展示了大规模问题库与高算力专家迭代如何持续提升开放形式定理证明性能。
mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic
claim:
  en: InternLM2.5-StepProver reported 65.9% on miniF2F-test and proved or disproved 17.0% of Lean-Workbook-Plus problems.
  zh-CN: InternLM2.5-StepProver 报告 miniF2F-test 65.9%，并证明或反驳 Lean-Workbook-Plus 中 17.0% 的问题。
summary:
  en: The system performs expert iteration over large Lean datasets and uses a critic to prioritize easier problems and guide deeper proof searches.
  zh-CN: 系统在大规模 Lean 数据上执行专家迭代，并使用 critic 选择相对容易的问题、引导更深证明搜索。
why_it_matters:
  en: It provided an open empirical example of theorem-proving performance scaling with data, search and compute.
  zh-CN: 它提供了一个开放实证案例，显示形式证明性能如何随数据、搜索和算力扩展。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The prover searches for Lean proofs, trains on successful outputs and uses a learned critic to allocate effort.
    zh-CN: 证明器搜索 Lean 证明、用成功结果继续训练，并通过学习式 critic 分配搜索资源。
human_contribution:
  description:
    en: Researchers built the large-scale expert-iteration pipeline and curated Lean datasets.
    zh-CN: 研究者构建大规模专家迭代管线并整理 Lean 数据。
