  type: new_result

interfaces:
- informal
- symbolic

claim:
  en: >-
    Patrick Lopatto's Hexagon preprint claims that, after explicit centering and scaling,
    the largest consecutive eigenvalue gaps of the GOE in a fixed bulk interval converge
    to a Poisson point process with exponential intensity, giving a shifted Gumbel law
    for the largest gap. The proof relates GOE gap probabilities to corresponding GUE
    probabilities times a fixed-size determinant and controls that determinant using
    Nazarov's uncertainty principle and Hermite-function identities.
  zh-CN: >-
    Patrick Lopatto 的 Hexagon 预印本声称：经过显式中心化与缩放后，GOE 在固定 bulk interval
    中最大的相邻特征值间隙收敛到具有指数强度的 Poisson point process，从而最大间隙服从
    shifted Gumbel 极限。证明把 GOE 的 gap probability 与相应 GUE probability 及一个固定
    大小行列式联系起来，并利用 Nazarov uncertainty principle 与 Hermite function 恒等式
    控制该行列式。

summary:
  en: >-
    The provenance statement says proof discovery, verification and writing were carried
    out with GPT 6 Astra, GPT 6.1 Sol and Claude Opus 5.5. The public page identifies
    Patrick Lopatto as the contributor but does not reconstruct the detailed prompt,
    steering or theorem-by-theorem division of labor. Chronicle therefore records strong
    AI involvement without calling the process fully autonomous.
  zh-CN: >-
    provenance 声明称证明发现、验证与写作使用 GPT 6 Astra、GPT 6.1 Sol 和 Claude Opus 5.5
    完成。公开页面把 Patrick Lopatto 列为 contributor，但没有重建详细 prompt、steering 或
    逐定理的人机分工。因此 Chronicle 记录强 AI 参与，但不把过程描述为完全自主。

why_it_matters:
  en: >-
    The result extends a line of extreme-gap asymptotics from unitary to orthogonal random
    matrix ensembles and supplies another concrete example of frontier models participating
    in publishable research mathematics outside theorem-prover-native domains.
  zh-CN: >-
    该结果把极端间隙渐近理论从 unitary 随机矩阵系综推进到 orthogonal 情形，也提供了一个新的
    具体案例：前沿模型在非 proof-assistant 原生领域参与可发表的研究数学。

