significance:
  tier: H2
  rationale:
    en: >-
      The work is a field milestone because it claims the asymptotic law for the largest
      bulk eigenvalue gaps of the Gaussian orthogonal ensemble, completing a natural
      orthogonal-ensemble counterpart to known unitary results, with the public provenance
      statement assigning proof discovery, verification and writing to several frontier
      AI systems. The result is currently a fresh preprint without formal artifact or
      independent specialist review, so its historical record is kept conservative.
    zh-CN: >-
      该工作构成领域级里程碑，因为它声称确定 Gaussian orthogonal ensemble 在谱内部最大相邻
      特征值间隙的渐近分布，补上已有 unitary ensemble 结果的自然正交对应版本；公开 provenance
      声明把证明发现、验证与写作归因于多个前沿 AI 系统。当前它仍是极新的预印本，没有公开形式
      artifact 或独立专业审查，因此 Chronicle 对其历史表述保持保守。

