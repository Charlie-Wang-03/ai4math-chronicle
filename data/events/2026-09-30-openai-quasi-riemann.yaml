  history:
  - date: '2026-09-30'
    status: paper_released
    evidence_level: E3
    note:
      en: >-
        OpenAI released the 7/8 manuscript and later exposed a substantial Lean
        formalization covering the central zeta and Dirichlet statements. The initial
        release did not by itself establish independent mathematical corroboration.
      zh-CN: >-
        OpenAI 发布 7/8 手稿，并随后公开覆盖核心 ζ 与 Dirichlet 陈述的大规模 Lean
        形式化。初始发布本身并不构成独立数学 corroboration。
  - date: '2026-10-19'
    status: partially_verified
    evidence_level: E4
    note:
      en: >-
        Named number theorists reported through Quanta that they had substantially
        unpacked the shorter proof and broadly regarded the result as correct, while
        retaining caution about full human understanding. Banks independently produced
        a direct explicit-constant treatment of the Landau-Siegel-zero consequence, and
        a separate public project independently rebuilt and audited the 7/8 Lean theorem.
        Chronicle records this as substantial partial verification and independent replay,
        not as its own certification of ultimate mathematical correctness.
      zh-CN: >-
        Quanta 报道多位具名数论专家已实质拆解较短证明，并总体认为结果成立，同时仍对完整人类
        理解保持谨慎。Banks 独立给出 Landau-Siegel-zero 后果的直接显式常数论证；另有公开
        第三方项目独立重建并审计 7/8 Lean 定理。Chronicle 因此记录为 substantial partial
        verification 与 independent replay，而不是由 Chronicle 自行认证最终数学正确性。

