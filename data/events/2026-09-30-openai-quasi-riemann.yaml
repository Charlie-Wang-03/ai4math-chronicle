claim:
  en: >-
    OpenAI's 30 September 2026 manuscript claims that the Riemann zeta function and
    every Dirichlet L-function are zero-free in the half-plane Re(s) > 7/8, with the
    principal-character pole at s = 1 excluded as appropriate. The accompanying
    formalization also gives the same half-plane for finite-order Hecke L-functions
    over Q(sqrt(-3)). A companion manuscript gives a different proof of the weaker
    fixed half-plane Re(s) > 11/12, and a related manuscript establishes a uniform
    logarithmic exclusion region for Landau-Siegel zeros.
  zh-CN: >-
    OpenAI 于 2026 年 9 月 30 日发布的手稿声称：Riemann ζ 函数以及所有 Dirichlet
    L-functions 在 Re(s) > 7/8 的半平面内无零点，并在适用处排除 principal character
    在 s = 1 的极点。配套形式化还对 Q(sqrt(-3)) 上的有限阶 Hecke L-functions 得到同一
    半平面。另一篇 companion manuscript 用不同方法得到较弱但仍固定的 Re(s) > 11/12
    半平面；相关手稿还建立了排除 Landau-Siegel zeros 的统一 logarithmic region。

summary:
  en: >-
    OpenAI authors the main 7/8 manuscript under its institutional name. The 5 October
    alternate 11/12 manuscript explicitly says it was written with human assistance.
    The public Lean catalogue formalizes the zeta, Dirichlet and selected Hecke
    statements together with a uniform real-zero gap. By 19 October, Quanta reported
    that several named analytic-number-theory specialists had substantially unpacked
    the shorter proof and broadly regarded the result as correct, while still stressing
    the importance of full human understanding. William D. Banks independently derived
    an explicit-constant version of the Landau-Siegel-zero consequence, and a separate
    public project independently rebuilt the 7/8 Lean theorem from the OpenAI source.
  zh-CN: >-
    OpenAI 以机构名义署名 7/8 主手稿；10 月 5 日的 11/12 alternate manuscript 则明确注明
    其写作有人类协助。公开 Lean catalogue 形式化了 ζ、Dirichlet 以及部分 Hecke 陈述，并
    包含统一实零点间隔。到 10 月 19 日，Quanta 报道多位具名解析数论专家已实质拆解较短
    证明，并总体认可其结果，同时仍强调完整人类理解的重要性。William D. Banks 又独立推出
    Landau-Siegel-zero 后果的显式常数版本；另有公开第三方项目从 OpenAI 源码独立重建了
    7/8 Lean 定理。

why_it_matters:
  en: >-
    The quasi-Riemann hypothesis asks for any fixed zero-free half-plane
    Re(s) > theta with theta < 1 and has broad consequences throughout analytic number
    theory. A publicly inspectable AI-generated proof at 7/8, followed quickly by human
    specialist digestion, independent downstream mathematics and formal replay, marks
    a qualitatively stronger form of AI contribution than contest performance,
    benchmark solving or unreviewed bulk theorem generation. The result is not the
    Riemann hypothesis itself and does not assert zero-freeness down to Re(s) > 1/2.
  zh-CN: >-
    quasi-Riemann hypothesis 要求存在任意固定的零点空半平面 Re(s) > theta（theta < 1），
    在解析数论中具有广泛后果。一个公开可审计、由 AI 流程产生的 7/8 证明，在很短时间内又
    获得人类专家实质拆解、独立后续数学工作和形式化重放，这代表了比竞赛成绩、benchmark
    解题或未经审查的批量定理生成更强的一类 AI 数学贡献。该结果并不是 Riemann hypothesis
    本身，也没有声称把零点空区域推进到 Re(s) > 1/2。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      OpenAI's public mathematics programme presents the unreleased internal model as
      the primary producer of the result family and the main 7/8 manuscript is authored
      institutionally by OpenAI. The alternate 11/12 manuscript explicitly records
      human assistance. Chronicle therefore records AI-primary mathematical production
      with human editing, curation, verification and later specialist scrutiny rather
      than claiming a fully autonomous end-to-end research process.
    zh-CN: >-
      OpenAI 的公开数学计划把未发布内部模型描述为该成果族的主要生产者，7/8 主手稿以 OpenAI
      机构名义署名；11/12 alternate manuscript 则明确记录有人类协助。因此 Chronicle
      记录为 AI-primary 的数学产出，并保留人类编辑、策划、验证和后续专家审查的角色，而不
      声称这是完全自主的端到端科研过程。

human_contribution:
  description:
    en: >-
      Human researchers selected and curated the research programme, assisted the shorter
      alternate manuscript, prepared and checked release artifacts and formalizations,
      and subsequently subjected the proof to specialist mathematical study. Independent
      mathematicians also produced a new explicit-constant treatment of a major
      consequence.
    zh-CN: >-
      人类研究者负责选择和策划研究计划，协助较短的 alternate manuscript，准备并检查发布
      artifact 与形式化；随后独立数论专家对证明进行了实质数学研究，且有数学家对重要后果
      给出了新的显式常数论证。

