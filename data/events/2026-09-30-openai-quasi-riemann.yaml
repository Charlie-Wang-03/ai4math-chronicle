significance:
  tier: H1
  rationale:
    en: >-
      This result is a Historical Milestone because it reports a fixed zero-free
      half-plane for the Riemann zeta function and every Dirichlet L-function,
      resolving the longstanding quasi-Riemann hypothesis rather than merely improving
      a benchmark. The result was generated within OpenAI's AI-mathematics programme,
      accompanied by a large public Lean formalization, and rapidly became the subject
      of detailed specialist study, an independent mathematical reworking of its
      Landau-Siegel consequence, and a third-party formal replay. Its historical
      significance is distinct from OpenAI's later aggregate release of hundreds of
      manuscripts, which is separately recorded as a scale-and-infrastructure milestone.
    zh-CN: >-
      该结果被列为 Historical Milestone，因为它报告对 Riemann ζ 函数以及所有 Dirichlet
      L-functions 建立固定的零点空半平面，从而声称解决长期的 quasi-Riemann hypothesis，
      而不是一次 benchmark 提升。该成果产生于 OpenAI 的 AI 数学研究流程，配有大规模公开
      Lean 形式化，并迅速受到数论专家的详细研究、对 Landau-Siegel 后果的独立数学重推以及
      第三方形式化重放。它的历史意义不同于 OpenAI 随后一次性发布数百篇手稿的 aggregate
      H1；后者记录的是规模与公共研究基础设施的转折。

