significance:
  tier: H2
  rationale:
    en: >-
      The statement became more than a short-lived petition because it articulated an AI4Math-specific position on research incentives, mathematical understanding, attribution, unpublished work and the role of human mathematicians, then entered institutional discussion within days. The French Mathematical Society board explicitly cited it in an official position on the OpenAI Navier–Stokes controversy, while IMPA republished the statement for its community. These cross-institutional responses satisfy the Chronicle's field-building publication gate without treating signatory prestige or media attention alone as sufficient evidence.
    zh-CN: >-
      这份声明并非仅凭签名人数或短期媒体热度获得收录。它针对 AI4Math 的研究激励、数学理解、归属、未公开工作以及人类数学家的角色提出明确共同体立场，并在数日内进入机构层面的持续讨论。法国数学会理事会在针对 OpenAI Navier–Stokes 争议的正式立场中直接引用该声明，IMPA 也面向其共同体公开转载。由此形成的跨机构响应满足 Chronicle 的领域建构收录门槛。

