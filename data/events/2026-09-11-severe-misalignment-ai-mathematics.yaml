claim:
  en: >-
    On 11 September 2026, a declaration titled A Severe Misalignment of AI in Mathematics was published with 25 initial signatories, all Fields Medallists according to Terence Tao's direct account. The statement argued that using the solution of prominent mathematical problems as an AI-company benchmark can conflict with the goals and norms of mathematical research, and raised concerns about understanding, communication, attribution, research incentives and the stewardship of mathematical knowledge. It invited additional signatures and quickly became a reference point in institutional responses to the September 2026 AI-and-mathematics controversies.
  zh-CN: >-
    2026 年 9 月 11 日，《A Severe Misalignment of AI in Mathematics》公开发布。Terence Tao 的直接说明表明，首批共有 25 位签署者且均为菲尔兹奖得主。声明主张，把攻克知名数学问题作为 AI 企业 benchmark 的做法可能与数学研究的目标和规范发生冲突，并讨论数学理解与表达、归属、研究激励以及数学知识传承等问题。声明同时开放后续签署，并迅速成为 2026 年 9 月 AI 与数学争议中机构回应所引用的共同体文本。

summary:
  en: >-
    The declaration emerged from discussions among its initial signatories during a week of intense debate over rapidly improving AI systems and high-profile mathematical problem solving. It framed the central concern as a misalignment between benchmark-driven corporate incentives and the mathematical community's emphasis on understanding, communication, attribution, mentorship and durable knowledge. On 14 September, IMPA published the statement on its institutional news surface. On 15 September, the board of the French Mathematical Society cited it in an official position responding to the OpenAI Navier–Stokes announcement and its associated ethical controversy.
  zh-CN: >-
    该声明形成于一周内围绕 AI 数学能力快速提升和高关注度数学问题求解展开的密集讨论。其核心框架是：企业以 benchmark 和竞赛式突破为导向的激励，可能与数学共同体重视理解、交流、归属、人才培养和长期知识积累的价值发生错位。9 月 14 日，IMPA 在机构新闻页面转载声明；9 月 15 日，法国数学会理事会在回应 OpenAI Navier–Stokes 公告及相关伦理争议的正式立场中直接引用该声明。

why_it_matters:
  en: >-
    The event records a shift from isolated reactions to an explicit, field-specific critique of how advanced AI should interact with mathematical research. In relation to the earlier Leiden Declaration, it sharpened the governance debate around incentives, competition, credit, unpublished work and the preservation of human mathematical culture. Its significance lies in becoming an institutional reference point during a live AI4Math governance dispute, not in the prestige or number of signatories by itself.
  zh-CN: >-
    这一事件记录了数学共同体从零散反应转向针对先进 AI 如何参与数学研究的明确领域级批评。相较此前的 Leiden Declaration，它进一步把治理讨论聚焦到研究激励、竞赛式突破、署名与归属、未公开工作以及人类数学文化的保存。其历史意义来自它在正在发生的 AI4Math 治理争议中成为机构引用的参照文本，而非签署者数量或声望本身。

ai_role:
  level: not_applicable
  description:
    en: >-
      This Event records a human-authored community statement about the governance and social effects of AI in mathematics rather than an AI system performing mathematical work.
    zh-CN: >-
      本事件记录的是人类数学共同体围绕 AI 在数学研究中的治理与社会影响发布的声明，而不是 AI 系统执行具体数学工作，因此 AI role 不适用。

human_contribution:
  description:
    en: >-
      The initial signatories discussed, drafted and published the statement, invited broader community endorsement, and mathematical institutions subsequently incorporated it into public discussion of research norms and governance.
    zh-CN: >-
      首批签署者讨论、起草并发布声明，邀请更广泛的共同体参与；随后数学机构将该文本纳入关于研究规范与治理的公开讨论。

