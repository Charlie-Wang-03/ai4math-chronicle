significance:
  tier: H2
  rationale:
    en: >-
      Mathesis addressed a major interface bottleneck in neural theorem proving by coupling learned autoformalization of ordinary mathematical language with downstream Lean proof generation and feedback, rather than assuming an expert-written formal statement as the starting point.
    zh-CN: >-
      Mathesis 针对神经定理证明的重要接口瓶颈，将普通数学语言的学习式自动形式化与后续 Lean 证明生成和反馈连接起来，不再默认任务必须从专家编写的形式命题开始。

mathematical_novelty:
  type: tooling_only

interfaces:
- informal
- formal
- hybrid

claim:
  en: >-
    The Mathesis paper introduced an autoformalization-and-proving pipeline trained with reinforcement and preference feedback, together with LeanScorer and the Gaokao-Formal benchmark, and reported that pairing its autoformalizer with existing provers substantially improved end-to-end proving accuracy on natural-language problems.
  zh-CN: >-
    Mathesis 论文发布了结合强化学习与偏好反馈的自动形式化—证明管线，并提出 LeanScorer 与 Gaokao-Formal 基准；论文报告称，将其自动形式化器与既有证明器配合后，自然语言题目的端到端形式证明准确率获得显著提升。

summary:
  en: >-
    Mathesis translates an informal problem into a Lean 4 statement, scores candidate formalizations for syntactic and semantic quality, and uses downstream prover feedback to prefer statements that can support machine-checked proofs. Gaokao-Formal provides hundreds of challenging proof problems derived from Chinese college-entrance examinations for evaluating this full pipeline.
  zh-CN: >-
    Mathesis 将非形式题目翻译为 Lean 4 命题，对候选形式化结果的语法与语义质量进行评分，并利用下游证明器反馈偏好能够支撑机器检查证明的命题。Gaokao-Formal 则提供数百道源自中国高考的高难度证明题，用于评测完整管线。

why_it_matters:
  en: >-
    The work moved formal-math systems closer to the way mathematical problems are actually presented to humans: in natural language. It also made autoformalization quality part of an end-to-end proving objective rather than an isolated translation task.
  zh-CN: >-
    该工作让形式数学系统更接近人类实际接收数学问题的方式——自然语言，并把自动形式化质量纳入端到端证明目标，而不是把它仅视为孤立的翻译任务。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      Learned models generate Lean statements and downstream formal proofs, while Lean compilation, semantic scoring and prover feedback constrain and evaluate the automated pipeline.
    zh-CN: >-
      学习模型自动生成 Lean 命题与后续形式证明，Lean 编译、语义评分和证明器反馈则约束并评估这一自动化管线。

human_contribution:
  description:
    en: >-
      Researchers designed the autoformalization training procedure, LeanScorer, Gaokao-Formal and the end-to-end evaluation protocol, curated problems and analyzed the resulting system performance.
    zh-CN: >-
      研究者设计自动形式化训练流程、LeanScorer、Gaokao-Formal 与端到端评测协议，整理题目并分析系统表现。

