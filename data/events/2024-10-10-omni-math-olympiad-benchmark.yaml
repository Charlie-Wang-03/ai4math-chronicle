slug: omni-math-olympiad-benchmark
title:
  en: Omni-MATH refreshes Olympiad evaluation after older math benchmarks begin saturating
  zh-CN: Omni-MATH 在旧数学基准趋于饱和后更新奥赛级评测
dates:
  event: '2024-10-10'
  first_public_claim: '2024-10-10'
  paper_release: '2024-10-10'
