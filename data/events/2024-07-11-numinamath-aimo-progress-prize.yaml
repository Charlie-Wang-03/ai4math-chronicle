slug: numinamath-aimo-progress-prize
title:
  en: NuminaMath wins the first AIMO Progress Prize with an open tool-using math model
  zh-CN: NuminaMath 以开放工具型数学模型赢得首届 AIMO Progress Prize
dates:
  event: '2024-07-11'
  first_public_claim: '2024-07-11'
