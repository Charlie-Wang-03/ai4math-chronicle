id: evt-2020-metagen
slug: metagen-synthetic-theorem-generation

title:
  en: MetaGen learns to generate synthetic theorems and proofs for theorem-prover training
  zh-CN: MetaGen 学习生成合成定理与证明，用于训练定理证明器

dates:
  event: '2020-02-17'
  first_public_claim: '2020-02-17'
  paper_release: '2020-02-17'
  artifact_release: null
  independently_verified: null
  added_to_chronicle: '2026-09-11'
  last_updated: '2026-09-11'

event_types:
- proof
- system
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      MetaGen made learned generation of synthetic formal theorems and proofs a practical data-augmentation strategy for neural theorem proving, addressing the scarcity of human-written formal proof data and improving a Metamath prover on real tasks.
    zh-CN: >-
      MetaGen 将学习式生成合成形式定理与证明发展为神经定理证明中的实用数据增强路线，用于缓解人工形式证明数据稀缺，并提升 Metamath 真实任务上的证明器表现。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: >-
    MetaGen trained a neural generator to synthesize Metamath theorems together with proofs and used those generated examples to improve a neural theorem prover, with the authors reporting state-of-the-art automated theorem-proving performance on their Metamath evaluation.
  zh-CN: >-
    MetaGen 训练神经生成器合成带有证明的 Metamath 定理，并用这些生成样本改进神经定理证明器；作者报告其在所用 Metamath 评测上取得当时领先的自动定理证明表现。

summary:
  en: >-
    The system learns from existing formal mathematics, generates additional theorem-proof pairs, and feeds the synthetic corpus back into prover training rather than relying only on scarce human-authored proof traces.
  zh-CN: >-
    该系统从既有形式数学中学习，生成额外的定理—证明对，再把合成语料反馈到证明器训练中，而不是仅依赖稀缺的人工证明轨迹。

why_it_matters:
  en: >-
    It established an early neural data-generation route for formal mathematics that complements later proof-artifact, synthetic-formalization and self-training pipelines.
  zh-CN: >-
    它较早确立了面向形式数学的神经数据生成路线，并与后来利用证明产物、合成形式化和自训练的数据管线形成历史上的连续技术脉络。

ai_role:
  level: ai_substantive_support
  description:
    en: >-
      A learned generator produces synthetic formal theorem-proof pairs, while a learned prover is trained on the augmented corpus to search for proofs of target theorems.
    zh-CN: >-
      学习式生成器产生合成形式定理—证明对，学习式证明器再利用扩充后的语料训练并搜索目标定理的证明。

human_contribution:
  description:
    en: >-
      Researchers designed the generator-prover training loop, formal data pipeline and evaluation, and the Metamath library supplied the human-authored formal corpus and proof checker.
    zh-CN: >-
      研究者设计生成器—证明器训练循环、形式数据管线与评测；Metamath 库提供人工编写的形式语料和证明检查器。

