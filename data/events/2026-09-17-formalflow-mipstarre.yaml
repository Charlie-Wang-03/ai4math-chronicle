significance:
  tier: H2
  rationale:
    en: >-
      FormalFlow is a field milestone in long-horizon AI-assisted formalization because
      it reports completion of a machine-checked Lean development for the quantum
      soundness theorem of the classical low individual-degree test, a technically
      central ingredient underlying MIP* = RE. The project required 63 days and produced
      126,367 lines of Lean code generated by proving agents under human supervision,
      demonstrating sustained proof planning, composition and review far beyond
      isolated theorem-hole solving while stopping short of a new mathematical theorem.
    zh-CN: >-
      FormalFlow 构成长程 AI 辅助形式化方向的领域级里程碑：它报告完成了经典低个体次数
      测试 quantum soundness 定理的 Lean 机器检查形式化，而该定理是 MIP* = RE 证明
      体系中的核心技术组成。项目历时 63 天，形成 126,367 行由证明 Agent 生成、在人类
      监督下完成的 Lean 代码，体现了远超单个 proof hole 求解的持续规划、组合与审查能力；
      但其核心贡献是已知研究证明的形式化，而不是新的数学定理。

mathematical_novelty:
  type: formalization_of_known_result

interfaces:
- formal
- hybrid

claim:
  en: >-
    The FormalFlow team reported a complete machine-checked Lean 4 proof of the quantum
    soundness of the classical low individual-degree test, a core theorem used in the
    MIP* = RE line of work. The paper reports that the development took 63 days, contains
    126,367 lines of Lean code generated by AI proving agents, and corrected several
    side conditions and intermediate errors while preserving the published final error
    bound under corrected assumptions.
  zh-CN: >-
    FormalFlow 团队报告完成经典低个体次数测试 quantum soundness 定理的完整 Lean 4
    机器检查证明；该定理是 MIP* = RE 研究路线中的核心定理之一。论文报告该开发历时
    63 天，包含 126,367 行由 AI 证明 Agent 生成的 Lean 代码，并在保持修正后假设下
    最终误差界不变的同时，纠正了若干边界条件与中间错误。

summary:
  en: >-
    FormalFlow organizes long formalization projects around a shared blueprint and
    nested planning, proving and review loops. AI agents implement and review proof
    tasks while humans supervise the project, compare the formal development with the
    source mathematics and resolve semantic discrepancies. The public MIPStarRE
    repository preserves Lean sources, the active blueprint, source-paper material and
    CI-oriented proof-integrity infrastructure.
  zh-CN: >-
    FormalFlow 以共享 blueprint 为核心，将长程形式化组织为嵌套的规划、证明与审查循环。
    AI Agent 负责实现和审查证明任务，人类则监督整体项目、对照形式化开发与原始数学文本，
    并处理语义偏差。公开的 MIPStarRE 仓库保存 Lean 源码、活动 blueprint、源论文材料
    以及面向 CI 的证明完整性基础设施。

why_it_matters:
  en: >-
    Large research proofs expose failure modes that short theorem-proving benchmarks do
    not: statement drift, dependency management, incompatible local lemmas and review
    debt. FormalFlow provides evidence that agentic workflows can sustain a
    research-scale formalization over months while using the Lean kernel as a final
    syntactic proof checker and additional project processes to audit semantic fidelity.
  zh-CN: >-
    大型研究证明会暴露短题 benchmark 难以体现的问题，包括 statement drift、依赖管理、
    局部 lemma 不兼容与长期审查债务。FormalFlow 表明，Agent 工作流可以在数月尺度上
    持续推进研究级形式化，并把 Lean kernel 作为最终形式证明检查层，同时通过额外项目
    流程审查形式陈述与原始数学之间的语义忠实度。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      The paper states that the Lean library was generated by AI proving agents coordinated
      through FormalFlow, while humans supervised the project and intervened in planning,
      source-faithfulness review and resolution of proof or statement gaps.
    zh-CN: >-
      论文表示 Lean 代码库由 FormalFlow 协调的 AI 证明 Agent 生成；人类负责项目监督，
      并参与规划、源数学忠实度审查以及证明或陈述缺口的处理。

human_contribution:
  description:
    en: >-
      Human researchers designed and supervised the workflow, selected and interpreted
      the source theorem, maintained the blueprint and review process, and adjudicated
      semantic discrepancies between the paper and the formal development.
    zh-CN: >-
      人类研究者设计并监督工作流、选择和解释目标定理、维护 blueprint 与审查流程，
      并处理论文与形式化开发之间的语义差异。

