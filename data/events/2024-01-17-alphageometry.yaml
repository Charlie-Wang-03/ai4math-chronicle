title:
  en: AlphaGeometry reaches near gold-medallist performance on olympiad geometry benchmark
  zh-CN: AlphaGeometry 在奥林匹克几何基准上达到接近金牌选手的表现

dates:
  event: "2024-01-17"
  first_public_claim: "2024-01-17"
