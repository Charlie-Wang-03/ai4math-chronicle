    evidence_level: E2
    note:
      en: >-
        The arXiv and ICML research records establish HOList, its benchmark and the reported DeepHOL experiments. Machine checking refers to proof traces accepted through HOL Light and does not imply independent reproduction of the reported benchmark performance.
      zh-CN: >-
        arXiv 与 ICML 研究记录确认了 HOList、其 benchmark 以及论文报告的 DeepHOL 实验。machine_checked 仅指证明轨迹通过 HOL Light 检查，并不表示论文报告的 benchmark 性能已得到独立复现。
  - date: '2026-09-15'
    status: paper_released
    evidence_level: E3
    note:
      en: >-
        The public Deepmath codebase and HOList benchmark site expose the prover code, benchmark definition, model resources and proof-checking workflow. E3 denotes inspectable artifacts rather than independent confirmation of all experimental claims.
      zh-CN: >-
        公开的 Deepmath 代码库与 HOList benchmark 网站提供证明器代码、benchmark 定义、模型资源与证明检查流程。E3 表示存在可直接检查的 artifacts，而非对全部实验结论的独立确认。

