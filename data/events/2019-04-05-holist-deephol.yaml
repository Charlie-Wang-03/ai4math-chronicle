significance:
  tier: H2
  rationale:
    en: >-
      HOList combined an open HOL Light interaction environment, a benchmark drawn from a substantial formal mathematics library, and the DeepHOL neural prover in one reproducible research stack. It became an important early reference point for reinforcement-learning and neural proof guidance inside interactive theorem provers, preceding later systems that learned more of search and tactic selection end to end.
    zh-CN: >-
      HOList 将开放的 HOL Light 交互环境、源自大型形式数学库的 benchmark 与 DeepHOL 神经证明器整合为统一研究栈，成为强化学习与神经证明引导进入交互式定理证明的重要早期参照，并为后来更端到端地学习搜索与 tactic 选择的系统提供前史。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Google Research and collaborators released HOList, an open-source reinforcement-learning environment and benchmark built on HOL Light, together with DeepHOL, a deep-learning-driven tactic-based prover trained on human and synthesized proofs and evaluated on theorem corpora including Flyspeck-derived material.
  zh-CN: >-
    Google Research 与合作研究者发布 HOList：一个基于 HOL Light 的开源强化学习环境与 benchmark，并配套发布 DeepHOL 深度学习 tactic 证明器；该系统利用人工与合成证明训练，并在包含 Flyspeck 相关内容的定理语料上进行评测。

summary:
  en: >-
    HOList instrumented HOL Light so learning systems could interact with proof states and tactics through a machine-learning environment. The benchmark packaged theorem statements from core, complex and Flyspeck corpora with train, validation and test labels, while DeepHOL supplied a neural prover and reinforcement-learning loop for generating additional successful proof traces.
  zh-CN: >-
    HOList 对 HOL Light 进行工程化封装，使学习系统能够通过机器学习环境与证明状态和 tactics 交互。其 benchmark 将 core、complex 与 Flyspeck 语料中的定理陈述整理为训练、验证和测试划分；DeepHOL 则提供神经证明器与强化学习循环，用于持续生成新的成功证明轨迹。

why_it_matters:
  en: >-
    The release showed how a mature proof assistant and a substantial mathematical library could be exposed as a learning environment rather than only as a static corpus. That environment-plus-benchmark pattern became central to later neural theorem-proving infrastructure and made proof-assistant-native reinforcement learning a concrete experimental program.
  zh-CN: >-
    该工作展示了如何把成熟证明助手与大型数学库转化为可交互的学习环境，而不仅是静态语料。此后“环境 + benchmark”的模式成为神经定理证明基础设施的重要范式，并使证明助手原生的强化学习成为可重复研究路线。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      DeepHOL used learned models to guide tactic choice, premise selection and proof search, including reinforcement from synthesized successful proofs; candidate proofs were ultimately checked through the HOL Light environment.
    zh-CN: >-
      DeepHOL 使用学习模型引导 tactic 选择、前提选择与证明搜索，并利用合成成功证明进行强化训练；候选证明最终通过 HOL Light 环境接受机械检查。

human_contribution:
  description:
    en: >-
      Researchers built the HOL Light interface, benchmark extraction, training pipeline, proof-search machinery, neural models, reinforcement-learning loop and evaluation protocol.
    zh-CN: >-
      研究者构建 HOL Light 交互接口、benchmark 抽取流程、训练管线、证明搜索机制、神经模型、强化学习循环与评测协议。

