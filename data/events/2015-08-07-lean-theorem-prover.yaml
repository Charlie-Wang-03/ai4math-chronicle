significance:
  tier: H2
  rationale:
    en: >-
      Lean established a new dependent-type proof-assistant platform explicitly designed to combine interactive theorem proving with automation, laying the technical foundation for the later Lean/mathlib ecosystem and a major share of modern AI-assisted formal mathematics.
    zh-CN: >-
      Lean 建立了新的依赖类型证明助手平台，并从设计上明确结合交互式定理证明与自动化，为后来的 Lean/mathlib 生态以及现代 AI 辅助形式数学的重要路线奠定技术基础。

