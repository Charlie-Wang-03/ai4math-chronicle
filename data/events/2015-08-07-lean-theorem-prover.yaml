claim:
  en: >-
    At CADE-25 on 7 August 2015, Leonardo de Moura and collaborators presented Lean as a new open-source theorem prover with a small trusted kernel based on dependent type theory and an explicit goal of bridging interactive and automated theorem proving. The Springer CADE-25 proceedings containing the system description were published on 30 July 2015. The official Lean history records the first repository commit in July 2013 and the official Lean 0.1 release in June 2014; because those earlier records are month-precision only, this Event uses the exact CADE presentation date as its canonical public anchor.
  zh-CN: >-
    2015 年 8 月 7 日 CADE-25 上，Leonardo de Moura 与合作者将 Lean 公开描述为一种新的开源定理证明器：它采用基于依赖类型理论的小型可信内核，并明确以连接交互式与自动定理证明为目标。收录该系统论文的 Springer CADE-25 proceedings 于 2015 年 7 月 30 日出版。Lean 官方历史记录其仓库首次 commit 于 2013 年 7 月、Lean 0.1 正式发布于 2014 年 6 月；由于这些更早记录仅精确到月份，本条采用具有精确日期的 CADE 展示作为 canonical 公开锚点。

summary:
  en: >-
    Lean combined a small proof-checking kernel, an expressive dependent type theory, interactive proof development and extensible automation in one open platform intended for formalized mathematics as well as verification.
  zh-CN: >-
    Lean 在一个开放平台中结合小型证明检查内核、富表达力的依赖类型理论、交互式证明开发与可扩展自动化，并同时面向形式化数学与验证任务。

why_it_matters:
  en: >-
    The system became a durable substrate for large formal mathematical libraries and later learning-based theorem provers, making its pre-2016 introduction essential historical context for the Chronicle's later Lean-centered AI4Math milestones.
  zh-CN: >-
    该系统后来成为大型形式数学库与学习式定理证明器的长期基础，因此其 2016 年以前的形成是理解 Chronicle 后续大量 Lean 相关 AI4Math 里程碑所必需的历史背景。

ai_role:
  level: computation_only
  description:
    en: >-
      Lean's trusted kernel mechanically checks formal proof terms, while its proof language and automation support construction of proofs; humans supplied the mathematical statements, formalizations and system design.
    zh-CN: >-
      Lean 的可信内核机械检查形式证明项，其证明语言与自动化支持证明构造；数学陈述、形式化内容与系统设计主要由人类提供。

human_contribution:
  description:
    en: >-
      Leonardo de Moura, Soonho Kong, Jeremy Avigad, Floris van Doorn, Jakob von Raumer and collaborators designed and implemented the early Lean system, its kernel, elaborator, automation interfaces and mathematical applications.
    zh-CN: >-
      Leonardo de Moura、Soonho Kong、Jeremy Avigad、Floris van Doorn、Jakob von Raumer 与合作者设计并实现早期 Lean 系统，包括内核、elaborator、自动化接口及数学应用。

