significance:
  tier: H1
  rationale:
    en: The result was an early public demonstration that a general-purpose reasoning model could produce natural-language solutions at the IMO gold threshold.
    zh-CN: 该结果较早公开展示了通用推理模型能够直接生成达到 IMO 金牌线的自然语言解答。
mathematical_novelty:
  type: benchmark_result
interfaces:
- informal
claim:
  en: OpenAI reported that an experimental reasoning model scored 35/42 on IMO 2025, solving five of six problems in natural language; public proofs were graded by three former IMO medalists.
  zh-CN: OpenAI 报告一个实验性推理模型在 IMO 2025 获得 35/42 分，以自然语言解出六题中的五题；公开证明由三位前 IMO 奖牌获得者评分。
summary:
  en: The model worked from official natural-language problem statements without a proof assistant or internet access during the evaluation.
  zh-CN: 该模型直接处理官方自然语言题目，在评测过程中不使用证明助手或互联网。
why_it_matters:
  en: Alongside Gemini's officially coordinated result days later, it marked the transition of general reasoning models into elite Olympiad-level mathematics.
  zh-CN: 与数日后 Gemini 经 IMO 协调认证的结果一起，它标志着通用推理模型进入顶尖奥赛数学水平。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The model generated complete natural-language proof attempts under contest-style constraints.
    zh-CN: 模型在类似竞赛的约束下生成完整自然语言证明。
human_contribution:
  description:
    en: OpenAI researchers ran the evaluation and former IMO medalists graded the public solutions.
    zh-CN: OpenAI 研究者组织评测，前 IMO 奖牌获得者对公开解答进行评分。
