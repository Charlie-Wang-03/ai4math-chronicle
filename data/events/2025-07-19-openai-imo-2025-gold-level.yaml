      zh-CN: 独立报道已经对该事件核心描述形成佐证：OpenAI 的独立评测公开了自然语言解答，由三位前 IMO 奖牌获得者评分，并报告 35/42 的金牌线成绩。Chronicle 同时保留关键区别：这并不是 Google Gemini 所参加的 IMO 协调评分流程。
