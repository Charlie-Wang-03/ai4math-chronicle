significance:
  tier: H2
  rationale:
    en: >-
      Numina-Lean-Agent showed a distinct formal-mathematics architecture in which a general coding agent could directly operate Lean and call specialized tools through MCP, rather than depending on a task-specific prover pipeline or newly trained formal model.
    zh-CN: >-
      Numina-Lean-Agent 展示了一种不同的形式数学架构：通用 Coding Agent 可以直接操作 Lean，并通过 MCP 自主调用专用工具，而不必依赖任务专用的证明管线或新训练的形式证明模型。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- hybrid

claim:
  en: >-
    The paper reported that Numina-Lean-Agent, built around Claude Code and Numina-Lean-MCP, solved all 12 Putnam 2025 problems with Claude Opus 4.5 and was also used with mathematicians to formalize the Effective Brascamp–Lieb theorem; the agent implementation and formal solutions were released publicly.
  zh-CN: >-
    论文报告称，基于 Claude Code 与 Numina-Lean-MCP 的 Numina-Lean-Agent 在 Claude Opus 4.5 上完成了 2025 Putnam 的全部 12 道题，并与数学家协作完成 Effective Brascamp–Lieb 定理的形式化；Agent 实现与形式证明结果均已公开。

summary:
  en: >-
    The system uses a general-purpose coding-agent loop as the controller for Lean work and extends it with theorem retrieval, informal proving, verification and auxiliary reasoning tools exposed through an MCP-oriented interface. Its public repository includes setup instructions, runnable agent tooling and links to the Putnam proof artifacts.
  zh-CN: >-
    该系统以通用 Coding Agent 循环作为 Lean 工作的控制器，并通过面向 MCP 的接口接入定理检索、非形式证明、验证和辅助推理工具。公开仓库提供安装说明、可运行的 Agent 工具以及 Putnam 形式证明产物。

why_it_matters:
  en: >-
    The work connected the rapidly developing coding-agent ecosystem to formal mathematics and suggested that improvements in general agent harnesses and base models could transfer directly into theorem proving without rebuilding a bespoke prover stack for each task.
  zh-CN: >-
    该工作把快速发展的 Coding Agent 生态直接连接到形式数学，并表明通用 Agent Harness 与基础模型的改进有可能直接迁移到定理证明，而无需为每类任务重新构建专用证明栈。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      The coding agent autonomously inspects Lean goals, edits proof code and invokes specialized reasoning and retrieval tools; Lean compiler feedback mechanically constrains accepted formal outputs.
    zh-CN: >-
      Coding Agent 自主检查 Lean 目标、编辑证明代码并调用专用推理与检索工具；Lean 编译器反馈对被接受的形式输出进行机械约束。

human_contribution:
  description:
    en: >-
      Researchers designed the agent and MCP tool interface, configured evaluation tasks, released the implementation and proof artifacts, and supplied mathematician collaboration and semantic oversight in the research-level formalization case.
    zh-CN: >-
      研究者设计 Agent 与 MCP 工具接口、配置评测任务、公开实现及证明产物，并在研究级形式化案例中提供数学家协作与语义监督。

