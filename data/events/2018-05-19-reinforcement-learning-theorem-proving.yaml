significance:
  tier: H2
  rationale:
    en: >-
      Reinforcement Learning of Theorem Proving established a prominent large-scale route in which an automated prover improves search guidance from its own previous proof attempts rather than relying primarily on hand-built domain heuristics. It helped make reinforcement learning over broad formal-theorem corpora a concrete AI4Math research program before later proof-assistant-native RL systems.
    zh-CN: >-
      Reinforcement Learning of Theorem Proving 建立了一条具有代表性的大规模路线：自动证明器从此前的证明尝试中学习搜索引导，而不是主要依赖人工编写的领域启发式。它在后续证明助手原生强化学习系统出现之前，推动面向大规模形式定理语料的强化学习成为具体的 AI4Math 研究方向。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Cezary Kaliszyk, Josef Urban, Henryk Michalewski and Mirek Olšák introduced a connection-style theorem prover whose Monte Carlo simulations were guided by reinforcement learning from previous proof attempts. The paper reported that its strongest trained configuration solved more than 40% more previously unseen problems than a baseline prover under the same inference budget.
  zh-CN: >-
    Cezary Kaliszyk、Josef Urban、Henryk Michalewski 与 Mirek Olšák 提出一种 connection-style 定理证明器，使用从此前证明尝试中学习的强化学习策略引导蒙特卡洛模拟。论文报告称，在相同推理预算下，最强训练配置在此前未见问题上比基线证明器多解决超过 40% 的问题。

summary:
  en: >-
    The system repeatedly performs proof-search simulations, turns successful and failed attempts into learning signals, and retrains guidance used in subsequent searches. The approach was evaluated over a large formal-mathematics problem corpus, emphasizing learned search control rather than theorem-specific handwritten heuristics.
  zh-CN: >-
    该系统反复执行证明搜索模拟，把成功与失败的尝试转化为学习信号，并重新训练后续搜索所使用的引导策略。方法在大型形式数学问题语料上进行评测，重点是学习式搜索控制，而非针对具体定理手写启发式规则。

why_it_matters:
  en: >-
    The work showed that theorem proving could be organized as an iterative learning-and-search loop at substantial corpus scale. This helped connect automated theorem proving with modern reinforcement-learning methodology and supplied historical context for later self-improving and interactive proof-search agents.
  zh-CN: >-
    该工作展示了定理证明可以在相当规模的语料上组织为“学习—搜索—再学习”的迭代循环，推动自动定理证明与现代强化学习方法结合，并为后来的自我改进式和交互式证明搜索智能体提供历史前序。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      The learned policy guided proof-search simulations and was updated from prior proof attempts; the automated prover carried out the search and produced successful formal derivations without human step-by-step tactic selection.
    zh-CN: >-
      学习式策略引导证明搜索模拟，并根据此前证明尝试持续更新；自动证明器执行搜索并产生成功的形式推导，不需要人类逐步选择证明动作。

human_contribution:
  description:
    en: >-
      Researchers designed the connection-style prover, reinforcement-learning loop, search features, training/evaluation corpus and experimental protocol.
    zh-CN: >-
      研究者设计 connection-style 证明器、强化学习循环、搜索特征、训练与评测语料以及实验协议。

