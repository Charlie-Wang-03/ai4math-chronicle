    note:
      en: >-
        The arXiv record and public repository establish the archive's stated AI-maintained
        operating model and expose its CI, review and challenge-verification machinery.
        Reservoir independently indexes the Lean package and reports build results for
        repository revisions. These sources corroborate the existence and operation of
        the infrastructure but do not certify the mathematical semantics or novelty of
        every project contained in the evolving archive.
      zh-CN: >-
        arXiv 记录与公开仓库确认了该档案库所述 AI 维护运作模式，并公开其 CI、审查和
        challenge 验证机制。Reservoir 独立索引该 Lean package，并报告仓库版本的构建
        结果。这些证据佐证基础设施的存在与运行，但并不认证持续变化的档案中每个项目
        的数学语义或新颖性。

