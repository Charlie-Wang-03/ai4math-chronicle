significance:
  tier: H2
  rationale:
    en: >-
      Lean Pool is a field milestone in AI-maintained formal-mathematics infrastructure
      because it turns a large collection of independent Lean developments into an
      actively maintained archive with deterministic quality gates, LLM-assisted
      admission review, documentation, semantic search and a kernel-checked challenge
      workflow. Its significance is the operating model for maintaining formalized
      mathematics at scale with AI agents rather than a claim that every archived
      project was discovered or authored by AI.
    zh-CN: >-
      Lean Pool 构成 AI 维护形式数学基础设施方向的领域级里程碑：它把大量独立 Lean
      开发组织为持续维护的档案库，并配套确定性质量门禁、LLM 辅助准入审查、文档、
      语义检索以及由 kernel 检查的 challenge 工作流。其历史意义在于展示 AI Agent
      如何参与大规模形式化数学维护，而不是声称库内每个项目都由 AI 发现或编写。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal

claim:
  en: >-
    Lean Pool presents a repository of formalized mathematics that is grown, maintained
    and optimized with AI agents. The project accepts completed Lean developments that
    pass repository-wide build, linter, style and proof-integrity gates, supplements
    deterministic checks with LLM review, and maintains accepted projects against
    evolving Lean and Mathlib versions. Its separate challenge workflow uses Comparator
    to compare problem and solution statements and replay proofs through Lean's kernel.
  zh-CN: >-
    Lean Pool 将自身定位为由 AI Agent 扩展、维护和优化的形式化数学仓库。项目接收已完成
    的 Lean 开发，并要求通过全库构建、linter、风格和证明完整性门禁；确定性检查之外
    还加入 LLM 审查，并持续把已收录项目迁移到新的 Lean 与 Mathlib 版本。其独立
    challenge 工作流使用 Comparator 对照题目与解答陈述，并通过 Lean kernel 重放证明。

summary:
  en: >-
    The archive occupies a deliberately different position from Mathlib: it accepts
    independent completed formalization projects that may not fit Mathlib's tightly
    integrated library scope, while imposing automated maintenance and quality checks.
    The public repository reports that project imports are still selected by humans,
    while AI systems participate materially in review, maintenance and optimization.
    The corpus size changes continuously and is therefore not treated as a frozen
    historical claim in this Event.
  zh-CN: >-
    该档案库有意采用不同于 Mathlib 的定位：它接收可能不适合 Mathlib 高度整合式库结构
    的独立完整形式化项目，同时施加自动化维护与质量检查。公开仓库说明，目前项目导入
    仍由人类选择，而 AI 系统实质参与审查、维护与优化。由于库规模持续变化，本 Event
    不把某一时点的项目数或代码行数作为冻结的历史主张。

why_it_matters:
  en: >-
    As AI-generated and AI-assisted Lean projects proliferate, preservation and
    maintenance become bottlenecks distinct from proving individual theorems. Lean Pool
    supplies an AI-assisted archival layer between highly curated integrated libraries
    and loose standalone repositories, making maintenance, search, quality gates and
    challenge verification part of the AI4Math infrastructure problem.
  zh-CN: >-
    随着 AI 生成和 AI 辅助的 Lean 项目增多，保存与维护开始成为不同于“证明单个定理”
    的新瓶颈。Lean Pool 在高度精选的一体化数学库与松散独立仓库之间提供 AI 辅助档案层，
    把版本维护、检索、质量门禁与 challenge 验证都纳入 AI4Math 基础设施问题。

ai_role:
  level: ai_substantive_support
  description:
    en: >-
      AI agents materially support repository growth, maintenance, optimization and
      admission review. The repository explicitly states that projects have so far been
      selected and added by humans, and many archived formalizations are human-authored,
      so the archive should not be described as wholly AI-authored mathematics.
    zh-CN: >-
      AI Agent 实质参与仓库扩展、维护、优化与准入审查。仓库同时明确说明，目前项目仍由
      人类选择并加入，而且其中许多形式化本身由人类编写，因此不能把整个档案库描述为
      完全由 AI 创作的数学。

human_contribution:
  description:
    en: >-
      Human maintainers created the archive, choose candidate projects, define review and
      quality policies, maintain governance and can intervene in integration work; the
      project was created at the UW Lean Hackathon by Vasily Ilin and Justin Asher.
    zh-CN: >-
      人类维护者建立档案库、选择候选项目、制定审查与质量政策、维护治理并可参与集成工作；
      项目由 Vasily Ilin 与 Justin Asher 在 UW Lean Hackathon 期间创建。

