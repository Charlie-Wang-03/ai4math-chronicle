significance:
  tier: H2
  rationale:
    en: FrontierMath shifted informal mathematical evaluation from contest problems toward expert-authored problems spanning advanced and research mathematics.
    zh-CN: FrontierMath 把非形式数学评测从竞赛题进一步推进到覆盖高阶与研究数学的专家原创问题。
mathematical_novelty:
  type: tooling_only
interfaces:
- informal
- symbolic
- numeric
- hybrid
claim:
  en: FrontierMath launched with hundreds of original expert-written problems across modern mathematics; leading models initially solved fewer than 2%.
  zh-CN: FrontierMath 发布数百道覆盖现代数学的专家原创问题；发布时领先模型的解题率均低于 2%。
summary:
  en: The benchmark was developed with more than sixty mathematicians and emphasized problems requiring hours or days of expert work.
  zh-CN: 该基准与六十余位数学家合作构建，强调通常需要专家数小时乃至数天才能解决的问题。
why_it_matters:
  en: It created a visible bridge between benchmarked model reasoning and the difficulty regime of genuine mathematical research.
  zh-CN: 它在可量化模型推理与真实数学研究难度之间建立了更直接的桥梁。
ai_role:
  level: computation_only
  description:
    en: Frontier models are evaluated with extended reasoning and computational tools on expert-created problems.
    zh-CN: 前沿模型在专家原创问题上使用长程推理和计算工具接受评测。
human_contribution:
  description:
    en: Mathematicians authored and vetted problems while Epoch AI designed the evaluation infrastructure.
    zh-CN: 数学家编写并审查问题，Epoch AI 设计评测基础设施。
