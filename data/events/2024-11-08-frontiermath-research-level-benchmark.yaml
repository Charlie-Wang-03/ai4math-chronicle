schema_version: 1
id: evt-2024-frontiermath
slug: frontiermath-research-level-benchmark
title:
  en: FrontierMath introduces expert-crafted research-level mathematics evaluation
  zh-CN: FrontierMath 引入专家构造的研究级数学评测
dates:
  event: '2024-11-08'
  first_public_claim: '2024-11-08'
  paper_release: null
