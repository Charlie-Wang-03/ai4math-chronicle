slug: sorrydb-real-world-lean-benchmark

title:
  en: SorryDB turns live proof holes from real Lean projects into a continuously updated benchmark
  zh-CN: SorryDB 将真实 Lean 项目的动态证明缺口转化为持续更新的基准

dates:
  event: '2026-03-03'
  first_public_claim: '2026-03-03'
