title:
  en: MizAR 40 scales AI/ATP methods across the full Mizar Mathematical Library
  zh-CN: MizAR 40 将 AI/ATP 方法扩展到完整 Mizar Mathematical Library

dates:
  event: '2013-10-10'
  first_public_claim: '2013-10-10'
