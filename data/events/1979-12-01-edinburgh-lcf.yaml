claim:
  en: >-
    The Springer monograph Edinburgh LCF: A Mechanized Logic of Computation, published on 1 December 1979, documented the Edinburgh LCF system and its ML-based proof environment. Milner's retrospective account dates the Edinburgh LCF project to 1974 and explains that ML was created as a metalanguage for machine-assisted proof after experience with Stanford LCF.
  zh-CN: >-
    Springer 专著 Edinburgh LCF: A Mechanized Logic of Computation 于 1979 年 12 月 1 日出版，系统记录 Edinburgh LCF 及其基于 ML 的证明环境。Milner 的历史回顾把 Edinburgh LCF 项目的启动时间定在 1974 年，并说明 ML 是在 Stanford LCF 实践基础上为机器辅助证明设计的元语言。

summary:
  en: >-
    Edinburgh LCF avoided retaining complete proof objects by exposing theorem values through a restricted abstract interface whose constructors corresponded to axioms and inference rules. Users could write higher-level proof procedures in the typed functional language ML, while tactics and tacticals supported reusable backward proof strategies.
  zh-CN: >-
    Edinburgh LCF 不再依赖保存完整证明对象，而是通过受限的抽象接口产生 theorem 值，其构造操作对应公理与推理规则。用户可以在有类型函数式语言 ML 中编写高层证明过程，并利用 tactics 与 tacticals 复用和组合反向证明策略。

why_it_matters:
  en: >-
    This separation between a small trusted logical core and powerful untrusted proof automation became one of the central engineering patterns of proof assistants. It made extensible automation compatible with strong assurance and created the lineage from LCF to HOL and Isabelle that later supplied machine-readable formal environments for AI theorem proving.
  zh-CN: >-
    这种“小型可信逻辑核心 + 强大但无需纳入可信基的证明自动化”分层成为证明助手最核心的工程范式之一，使可扩展自动化与高可信验证能够共存，并形成 LCF → HOL / Isabelle 的谱系，为后来的 AI 定理证明提供机器可读形式环境。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      Humans formulated goals and wrote or selected tactics, while the system executed tactic programs, performed inference and admitted theorem values only through the trusted logical interface.
    zh-CN: >-
      人类提出目标并编写或选择 tactics，系统执行 tactic 程序与推理，并只允许通过可信逻辑接口产生 theorem 值。

human_contribution:
  description:
    en: >-
      Robin Milner and the Edinburgh LCF team, including Michael Gordon, Christopher Wadsworth, Malcolm Newey and Lockwood Morris, designed the trusted architecture, ML metalanguage and tactic-based interaction model.
    zh-CN: >-
      Robin Milner 与 Edinburgh LCF 团队，包括 Michael Gordon、Christopher Wadsworth、Malcolm Newey 和 Lockwood Morris，设计可信架构、ML 元语言与基于 tactic 的交互模式。

