significance:
  tier: H2
  rationale:
    en: >-
      Edinburgh LCF turned lessons from Stanford LCF into a durable proof-assistant architecture: a small trusted inference interface protected by an abstract theorem type, an ML metalanguage for extending proof procedures, and tactics/tacticals for programmable goal-directed proof. These ideas became architectural foundations for HOL, Isabelle and many later interactive theorem provers.
    zh-CN: >-
      Edinburgh LCF 将 Stanford LCF 的实践经验发展为持久的证明助手架构：以抽象 theorem 类型保护小型可信推理接口，以 ML 元语言扩展证明过程，并用 tactics / tacticals 编排目标驱动证明。这些思想后来成为 HOL、Isabelle 等大量交互式定理证明器的架构基础。

