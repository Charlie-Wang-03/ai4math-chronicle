  tier: H3
  rationale:
    en: Lean-STaR explicitly inserted learned informal thoughts before proof steps and combined them with expert iteration.
    zh-CN: Lean-STaR 在形式证明步骤前显式插入学习到的非形式思考，并与专家迭代结合。
mathematical_novelty:
  type: benchmark_result
interfaces:
- informal
- formal
- hybrid
claim:
  en: Lean-STaR improved miniF2F pass@64 from 43.4% to 46.3% by training models to generate synthetic informal thoughts before tactics.
  zh-CN: Lean-STaR 通过训练模型在 tactic 前生成合成的非形式思考，将 miniF2F pass@64 从 43.4% 提升到 46.3%。
summary:
  en: The method generates retrospective thoughts from known tactics and then uses expert iteration on newly discovered verified proofs.
  zh-CN: 该方法从已知 tactic 反向生成思考文本，并对新发现且验证通过的证明执行专家迭代。
why_it_matters:
  en: It explored a direct bridge between chain-of-thought-style reasoning and proof-assistant feedback.
  zh-CN: 它探索了思维链式推理与证明助手反馈之间的直接桥接方式。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The model generates both informal thoughts and Lean tactics, while Lean verifies the proof state.
    zh-CN: 模型同时生成非形式思考与 Lean tactic，Lean 负责验证证明状态。
human_contribution:
