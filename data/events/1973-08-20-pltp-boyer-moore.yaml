significance:
  tier: H2
  rationale:
    en: Boyer and Moore's PLTP established a durable automated-induction lineage for reasoning about recursive Lisp functions, preceding the later Boyer–Moore prover, NQTHM and ACL2.
    zh-CN: Boyer 与 Moore 的 PLTP 建立了面向递归 Lisp 函数的自动归纳推理谱系，并成为后来的 Boyer–Moore prover、NQTHM 与 ACL2 的前史。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: Boyer and Moore presented “Proving Theorems about LISP Functions” at IJCAI-73, documenting the Edinburgh Pure Lisp Theorem Prover developed in 1972–1973 and its automated use of induction, rewriting and symbolic evaluation.
  zh-CN: Boyer 与 Moore 在 IJCAI-73 发表“Proving Theorems about LISP Functions”，公开记录 1972–1973 年开发的 Edinburgh Pure Lisp Theorem Prover 及其自动归纳、重写与符号求值方法。

summary:
  en: PLTP targeted properties of recursively defined programs that resolution-based first-order provers handled poorly, using domain-specific proof procedures centered on simplification and induction.
  zh-CN: PLTP 面向基于归结的一阶证明器难以处理的递归程序性质，采用以化简与归纳为核心的专门证明过程。

why_it_matters:
  en: It established a long-running architecture for automated inductive theorem proving and program verification that evolved into influential later systems.
  zh-CN: 它建立了长期发展的自动归纳定理证明与程序验证架构，并演化为多个重要后续系统。

ai_role:
  level: autonomous_primary
  description:
    en: The prover automatically simplified formulas, selected induction schemes and searched for proofs of recursive-function properties.
    zh-CN: 证明器自动化简公式、选择归纳方案并搜索递归函数性质的证明。

human_contribution:
  description:
    en: Robert Boyer and J Strother Moore designed and implemented the logic, heuristics and proof procedures.
    zh-CN: Robert Boyer 与 J Strother Moore 设计并实现逻辑、启发式与证明过程。

