significance:
  tier: H2
  rationale:
    en: Stanford LCF implemented Dana Scott's Logic for Computable Functions as an interactive proof checker with subgoaling and simplification, establishing practical experience that directly motivated the later Edinburgh LCF architecture.
    zh-CN: Stanford LCF 将 Dana Scott 的 Logic for Computable Functions 实现为带有子目标分解与化简机制的交互式证明检查器，为后来 Edinburgh LCF 的架构创新提供了直接实践基础。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: Robin Milner's January 1972 publication described an implemented proof checker for Scott's Logic for Computable Functions and showed formal reasoning about recursively defined programs; contemporary and retrospective records identify this system as Stanford LCF, developed at Stanford in 1971–1972 with Richard Weyhrauch and Malcolm Newey.
  zh-CN: Robin Milner 于 1972 年 1 月发表的论文描述了 Scott 的 Logic for Computable Functions 的已实现证明检查器，并展示了对递归定义程序的形式推理；同期与后来的历史资料均将这一系统识别为 Stanford LCF，由 Milner、Richard Weyhrauch 与 Malcolm Newey 于 1971–1972 年在 Stanford 开发。

summary:
  en: Stanford LCF let users state proof goals, decompose them into subgoals and apply simplification and inference commands while the machine checked the resulting formal derivations. It predated the extensible ML metalanguage, abstract theorem type and programmable tactics that characterized Edinburgh LCF.
  zh-CN: Stanford LCF 允许用户提出证明目标、分解子目标，并通过化简与推理命令构造由机器检查的形式推导。它早于 Edinburgh LCF 中可扩展的 ML 元语言、抽象 theorem 类型与可编程 tactics。

why_it_matters:
  en: The system made interactive machine-assisted proof concrete and exposed limitations in memory use and fixed proof commands. Those limitations became design targets for Edinburgh LCF, which in turn shaped the trusted-kernel architecture of many later proof assistants.
  zh-CN: 该系统把交互式机器辅助证明落实为可运行工具，同时暴露了证明对象占用内存以及证明命令固定等限制；这些问题随后成为 Edinburgh LCF 的直接设计目标，并间接塑造大量后续证明助手的可信内核架构。

ai_role:
  level: computation_only
  description:
    en: The machine checked formal derivations and provided subgoaling and simplification support, while users supplied substantial proof direction.
    zh-CN: 机器负责检查形式推导并提供子目标分解与化简支持，证明方向仍主要由用户给出。

human_contribution:
  description:
    en: Robin Milner, Richard Weyhrauch, Malcolm Newey and collaborators developed the Stanford LCF proof-checking system and its applications to reasoning about programs.
    zh-CN: Robin Milner、Richard Weyhrauch、Malcolm Newey 与合作者开发 Stanford LCF 证明检查系统及其程序推理应用。

