title:
  en: Process supervision and PRM800K establish step-level verification for math reasoning
  zh-CN: 过程监督与 PRM800K 建立数学推理的步骤级验证路线

dates:
  event: '2023-05-31'
  first_public_claim: '2023-05-31'
  paper_release: '2023-05-31'
  artifact_release: '2023-05-31'
  independently_verified: null
  added_to_chronicle: '2026-09-11'
  last_updated: '2026-09-11'

event_types:
- system
- dataset

significance:
  tier: H2
  rationale:
    en: >-
      The work made step-level human feedback a concrete and scalable research object for mathematical reasoning, directly comparing process and outcome supervision and releasing PRM800K as a large process-supervision dataset that influenced later verifier and reward-model work.
    zh-CN: >-
      该工作把步骤级人工反馈变成数学推理中可系统研究和扩展的对象，直接比较过程监督与结果监督，并发布大规模过程监督数据集 PRM800K，对后续验证器与奖励模型路线产生持续影响。

mathematical_novelty:
  type: tooling_only

interfaces:
- informal
- symbolic
- numeric

claim:
  en: >-
    OpenAI reported that process supervision significantly outperformed outcome supervision for training reward models on MATH solutions; its process-supervised model solved 78% of a representative held-out MATH subset, and the project released PRM800K with 800,000 step-level correctness labels.
  zh-CN: >-
    OpenAI 报告称，在 MATH 解题上使用过程监督训练奖励模型显著优于结果监督；其过程监督模型在代表性的留出 MATH 子集上解出 78% 的问题，并发布包含 80 万个步骤级正确性标签的 PRM800K。

summary:
  en: >-
    Rather than rewarding only a final answer, the project collected human judgments on intermediate reasoning steps and trained process reward models from those labels. PRM800K exposes the annotations, labeling instructions and scored model samples used in the study.
  zh-CN: >-
    该项目不只对最终答案给出奖励，而是收集中间推理步骤的人工判断，并据此训练过程奖励模型。PRM800K 公开了研究使用的标注、标注说明以及带评分的模型样本。

why_it_matters:
  en: >-
    Step-level verification became a durable component of later mathematical reasoning systems, providing training and selection signals that diagnose where a chain of reasoning first goes wrong rather than judging only its endpoint.
  zh-CN: >-
    步骤级验证后来成为数学推理系统的重要组成部分：它可以定位推理链从何处开始出错，并为训练与候选选择提供比只判断最终答案更细粒度的信号。

ai_role:
  level: ai_substantive_support
  description:
    en: >-
      Language models generated mathematical solution trajectories and learned reward models scored intermediate reasoning steps; the correctness labels used for process supervision were supplied by human annotators.
    zh-CN: >-
      语言模型生成数学解题轨迹，学习式奖励模型对中间推理步骤进行评分；过程监督所需的正确性标签由人工标注者提供。

human_contribution:
  description:
    en: >-
      Researchers designed the process-versus-outcome supervision comparison, data-collection and active-learning procedures, while human labelers supplied step-level judgments for PRM800K.
    zh-CN: >-
      研究者设计过程监督与结果监督的比较、数据收集及主动学习流程，人工标注者则为 PRM800K 提供步骤级判断。

