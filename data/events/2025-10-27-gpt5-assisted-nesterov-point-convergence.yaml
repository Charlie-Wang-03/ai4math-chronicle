    en: The result became a concrete case study of a mathematician using a frontier LLM to discover key ideas for a longstanding research problem while retaining human control of the final proof.
    zh-CN: 该结果成为数学家利用前沿 LLM 为长期研究问题发现关键思路、同时由人类掌控最终证明的具体案例。
