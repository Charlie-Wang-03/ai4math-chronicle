claim:
  en: Jang and Ryu reported a proof resolving the longstanding point-convergence question for Nesterov's accelerated gradient method, with the discovery heavily assisted by ChatGPT/GPT-5.
  zh-CN: Jang 与 Ryu 报告了 Nesterov 加速梯度法长期点收敛问题的证明，其发现过程受到 ChatGPT/GPT-5 的大量辅助。
summary:
  en: GPT-5 proposed multiple directions and several key structural ideas; Ryu checked, reformulated and wrote the rigorous final proof with coauthor Uijeong Jang.
  zh-CN: GPT-5 提出多个方向和若干关键结构性想法；Ryu 负责检查与重构，并与 Uijeong Jang 写成严格的最终证明。
why_it_matters:
  en: It exemplified human-AI mathematical collaboration in research rather than benchmark solving or autonomous proof search.
  zh-CN: 它展示了真实研究中的人机数学协作，而非仅仅基准求解或自主证明搜索。
ai_role:
  level: human_ai_collaboration
  description:
    en: GPT-5 generated candidate approaches and key ideas, some incorrect and some useful, that accelerated exploration.
    zh-CN: GPT-5 生成候选路径与关键想法，其中既有错误也有有效启发，从而加速研究探索。
human_contribution:
  description:
    en: Ryu and Jang validated the mathematics, developed the successful idea rigorously and authored the final paper.
    zh-CN: Ryu 与 Jang 验证数学内容、严谨发展成功思路并撰写最终论文。
