id: evt-2021-pact
slug: pact-proof-artifact-cotraining
title:
  en: PACT uses proof artifacts to scale language-model theorem proving
  zh-CN: PACT 利用证明产物扩展语言模型定理证明
dates:
  event: '2021-02-11'
  first_public_claim: '2021-02-11'
