significance:
  tier: H2
  rationale:
    en: >-
      TacticToe was an important early proof-assistant-native learning system that combined tactic prediction from recorded human HOL4 proofs with Monte Carlo tree search. By learning reusable proof-search guidance directly at the tactic level inside a mature interactive theorem prover, it helped establish a line of work later continued by reinforcement-learning systems such as TacticZero.
    zh-CN: >-
      TacticToe 是较早具有代表性的证明助手原生学习系统之一，将从人工 HOL4 证明中学习得到的 tactic 预测与蒙特卡洛树搜索结合起来。它直接在成熟交互式定理证明器内部学习可复用的 tactic 级证明搜索引导，为后来 TacticZero 等强化学习证明系统所延续的路线提供了重要前史。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Thibault Gauthier and collaborators introduced TacticToe, a HOL4 prover that learns tactic, theorem and goal-list predictions from recorded human proofs and uses Monte Carlo tree search to construct new proofs. The paper reported proving 66.4% of 7,164 HOL4 standard-library theorems within a 60-second limit, and 69.0% when combined with E prover.
  zh-CN: >-
    Thibault Gauthier 等研究者提出 TacticToe：一个从既有人工证明中学习 tactic、定理与目标列表预测，并使用蒙特卡洛树搜索构造新证明的 HOL4 证明器。论文报告称，在 60 秒限制下它能够证明 HOL4 标准库 7,164 个定理中的 66.4%，与 E prover 结合后达到 69.0%。

summary:
  en: >-
    TacticToe records proof tactics used throughout the HOL4 library, learns similarity-based predictors over proof states and candidate actions, and integrates those predictions into a tree search that repeatedly applies tactics to generated goals. The system therefore moves beyond static premise recommendation toward learned control of tactic-level interactive proof search.
  zh-CN: >-
    TacticToe 记录 HOL4 数学库中的证明 tactics，在证明状态与候选动作上学习基于相似性的预测器，并把这些预测接入树搜索，反复向生成的目标应用 tactics。因而该系统从静态的前提推荐进一步推进到对 tactic 级交互式证明搜索的学习式控制。

why_it_matters:
  en: >-
    The work demonstrated that proof-assistant traces could support an end-to-end loop of learned action prediction plus search while preserving kernel-checked proof construction. That combination became a recurring design pattern in later machine-learning systems for interactive theorem proving.
  zh-CN: >-
    该工作展示了证明助手轨迹可以支撑“学习式动作预测 + 搜索”的完整循环，同时仍由证明助手内核检查最终证明。这一组合随后成为交互式定理证明机器学习系统中的反复出现的设计范式。

ai_role:
  level: ai_primary_human_verified
  description:
    en: >-
      Learned predictors ranked tactics and supporting theorem choices while Monte Carlo tree search controlled proof exploration; successful proof scripts were constructed and checked inside HOL4.
    zh-CN: >-
      学习式预测器负责排序 tactics 与支持定理选择，蒙特卡洛树搜索负责控制证明探索；成功的证明脚本最终在 HOL4 内构造并接受检查。

human_contribution:
  description:
    en: >-
      Researchers designed the tactic-recording pipeline, learned predictors, search procedure and evaluation protocol, while the training signal came from existing human-written HOL4 proofs.
    zh-CN: >-
      研究者设计 tactic 记录流程、学习式预测器、搜索机制与评测协议；训练信号来自既有人工编写的 HOL4 证明。

