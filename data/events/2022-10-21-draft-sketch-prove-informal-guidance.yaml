id: evt-2022-draft-sketch-prove
slug: draft-sketch-prove-informal-guidance
title:
  en: Draft, Sketch, and Prove uses informal proofs to guide formal proof search
  zh-CN: Draft, Sketch, and Prove 用非形式证明引导形式证明搜索
dates:
  event: '2022-10-21'
  first_public_claim: '2022-10-21'
  paper_release: '2022-10-21'
  artifact_release: null
  independently_verified: null
