- system
significance:
  tier: H2
  rationale:
    en: DSP made informal reasoning an explicit intermediate representation between language models and formal theorem provers.
    zh-CN: DSP 将非形式推理显式作为语言模型与形式定理证明器之间的中间表示。
mathematical_novelty:
  type: tooling_only
interfaces:
- informal
- formal
- hybrid
claim:
  en: DSP mapped informal proofs into formal sketches and raised automated proving performance from 20.9% to 39.3% on a competition-problem collection.
  zh-CN: DSP 将非形式证明映射为形式 proof sketch，并在一组竞赛题上把自动证明性能从 20.9% 提升到 39.3%。
summary:
  en: Language models produce a high-level formal sketch whose subgoals are then discharged by an automated prover.
  zh-CN: 语言模型先生成高层形式证明草图，再由自动证明器完成其中的子目标。
why_it_matters:
  en: The architecture anticipated later systems that alternate natural-language decomposition with verifier-backed formal proof.
  zh-CN: 该架构预示了后来“自然语言分解 + 验证器支持的形式证明”交替执行的系统。
ai_role:
  level: ai_primary_human_verified
  description:
    en: Language models draft and sketch proof structure; formal provers verify and complete subproblems.
    zh-CN: 语言模型负责起草和构造证明结构，形式证明器验证并完成子问题。
human_contribution:
  description:
    en: Researchers designed the three-stage workflow and constructed evaluation problems and prompting procedures.
    zh-CN: 研究者设计三阶段工作流、评测问题与提示流程。
