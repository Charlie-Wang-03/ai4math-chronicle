significance:
  tier: H2
  rationale:
    en: First Proof moved frontier-model evaluation from contests and hidden benchmarks to expert-designed research proof attempts requiring prolonged community scrutiny.
    zh-CN: First Proof 把前沿模型评测从竞赛与隐藏基准推进到专家设计的研究级证明尝试，并要求持续社区审查。
mathematical_novelty:
  type: benchmark_result
interfaces:
- informal
- symbolic
claim:
  en: OpenAI published attempts on all ten First Proof problems and said at least five had a high chance of being correct, while explicitly retracting confidence in one earlier attempt after expert feedback.
  zh-CN: OpenAI 发布全部十道 First Proof 问题的证明尝试，称至少五份有较高概率正确，并在专家反馈后明确撤回对其中一份早期尝试的信心。
summary:
  en: The internal model worked with limited human supervision; researchers sometimes requested retries or clarifications and selected among attempts.
  zh-CN: 内部模型在有限人工监督下工作；研究者有时要求重试或澄清，并在人类判断下选择候选尝试。
why_it_matters:
  en: The episode provided unusually transparent evidence of both research-level capability and the verification difficulty of AI-generated mathematics.
  zh-CN: 该事件同时透明展示了研究级能力与 AI 生成数学在验证上的困难。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The model produced long research-level proof attempts across specialized domains.
    zh-CN: 模型在多个专业领域生成长篇研究级证明尝试。
human_contribution:
  description:
    en: Researchers prompted and selected attempts, experts supplied feedback, and correctness remained an explicit review question.
    zh-CN: 研究者负责提示与选择候选，专家提供反馈，而正确性被明确保留为待审查问题。
