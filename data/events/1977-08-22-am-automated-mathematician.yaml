significance:
  tier: H2
  rationale:
    en: Douglas Lenat's AM made automated mathematical discovery an explicit AI research program by using heuristic search to invent and prioritize mathematical concepts and formulate conjectures.
    zh-CN: Douglas Lenat 的 AM 把自动数学发现明确发展为 AI 研究方向，通过启发式搜索创造和筛选数学概念并形成猜想。

mathematical_novelty:
  type: new_conjecture
interfaces:
- symbolic
- informal

claim:
  en: At IJCAI-77, Lenat described AM, a program that conducted elementary mathematical exploration by defining new concepts, studying their properties and formulating conjectures under hundreds of heuristic rules.
  zh-CN: Lenat 在 IJCAI-77 介绍 AM：该程序在数百条启发式规则引导下定义新概念、研究其性质并形成猜想，从而执行初等数学探索。

summary:
  en: AM maintained an agenda of potentially interesting mathematical tasks and used general heuristics to decide which concepts, examples and conjectures to explore next.
  zh-CN: AM 维护潜在有趣数学任务的 agenda，并利用通用启发式决定下一步探索哪些概念、例子与猜想。

why_it_matters:
  en: It is an early direct ancestor of modern AI-for-mathematical-discovery work because the machine was tasked not merely with proving supplied statements but with shaping what mathematical objects and conjectures to investigate.
  zh-CN: 它是现代 AI 数学发现的重要早期前史，因为机器不仅证明给定命题，还参与决定应该研究哪些数学对象与猜想。

ai_role:
  level: autonomous_primary
  description:
    en: AM autonomously selected exploration tasks, generated concepts and formulated candidate conjectures using heuristic search.
    zh-CN: AM 通过启发式搜索自主选择探索任务、生成概念并形成候选猜想。

human_contribution:
  description:
    en: Douglas Lenat designed the representation, agenda mechanism and roughly 250 heuristic rules that structured AM's search.
    zh-CN: Douglas Lenat 设计表示、agenda 机制以及约 250 条用于组织 AM 搜索的启发式规则。

