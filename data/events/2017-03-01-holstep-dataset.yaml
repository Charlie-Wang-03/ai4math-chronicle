significance:
  tier: H2
  rationale:
    en: >-
      HolStep turned large-scale HOL Light proof traces into a public machine-learning dataset and benchmark with millions of labeled proof-step examples. By making premise usefulness and proof-step relevance measurable on real higher-order-logic mathematics, it supplied an early common substrate for neural theorem-proving research and directly enabled later work such as FormulaNet while anticipating richer HOL Light learning environments such as HOList.
    zh-CN: >-
      HolStep 将大规模 HOL Light 证明轨迹整理为公开机器学习数据集与 benchmark，包含数百万个带标签的证明步骤样本。它把真实高阶逻辑数学中的前提有用性与证明步骤相关性转化为可统一评测的问题，为早期神经定理证明研究提供了公共基础，并直接支撑 FormulaNet 等后续工作，也预示了 HOList 这类更完整的 HOL Light 学习环境。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Cezary Kaliszyk, François Chollet and Christian Szegedy released HolStep, a BSD-licensed dataset derived from 11,400 HOL Light proofs with more than two million labeled training and test proof-step examples, together with benchmark tasks and baseline logistic-regression, convolutional and recurrent neural models for classifying useful proof steps.
  zh-CN: >-
    Cezary Kaliszyk、François Chollet 与 Christian Szegedy 发布 HolStep：一个基于 11,400 条 HOL Light 证明构建、采用 BSD 许可的数据集，包含超过两百万个带标签的训练与测试证明步骤样本，并配套定义证明步骤有用性等 benchmark 任务以及逻辑回归、卷积网络和循环神经网络基线。

summary:
  en: >-
    HolStep extracts intermediate statements and conjectures from HOL Light proofs, canonicalizes their textual representation and pairs useful proof steps with negative examples. The release defines conditioned and unconditioned proof-step classification tasks and provides baseline code so researchers can compare learned representations and relevance models on a common formal-mathematics corpus.
  zh-CN: >-
    HolStep 从 HOL Light 证明中抽取中间陈述与 conjecture，对文本表示进行规范化，并把实际使用的证明步骤与负样本配对。该发布定义 conditioned 与 unconditioned proof-step classification 等任务，并提供基线代码，使研究者能够在统一的形式数学语料上比较学习式表示与相关性模型。

why_it_matters:
  en: >-
    The project helped shift machine learning for theorem proving from small bespoke experiments toward reusable datasets and reproducible evaluation. HolStep subsequently became a benchmark for neural architectures and an important historical precursor to later environment-plus-benchmark systems for formal mathematics.
  zh-CN: >-
    该项目推动定理证明机器学习从小规模、定制化实验走向可复用数据集与可复现评测。HolStep 随后成为多种神经架构的 benchmark，并成为后来“交互环境 + benchmark”形式数学系统的重要历史前序。

ai_role:
  level: computation_only
  description:
    en: >-
      Machine-learning models were trained to classify proof-step usefulness and related tasks on the extracted HOL corpus; the historical milestone is the benchmark and dataset rather than an AI-generated mathematical result.
    zh-CN: >-
      机器学习模型在抽取的 HOL 语料上训练，用于判断证明步骤有用性等任务；该历史节点的核心贡献是 benchmark 与数据集，而不是 AI 生成的新数学结果。

human_contribution:
  description:
    en: >-
      Researchers extracted and normalized the HOL Light proof corpus, designed positive and negative examples, defined benchmark tasks, released the dataset and implemented baseline models and evaluation.
    zh-CN: >-
      研究者抽取并规范化 HOL Light 证明语料、设计正负样本、定义 benchmark 任务、发布数据集，并实现基线模型与评测流程。

