title:
  en: Skip-tree training brings structure-aware self-supervision to formal mathematical reasoning
  zh-CN: Skip-tree 将结构感知的自监督训练引入形式数学推理

dates:
  event: '2020-06-08'
  first_public_claim: '2020-06-08'
