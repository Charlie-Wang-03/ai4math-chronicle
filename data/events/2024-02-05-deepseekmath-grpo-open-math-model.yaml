  tier: H2
  rationale:
    en: DeepSeekMath paired a strong open mathematical corpus pipeline with GRPO, a reinforcement-learning method that later became influential in reasoning-model training.
    zh-CN: DeepSeekMath 将高质量开放数学语料管线与 GRPO 强化学习结合，后者随后成为推理模型训练中的重要方法。
mathematical_novelty:
  type: benchmark_result
interfaces:
- informal
- symbolic
claim:
  en: DeepSeekMath-7B reached 51.7% on MATH without external tools or voting and introduced Group Relative Policy Optimization (GRPO).
  zh-CN: DeepSeekMath-7B 在不使用外部工具或投票的情况下于 MATH 达到 51.7%，并提出 Group Relative Policy Optimization（GRPO）。
summary:
  en: The model continued pretraining on 120B math-related tokens and then used supervised and reinforcement-learning stages for mathematical reasoning.
  zh-CN: 该模型在 120B 数学相关 token 上继续预训练，再通过监督与强化学习阶段提升数学推理。
why_it_matters:
  en: It linked open math-model scaling with a verifier-friendly RL recipe that influenced subsequent reasoning systems.
  zh-CN: 它把开放数学模型扩展与适合可验证任务的强化学习方法连接起来，并影响了后续推理系统。
ai_role:
  level: computation_only
  description:
    en: The trained model performs competition-level mathematical reasoning.
    zh-CN: 训练后的模型执行竞赛级数学推理。
human_contribution:
  description:
