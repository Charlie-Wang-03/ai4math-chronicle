  rationale:
    en: The first CADE ATP System Competition created a recurring common evaluation setting for fully automatic theorem provers, reinforcing TPTP-based benchmarking as field infrastructure.
    zh-CN: 首届 CADE ATP System Competition 为全自动定理证明器建立持续性的统一评测环境，并强化以 TPTP 为基础的 benchmark 制度。

mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic

claim:
  en: The CADE competition held on 1 August 1996 compared automated theorem-proving systems under common resource limits and problem sets, inaugurating the competition series later known as CASC.
  zh-CN: 1996 年 8 月 1 日举行的 CADE 竞赛在统一资源限制与问题集下比较自动定理证明系统，并开启后来称为 CASC 的持续竞赛系列。

summary:
  en: Systems were evaluated in a shared computational environment on standardized theorem-proving problems, making performance comparisons more reproducible and visible.
  zh-CN: 各系统在共享计算环境与标准化定理证明问题上评测，使性能比较更可复现、更透明。

why_it_matters:
  en: Recurring competitions helped turn automated theorem proving into a benchmark-driven research community with shared evaluation practices.
  zh-CN: 持续竞赛推动自动定理证明形成拥有共同评测实践的 benchmark 驱动研究共同体。

ai_role:
  level: computation_only
  description:
    en: Automated theorem provers solved benchmark problems; the Event's primary significance is comparative evaluation and field infrastructure.
    zh-CN: 自动定理证明器求解 benchmark 问题；该事件的主要意义在统一比较评测与领域基础设施。

human_contribution:
