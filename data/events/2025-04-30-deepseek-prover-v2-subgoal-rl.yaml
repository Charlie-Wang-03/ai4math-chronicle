claim:
  en: DeepSeek-Prover-V2-671B reported 88.9% on miniF2F-test and solved 49 of 658 PutnamBench problems.
  zh-CN: DeepSeek-Prover-V2-671B 报告 miniF2F-test 88.9%，并解出 PutnamBench 658 题中的 49 题。
summary:
  en: DeepSeek-V3 first decomposes problems into subgoals; successful subgoal proofs become cold-start reasoning traces for reinforcement learning.
  zh-CN: DeepSeek-V3 先把问题分解为子目标，成功的子目标证明被整理为强化学习的冷启动推理轨迹。
why_it_matters:
  en: The design made informal planning an explicit training scaffold for high-capacity formal theorem provers.
  zh-CN: 该设计把非形式规划显式变成高容量形式定理证明器的训练脚手架。
