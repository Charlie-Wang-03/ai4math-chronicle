claim:
  en: >-
    On 2 October 2026, Meta released six research papers produced by mathematicians
    working with Muse Spark 1.1 and 1.2 in Thinking Mode through the standard meta.ai
    chat interface. Meta states that five papers answer previously open research
    questions. The results include a finite-time blow-up theorem for the mass-critical
    biharmonic nonlinear Schrödinger equation, counterexamples in group theory and
    evolution algebras, an exactness characterization in optimization, a Gaussian
    ellipsoid-fitting threshold result, and a new arithmetic-physics connection.
  zh-CN: >-
    2026 年 10 月 2 日，Meta 发布六篇由数学家与 Muse Spark 1.1、1.2 在 Thinking Mode
    下通过普通 meta.ai 聊天界面合作完成的研究论文。Meta 表示其中五篇回答此前开放的
    研究问题。成果包括质量临界双调和非线性薛定谔方程的有限时间爆破解、群论与 evolution
    algebra 中的反例、优化问题中的精确性刻画、高斯椭球拟合阈值结果，以及新的算术物理联系。

summary:
  en: >-
    Meta says human mathematicians selected and guided the research, a separate group of
    mathematicians reviewed the work, each paper marks passages primarily drafted by
    researchers versus AI, and prior or concurrent work is credited. Muse Spark's role
    varied by project: it helped test and revise calculations, generated a GAP search
    program that found a 384-element group counterexample, proposed counterexamples and
    proof strategies, and generated candidate proofs and technical sections. Meta also
    acknowledges that several questions were independently resolved by other teams,
    including one semiabelian-group counterexample reported by the Nilradical AI agent
    before Meta's publication.
  zh-CN: >-
    Meta 表示，人类数学家负责选题并引导研究，另有一组数学家对工作进行审查；每篇论文标记
    哪些段落主要由研究者或 AI 起草，并明确引用已有及同期工作。Muse Spark 在不同项目中的
    作用并不相同：它协助测试与修订计算，生成 GAP 搜索程序并找到一个 384 阶群反例，
    提出反例与证明策略，还生成候选证明并起草技术章节。Meta 同时承认若干问题被其他团队
    独立解决，其中包括 Nilradical AI agent 在 Meta 发布前报告的另一 semiabelian-group 反例。

why_it_matters:
  en: >-
    The release shows a different AI4Math research mode from autonomous lab-scale search:
    expert mathematicians can use a generally available frontier chat model as an active
    research collaborator on genuine open questions while retaining explicit human
    authorship, review and passage-level attribution. The combination of ordinary user
    interface, heterogeneous mathematical contributions and transparent division of
    labour makes the batch a useful reference point for human–AI mathematical research
    practice even where individual priority is shared or concurrent.
  zh-CN: >-
    该发布展示了一种不同于实验室自主搜索的 AI4Math 研究模式：专业数学家可以把面向普通
    用户的前沿聊天模型作为开放问题研究中的活跃协作者，同时保留明确的人类署名、审查与
    段落级贡献标注。普通用户界面、多样化数学贡献以及透明分工的组合，使这批工作即使在
    部分成果存在同期或共享优先权的情况下，仍成为人机数学研究实践的重要参照。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      Muse Spark made substantive but project-dependent contributions under human
      direction. Meta documents roles ranging from calculations and proof exploration
      to code-generated counterexample search, candidate proofs, proof strategies and
      technical drafting. Human mathematicians selected the problems, steered the work,
      checked and corrected arguments, and a second group reviewed the papers.
    zh-CN: >-
      Muse Spark 在人类引导下承担实质但因项目而异的贡献。Meta 记录的作用包括计算与证明
      探索、通过代码搜索反例、生成候选证明与证明策略以及技术写作。人类数学家负责选题、
      引导研究、检查和修正论证，并由第二组数学家进行审查。

human_contribution:
  description:
    en: >-
      Human researchers supplied the research questions and mathematical direction,
      evaluated model suggestions, completed or corrected arguments, wrote substantial
      parts of the papers and accepted responsibility for the final results. Separate
      mathematicians reviewed the work before release.
    zh-CN: >-
      人类研究者提供研究问题与数学方向，评估模型建议，完成或修正论证，撰写论文中的
      实质内容并对最终成果负责；另有独立数学家在发布前进行审查。

