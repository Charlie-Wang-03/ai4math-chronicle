significance:
  tier: H2
  rationale:
    en: >-
      Meta's six-paper release is a field milestone because expert mathematicians used
      Muse Spark 1.1 and 1.2 through the ordinary meta.ai chat interface, without a
      bespoke research scaffold, to make substantive contributions across several areas
      of mathematics. Five papers answer previously open research questions according
      to Meta, and the release documents materially different AI roles including proof
      exploration, counterexample search, GAP code generation, cross-field connection
      finding and drafting technical arguments. The work is explicitly human-guided and
      reviewed, and several results have concurrent independent solutions, so it is
      better characterized as an H2 collaboration milestone than an autonomous H1 event.
    zh-CN: >-
      Meta 的六篇论文发布构成领域级里程碑，因为专业数学家使用 Muse Spark 1.1 与 1.2，
      直接通过普通 meta.ai 聊天界面、无需专门研究脚手架，在多个数学领域作出实质贡献。
      Meta 表示其中五篇回答此前开放的研究问题；公开材料还记录了多种不同 AI 角色，包括
      探索证明、搜索反例、生成 GAP 程序、发现跨领域联系以及起草技术论证。由于工作明确由
      人类引导并经第二组数学家审查，且若干结果存在同期独立解，本事件更适合定位为 H2
      人机协作里程碑，而非自主型 H1 事件。

