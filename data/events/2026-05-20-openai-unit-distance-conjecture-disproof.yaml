    en: A substantive AI-generated disproof of a longstanding Erdős conjecture is a historical AI4Math milestone because the central contribution is new mathematics rather than benchmark performance or a general model release; the H1 designation does not itself assert independent verification.
    zh-CN: AI 对长期存在的 Erdős 猜想给出实质性新反例属于历史级 AI4Math 里程碑，因为核心贡献是新的数学结果，而非基准成绩或通用模型发布；H1 定级本身不等同于已完成独立验证。
