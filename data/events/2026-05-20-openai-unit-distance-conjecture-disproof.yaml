  type: new_result
interfaces:
- informal
- symbolic
claim:
  en: OpenAI reported that an internal general reasoning model disproved the longstanding conjectured n^(1+o(1)) upper-growth behavior for planar unit distances by constructing infinitely many configurations with at least n^(1+delta) unit distances for fixed delta>0.
  zh-CN: OpenAI 报告内部通用推理模型反驳了平面单位距离问题长期流行的 n^(1+o(1)) 增长猜想，构造出无穷多个具有至少 n^(1+delta) 个单位距离的点集，其中 delta>0 为常数。
summary:
  en: The model found a construction using tools from algebraic number theory; OpenAI released the proof and a companion paper by external mathematicians who checked and contextualized the argument.
  zh-CN: 模型使用代数数论工具发现构造；OpenAI 同时发布证明与由外部数学家撰写的 companion paper，后者检查并解释了论证。
why_it_matters:
  en: Unlike benchmark progress, the event concerns a longstanding open problem in active mathematics and an AI-generated argument judged substantive by independent experts.
  zh-CN: 与基准进展不同，该事件涉及活跃数学领域的长期开放问题，且 AI 生成论证获得外部专家的实质性认可。
ai_role:
  level: autonomous_primary
  description:
    en: OpenAI states that the core construction and proof were generated autonomously by an internal general-purpose reasoning model.
    zh-CN: OpenAI 表示核心构造与证明由内部通用推理模型自主生成。
human_contribution:
  description:
    en: External mathematicians checked the proof and wrote companion analysis; OpenAI researchers ran the evaluation and publication process.
    zh-CN: 外部数学家检查证明并撰写 companion analysis；OpenAI 研究者组织评测与发布。
