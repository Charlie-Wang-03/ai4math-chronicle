significance:
  tier: H2
  rationale:
    en: >-
      CoqGym turned a large collection of real Coq developments into an interactive machine-learning environment containing tens of thousands of human proofs, while ASTactic generated structured tactics rather than choosing only from a fixed tactic vocabulary. The environment became an important early template for later proof-assistant learning infrastructure.
    zh-CN: >-
      CoqGym 将大量真实 Coq 工程转化为包含数万条人工证明的交互式机器学习环境；ASTactic 则生成结构化 tactic，而不是只从固定 tactic 集合中选择。该环境成为后来证明助手学习基础设施的重要早期范式之一。

mathematical_novelty:
  type: tooling_only

interfaces:
- formal
- symbolic

claim:
  en: >-
    Kaiyu Yang and Jia Deng released CoqGym, a dataset and interactive environment built from 71,000 human-written proofs across 123 Coq projects, together with ASTactic, a deep-learning model that generates tactics as abstract syntax trees and was reported to prove held-out theorems beyond the reach of the compared built-in automated tactics.
  zh-CN: >-
    Kaiyu Yang 与 Jia Deng 发布 CoqGym：一个由 123 个 Coq 项目、约 71,000 条人工证明构成的数据集与交互环境，并提出 ASTactic 深度学习模型，以抽象语法树形式生成 tactics；论文报告其能够证明部分比较基线中的内置自动 tactic 无法证明的留出定理。

summary:
  en: >-
    CoqGym extracted proof states, environments, goals, tactics and proof trees from open-source Coq projects and exposed them through a programmatic interaction layer. ASTactic learned proof-step generation from this corpus and composed tactics from runtime syntax rather than relying only on a predetermined list of complete tactics.
  zh-CN: >-
    CoqGym 从开源 Coq 项目中抽取证明状态、环境、目标、tactics 与证明树，并通过可编程交互层暴露这些信息。ASTactic 从该语料学习生成证明步骤，并基于运行时语法组合 tactics，而不是仅依赖预先固定的完整 tactic 列表。

why_it_matters:
  en: >-
    CoqGym made learning-based theorem proving on a mature interactive proof assistant substantially more data-rich and reproducible. Its environment-and-corpus design anticipated later projects such as LeanDojo that similarly expose large proof-assistant libraries as reusable machine-learning infrastructure.
  zh-CN: >-
    CoqGym 使成熟交互式证明助手上的学习式定理证明获得更丰富、可复现的数据与交互基础。其“环境 + 大型证明语料”设计预示了 LeanDojo 等后来项目把证明助手数学库封装为可复用机器学习基础设施的路线。

ai_role:
  level: autonomous_primary
  description:
    en: >-
      ASTactic generated structured Coq tactics from proof states and searched for proof scripts, while Coq checked whether generated tactic sequences produced valid formal proofs.
    zh-CN: >-
      ASTactic 根据证明状态生成结构化 Coq tactics 并搜索证明脚本，由 Coq 检查生成的 tactic 序列是否构成有效形式证明。

human_contribution:
  description:
    en: >-
      Researchers assembled and instrumented the Coq projects, designed the data extraction and interaction environment, defined train/validation/test splits, built ASTactic and evaluated it against automated tactics and theorem provers.
    zh-CN: >-
      研究者整理并改造 Coq 工程、设计数据抽取与交互环境、定义训练 / 验证 / 测试划分、构建 ASTactic，并将其与自动 tactics 和定理证明器进行评测比较。

