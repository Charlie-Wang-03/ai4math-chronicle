title:
  en: GSM-Symbolic exposes robustness failures behind high math-reasoning benchmark scores
  zh-CN: GSM-Symbolic 揭示高数学推理基准分数背后的鲁棒性缺陷

dates:
  event: '2024-10-07'
  first_public_claim: '2024-10-07'
  paper_release: '2024-10-07'
  artifact_release: null
  independently_verified: null
  added_to_chronicle: '2026-09-11'
