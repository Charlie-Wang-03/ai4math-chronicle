significance:
  tier: H2
  rationale:
    en: Seed-Prover showed that Lean-verified long-reasoning systems could scale to most of a contemporary IMO and substantially raise PutnamBench performance.
    zh-CN: Seed-Prover 展示了 Lean 验证的长程推理系统可以扩展到当届 IMO 大多数题目，并显著提升 PutnamBench 表现。
mathematical_novelty:
  type: benchmark_result
interfaces:
- formal
- symbolic
claim:
  en: Seed-Prover reported proving 78.1% of formalized past IMO problems, more than half of PutnamBench, and five of six IMO 2025 problems with Seed-Prover plus Seed-Geometry.
  zh-CN: Seed-Prover 报告证明 78.1% 的形式化历届 IMO 问题、超过一半 PutnamBench，并通过 Seed-Prover 与 Seed-Geometry 完成 IMO 2025 六题中的五题。
summary:
  en: The system iteratively refines whole proofs from Lean feedback and uses test-time strategies for deep and broad search.
  zh-CN: 系统依据 Lean 反馈迭代改进整段证明，并使用深度与广度相结合的测试时搜索策略。
why_it_matters:
  en: It pushed formal Olympiad proving from benchmark progress toward near-complete coverage of a live IMO problem set.
  zh-CN: 它把形式奥赛证明从基准进展推进到几乎覆盖一届真实 IMO 题集。
ai_role:
  level: ai_primary_human_verified
  description:
    en: The prover iteratively revises whole Lean proofs and a dedicated geometry engine handles formal geometry.
    zh-CN: 证明器迭代修订整段 Lean 证明，专用几何引擎处理形式几何问题。
human_contribution:
  description:
    en: Researchers designed inference strategies, training and the geometry engine and evaluated formal proofs.
    zh-CN: 研究者设计推理策略、训练流程与几何引擎并评测形式证明。
