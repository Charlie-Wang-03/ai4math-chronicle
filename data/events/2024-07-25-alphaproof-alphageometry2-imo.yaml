event_types: [competition, proof, formalization, system]

significance:
  tier: H1
  rationale:
    en: The combined system was reported as the first AI system to achieve medal-level performance on a full set of current IMO problems, while also exposing the practical trade-offs of manual formalization and multi-day computation.
    zh-CN: 该组合系统被报告为首个在当届完整 IMO 题集上达到奖牌水平的 AI 系统，同时也清楚暴露了人工形式化与多日计算的实际代价。

mathematical_novelty:
  type: benchmark_result
interfaces: [formal, symbolic, hybrid]

claim:
  en: AlphaProof solved three non-geometry IMO 2024 problems and AlphaGeometry 2 solved the geometry problem. The four perfect solutions totaled 28/42 points, equivalent to the top end of the silver-medal range and one point below the gold threshold that year.
  zh-CN: AlphaProof 解出 3 道非几何的 IMO 2024 题目，AlphaGeometry 2 解出几何题；4 道满分解答合计 28/42 分，对应当年银牌区间上沿，距金牌线 1 分。

summary:
  en: AlphaProof used reinforcement learning in Lean for formal proof search, while AlphaGeometry 2 handled the geometry problem with a faster neuro-symbolic system. The 2024 workflow required experts to translate problems into formal representations and used up to several days of computation.
  zh-CN: AlphaProof 在 Lean 中使用强化学习进行形式证明搜索，AlphaGeometry 2 则以更快的神经符号系统处理几何题。2024 年的流程需要专家将题目翻译为形式化表示，并使用最长数日的计算时间。

why_it_matters:
  en: The result connected formal proof search with a recognizable external benchmark at medal level and became a reference point for later end-to-end natural-language olympiad systems.
  zh-CN: 该结果把形式证明搜索与一个公众熟知的外部竞赛基准连接到奖牌水平，并成为后续端到端自然语言奥赛系统的重要参照点。

ai_role:
  level: ai_primary_human_verified
  description:
    en: AlphaProof searched for Lean proofs using reinforcement learning and test-time adaptation; AlphaGeometry 2 generated and checked geometry proofs in its specialized system.
    zh-CN: AlphaProof 通过强化学习与测试时适应搜索 Lean 证明；AlphaGeometry 2 在其专用系统中生成并检查几何证明。

human_contribution:
  description:
    en: Experts manually translated the contest problems into formal or specialized representations, the research teams designed and trained the systems, and mathematicians graded the resulting solutions under IMO scoring rules.
    zh-CN: 专家将竞赛题人工翻译为形式化或专用表示，研究团队设计并训练系统，数学家按 IMO 评分规则评阅最终解答。

