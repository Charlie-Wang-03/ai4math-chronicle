  - date: '2026-10-15'
    status: under_verification
    evidence_level: E3
    note:
      en: >-
        Palomar registered Kumar's fixed formal statement and proof and reports successful
        checks by Comparator, Lean, NanoDa and con-ron. Palomar explicitly notes that
        this is mechanical assurance rather than human peer review or a novelty certificate.
      zh-CN: >-
        Palomar 注册 Kumar 的固定形式陈述与证明，并报告 Comparator、Lean、NanoDa 与
        con-ron 均检查通过；Palomar 明确说明这属于机械保证，而不是人类同行评审或新颖性认证。
  - date: '2026-10-20'
    status: partially_verified
    evidence_level: E3
    note:
      en: >-
        Chen and Huang released a separate proof claiming the same full even-characteristic
        theorem, cite Kumar as an independent claim and explain substantive differences
        between the constructions. This provides meaningful cross-route corroboration,
        while conventional specialist review remains pending.
      zh-CN: >-
        Chen 与 Huang 发布独立论文证明，声称得到同一完整偶特征定理，并引用 Kumar 为独立
        claim，同时解释两种构造的实质差异。这提供了有意义的跨路线 corroboration，但传统
        专业审查仍待进行。

