claim:
  en: >-
    The two works claim that every nontrivial linear [n,k] MDS code over a finite
    field of characteristic two has n <= q+1, except for k=3 and k=q-1 where
    n <= q+2; classical constructions attain the stated bounds. Kumar's registered
    Lean theorem states the exact maximum for every finite field of even order and
    was checked by Lean, Comparator, NanoDa and con-ron. Chen and Huang independently
    released a conventional proof manuscript on 20 October and explicitly compare
    their argument with Kumar's.
  zh-CN: >-
    两项工作均声称：对 characteristic two 有限域上的任意非平凡线性 [n,k] MDS code，
    除 k=3 或 k=q-1 时允许 n<=q+2 外，均有 n<=q+1，且经典构造达到这些界。
    Kumar 注册的 Lean 定理对任意偶数阶有限域陈述精确最大长度，并通过 Lean、Comparator、
    NanoDa 与 con-ron 检查。Chen 与 Huang 于 10 月 20 日独立发布常规数学证明，并在论文中
    明确比较了其论证与 Kumar 的工作。

summary:
  en: >-
    Kumar states that he devised the mathematical argument while Claude assisted with
    translating and later packaging the Lean development. Chen and Huang state that
    ChatGPT assisted with proof-strategy exploration, intermediate calculations and
    editing, while they take responsibility for all mathematical arguments. The two
    proofs share a Frobenius/colon-ideal/Gorenstein-unimodality mechanism but use
    different local constructions.
  zh-CN: >-
    Kumar 表示数学论证由其本人提出，Claude 协助转写并后续整理 Lean 开发；Chen 与 Huang
    则说明 ChatGPT 用于探索证明策略、检查中间计算和编辑，但全部数学论证由作者负责。两套
    证明共享 Frobenius obstruction、colon ideal 与 Gorenstein unimodality 等核心机制，
    但局部构造不同。

why_it_matters:
  en: >-
    A full characteristic-two result would close a major classical branch of the MDS
    conjecture and is unusually well suited to machine audit because one route arrived
    with a fixed, multi-kernel-checked formal theorem. The near-concurrent second proof
    materially strengthens the historical record while cautioning against a simplistic
    single-project priority narrative.
  zh-CN: >-
    若 characteristic two 的完整结果成立，它将关闭 MDS 猜想的一条重要经典分支；其中一条
    路线从发布之初就附带固定版本、经多内核检查的形式定理，因而特别适合机器审计。近乎同期
    出现的第二套证明强化了历史记录，同时提醒 Chronicle 不应把优先权简化为单一项目叙事。

ai_role:
  level: human_ai_collaboration
  description:
    en: >-
      In Kumar's route, the human author reports devising the mathematics while Claude
      assisted formalization and repository preparation. In Chen–Huang, ChatGPT assisted
      strategy exploration, calculations and editing, with the human authors responsible
      for the mathematics.
    zh-CN: >-
      Kumar 路线中，人类作者称数学论证由其提出，Claude 协助形式化与仓库整理；Chen–Huang
      路线中，ChatGPT 协助策略探索、计算和编辑，数学内容由人类作者负责。

human_contribution:
  description:
    en: >-
      Pranava Kumar devised and maintains the formal proof route; Bocong Chen and Jing
      Huang developed the separate paper proof and take responsibility for its arguments
