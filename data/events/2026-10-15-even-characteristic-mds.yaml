significance:
  tier: H2
  rationale:
    en: >-
      The even-characteristic MDS result is a field milestone because it addresses the
      full remaining characteristic-two range of a coding-theory and finite-geometry
      conjecture originating in Segre's 1955 arc problem. Pranava Kumar first registered
      a complete Lean proof, and five days later Bocong Chen and Jing Huang released a
      separate paper claiming the same theorem through a distinct local construction.
      The odd-characteristic conjecture remains open in general, and neither route has
      yet received conventional specialist peer review.
    zh-CN: >-
      偶特征 MDS 结果构成领域级里程碑，因为它处理了源自 Segre 1955 年有限射影空间弧问题的
      编码理论/有限几何猜想在 characteristic two 下的完整剩余范围。Pranava Kumar 先注册
      完整 Lean 证明，五天后 Bocong Chen 与 Jing Huang 又发布一篇使用不同局部构造、声称
      得到同一主定理的论文。一般奇特征情形仍未解决，两条路线目前也尚未经过传统专业同行评审。

