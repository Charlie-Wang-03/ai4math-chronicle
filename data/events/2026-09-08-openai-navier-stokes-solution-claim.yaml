significance:
  tier: H1
  rationale:
    en: A publicly released AI-generated claimed solution to a Millennium Prize Problem is intrinsically a historical AI4Math event regardless of whether the underlying mathematical claim ultimately survives review. H1 records the magnitude of the event; verification separately records independent corroboration, dispute and later changes in the historical record.
    zh-CN: 公开发布的 AI 生成千禧年难题解答主张本身就是历史级 AI4Math 事件，无论其底层数学结论最终能否经受住审查。H1 记录事件的重要程度；verification 则另行记录独立佐证、争议以及后续历史变化。
mathematical_novelty:
  type: new_proof
interfaces:
- informal
- formal
- symbolic
- hybrid
claim:
  en: OpenAI reports that a large coordinated-agent system produced a finite-time singularity construction resolving statements C and D of the Navier–Stokes Millennium Prize formulation, together with a Lean formalization.
  zh-CN: OpenAI 报告一个大规模协同 Agent 系统构造了有限时间奇点，声称解决 Navier–Stokes 千禧年问题官方表述中的 C 与 D，并提供 Lean 形式化。
summary:
  en: OpenAI says roughly 10,000 concurrent agents worked for about 88 hours on the successful search, followed by additional Lean formalization and verification. Independent reporting corroborated the publication event while also documenting disputes over attribution, provenance and priority.
  zh-CN: OpenAI 表示成功搜索约使用 10,000 个并发 Agent 工作约 88 小时，随后继续进行 Lean 形式化与验证。独立报道确认了这一发布事件，同时也记录了围绕归属、来源与优先权的争议。
why_it_matters:
  en: Because the claim concerns a Millennium Prize Problem and immediately triggered broad independent scrutiny and controversy, the event is historically significant regardless of the claim's eventual mathematical disposition. The proof, priority, attribution and community reception remain subjects for external mathematical and historical assessment.
  zh-CN: 由于该主张涉及千禧年难题，并立即引发广泛独立审视与争议，无论其数学结论最终如何，该事件本身都具有历史重要性。证明本身、优先权、归属与共同体接受度仍应由外部数学与历史证据持续评估。
ai_role:
  level: autonomous_primary
  description:
    en: OpenAI attributes the construction to a coordinated multi-agent system powered by an internal model, with GPT-6 Astra used for formalization and verification.
    zh-CN: OpenAI 将核心构造归因于由内部模型驱动的多 Agent 协同系统，并使用 GPT-6 Astra 完成形式化与验证。
human_contribution:
  description:
    en: OpenAI researchers selected target formulations, orchestrated the evaluation and released the proof; external mathematicians and journalists subsequently scrutinized the claim, attribution and provenance.
    zh-CN: OpenAI 研究者选择目标表述、组织评测并发布证明；随后外部数学家与记者持续审视该主张、归属与来源问题。
