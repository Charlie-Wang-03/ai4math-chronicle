claim:
  en: OpenAI reports that a large coordinated-agent system produced a finite-time singularity construction resolving statements C and D of the Navier–Stokes Millennium Prize formulation, together with a Lean formalization.
  zh-CN: OpenAI 报告一个大规模协同 Agent 系统构造了有限时间奇点，声称解决 Navier–Stokes 千禧年问题官方表述中的 C 与 D，并提供 Lean 形式化。
summary:
  en: OpenAI says roughly 10,000 concurrent agents worked for about 88 hours on the successful search, followed by additional Lean formalization and verification.
  zh-CN: OpenAI 表示成功搜索约使用 10,000 个并发 Agent 工作约 88 小时，随后继续进行 Lean 形式化与验证。
why_it_matters:
  en: Because the claim concerns a Millennium Prize Problem and is only days old, its mathematical correctness, priority and historical status require unusually strong independent scrutiny.
  zh-CN: 由于该主张涉及千禧年难题且发布仅数日，其数学正确性、优先权与历史地位都需要特别严格的独立审查。
ai_role:
  level: autonomous_primary
  description:
    en: OpenAI attributes the construction to a coordinated multi-agent system powered by an internal model, with GPT-6 Astra used for formalization and verification.
    zh-CN: OpenAI 将核心构造归因于由内部模型驱动的多 Agent 协同系统，并使用 GPT-6 Astra 完成形式化与验证。
