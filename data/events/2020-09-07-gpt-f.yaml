title:
  en: GPT-f brings generative language modeling to formal theorem proving
  zh-CN: GPT-f 将生成式语言模型引入形式定理证明

dates:
  event: "2020-09-07"
  first_public_claim: "2020-09-07"
  paper_release: "2020-09-07"
  artifact_release: null
