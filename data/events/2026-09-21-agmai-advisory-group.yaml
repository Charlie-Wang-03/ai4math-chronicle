claim:
  en: >-
    On 21 September 2026, the Advisory Group on Mathematics and Artificial Intelligence
    announced its creation, hosted at the Institute for Advanced Study. The group states
    that it operates independently of AI companies, its members accept no payment for
    this work, it will publish recommendations to AI companies, and it may advise any
    company whose models are likely to have a significant impact on mathematics. It has
    no decision-making power at AI companies. OpenAI states that the group will advise
    on reviewing and communicating emerging mathematical results, coordinating
    dissemination, academic and professional standards, and tools for mathematical
    research and learning; OpenAI also states that the group will not advise on the pace
    of its internal mathematical progress.
  zh-CN: >-
    2026 年 9 月 21 日，Advisory Group on Mathematics and Artificial Intelligence
    宣布成立，并由 Institute for Advanced Study 承载。该组织声明其独立于 AI 企业
    运作，成员不因这项工作接受 AI 企业付款，将公开向 AI 企业提出的建议，并可为任何
    其模型可能对数学产生重大影响的企业提供意见；该组织不拥有 AI 企业内部决策权。
    OpenAI 表示，该组织将就新数学成果的审查与沟通、发布协调、数学研究的学术与职业
    规范，以及支持数学研究和学习的工具提供建议；同时，OpenAI 明确表示该组织不负责
    就其内部数学研究进展的速度提出建议。

summary:
  en: >-
    The group says it formed after OpenAI approached some future members about creating
    an external advisory board; in agreement with OpenAI, those mathematicians instead
    formed an independent group and invited additional members. Its initial membership
    consists of François Charles, Camillo De Lellis, Timothy Gowers, Martin Hairer,
    Nikhil Srivastava, Ulrike Tillmann, Ravi Vakil, Edward Witten and Melanie Matchett
    Wood. The group's first stated task is to advise OpenAI on coordinating the release
    of a large number of significant mathematical results that OpenAI reports were
    produced by an internal model. OpenAI's announcement explicitly cites A Severe
    Misalignment of AI in Mathematics as part of the context for creating this bridge
    to the mathematical community.
  zh-CN: >-
    该组织说明，其形成始于 OpenAI 接触部分后来的成员，希望建立外部顾问委员会；
    在与 OpenAI 沟通后，这些数学家决定改为成立一个独立组织并邀请其他成员加入。
    首批成员包括 François Charles、Camillo De Lellis、Timothy Gowers、Martin Hairer、
    Nikhil Srivastava、Ulrike Tillmann、Ravi Vakil、Edward Witten 与
    Melanie Matchett Wood。该组织当前明确的首项任务，是就 OpenAI 所称由内部模型
    产生的大量重要数学成果如何协调发布向其提供建议。OpenAI 的公告同时明确引用
    《A Severe Misalignment of AI in Mathematics》，将其列为建立这一数学共同体
    沟通渠道的直接背景之一。

why_it_matters:
  en: >-
    Earlier AI-and-mathematics governance efforts largely took the form of professional
    society committees, declarations or publication policies. This event adds a different
    institutional layer: an independent group of research mathematicians positioned
    specifically between frontier AI companies and the mathematical community, with a
    public-accountability commitment and a remit extending beyond one company. It turns
    the 2026 governance debate from statements of principle into an operating interface
    for reviewing and releasing AI-associated mathematical research.
  zh-CN: >-
    此前 AI 与数学治理工作主要表现为专业学会委员会、共同体声明或出版政策。
    本事件增加了另一种制度层：一个由研究数学家组成、明确位于前沿 AI 企业与数学
    共同体之间的独立组织，并承诺公开建议且职责范围不限于单一企业。它把 2026 年
    围绕 AI4Math 的治理争论，从原则性声明进一步推进为处理 AI 参与数学研究审查与
    发布问题的实际运作接口。

ai_role:
  level: not_applicable
  description:
    en: >-
      This Event records a human-created governance institution concerning AI and
      mathematical research rather than an AI system performing mathematical work, so
      an operative AI role is not applicable.
    zh-CN: >-
      本事件记录的是人类建立的 AI 与数学研究治理机制，而不是某个 AI 系统执行具体
      数学工作，因此不存在适用的具体 AI role。

human_contribution:
  description:
    en: >-
      The founding mathematicians established the independent group, defined its
      independence and transparency principles, accepted institutional hosting at IAS,
      opened a channel for community input and undertook to formulate public advice for
      AI companies. OpenAI initiated contact with some members and is the group's first
      stated advisee, while responsibility for company decisions remains with OpenAI.
    zh-CN: >-
      创始数学家建立独立组织、制定独立性与透明度原则、接受 IAS 的机构承载、开放
      共同体意见渠道，并承诺形成面向 AI 企业的公开建议。OpenAI 最初接触了部分成员，
      也是该组织当前首个明确的建议对象；企业决策责任仍由 OpenAI 自身承担。

