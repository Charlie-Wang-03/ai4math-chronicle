    status: claimed
    evidence_level: E2
    note:
      en: >-
        The advisory group's own site and direct guest announcement establish its
        purpose, independence rules, membership, OpenAI origin story and current task.
        OpenAI's announcement independently records the collaboration and the limits of
        the group's role inside the company.
      zh-CN: >-
        顾问组官网及其直接发布的客座公告确认了组织目的、独立性规则、成员构成、
        与 OpenAI 接触的形成过程以及当前任务；OpenAI 的公告另行记录了双方合作关系
        与该组织在公司内部职责的边界。
  - date: '2026-09-22'
    status: claimed
    evidence_level: E2
    note:
      en: >-
        The Institute for Advanced Study lists the advisory group as an FY26 Spring
        Award project of its Nelson Center for Collaborative Research, naming Camillo
        De Lellis and Edward Witten as principal investigators and reproducing the
        group's field-facing purpose and membership. This corroborates institutional
        hosting and durability without implying endorsement of any AI company's
        mathematical claims.
      zh-CN: >-
        Institute for Advanced Study 将该顾问组列为 Nelson Center for Collaborative
        Research 的 FY26 Spring Award 项目，列出 Camillo De Lellis 与 Edward Witten
        为 principal investigators，并记录该组织面向数学共同体的目的与成员构成。
        这为其机构承载与持续性提供佐证，但不表示 IAS 对任何 AI 企业的数学成果主张
        作出背书。

