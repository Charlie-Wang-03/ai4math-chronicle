significance:
  tier: H2
  rationale:
    en: >-
      The Advisory Group on Mathematics and Artificial Intelligence is a field-building
      milestone because it creates a standing, institutionally hosted channel between
      mathematicians and AI companies for the review, presentation and dissemination of
      AI-generated mathematical results. Its independence rules, public-recommendation
      commitment, ability to advise any AI company with substantial mathematical impact,
      IAS hosting and open community-input mechanism make it more durable than a one-off
      company panel or petition. The group also represents a concrete institutional
      response to the September 2026 debate over research incentives, attribution and
      the release of AI-generated mathematics.
    zh-CN: >-
      Advisory Group on Mathematics and Artificial Intelligence 构成领域建构里程碑，
      因为它建立了一个由学术机构承载、连接数学家与 AI 企业的持续性机制，用于讨论
      AI 生成数学成果的审查、呈现与发布。该组织明确规定独立运作、公开发布建议、
      可面向任何对数学产生重大影响的 AI 企业提供意见，并由 IAS 承载且开放共同体
      意见入口，因此其制度持续性明显高于一次性的企业顾问委员会或联署声明。
      它同时也是 2026 年 9 月围绕研究激励、归属与 AI 数学成果发布方式争论后出现的
      具体制度回应。

