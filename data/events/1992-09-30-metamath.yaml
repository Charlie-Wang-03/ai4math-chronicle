id: evt-1992-metamath
slug: metamath-formal-language

title:
  en: Metamath establishes a minimal formal language and independently checkable proof corpus
  zh-CN: Metamath 建立极简形式语言与可独立检查证明语料

dates:
  event: '1992-09-30'
  first_public_claim: '1992-09-30'
