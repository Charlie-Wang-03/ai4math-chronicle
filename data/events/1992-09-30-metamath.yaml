event_types:
- formalization
- infrastructure

significance:
  tier: H2
  rationale:
    en: Metamath created a deliberately small formal proof language and verifier whose transparent proof objects later became a valuable substrate for neural theorem-proving systems such as Holophrasm and MetaGen.
    zh-CN: Metamath 建立刻意极简的形式证明语言与验证器，其透明证明对象后来成为 Holophrasm、MetaGen 等神经定理证明系统的重要基础。

mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic

claim:
  en: Metamath was developed in 1992; current official proof records retain exact contribution dates including 30 September 1992 for early corpus material, which provides the canonical historical anchor used here.
  zh-CN: Metamath 于 1992 年开发；当前官方证明记录保留包括 1992 年 9 月 30 日在内的早期语料精确贡献日期，因此本条以该日期作为 canonical 历史锚点。

summary:
  en: Metamath separates a very small verifier from explicit proof objects, allowing a large body of formal mathematics to be checked with a minimal trusted mechanism.
  zh-CN: Metamath 将极小验证器与显式证明对象分离，使大型形式数学语料可以由最小可信机制进行检查。

why_it_matters:
  en: Its transparent proof format and `set.mm` library later made Metamath attractive for machine learning, proof generation and synthetic theorem-data research.
  zh-CN: 其透明证明格式与 `set.mm` 数学库后来非常适合机器学习、证明生成与合成定理数据研究。

ai_role:
  level: computation_only
  description:
    en: The verifier mechanically checks formal proof steps; the original formal content is human-authored.
    zh-CN: 验证器机械检查形式证明步骤；原始形式内容主要由人类编写。

human_contribution:
  description:
    en: Norman Megill and contributors designed the language, verifier and formal library.
    zh-CN: Norman Megill 与贡献者设计语言、验证器与形式数学库。

