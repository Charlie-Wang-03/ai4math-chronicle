significance:
  tier: H2
  rationale:
    en: >-
      This cross-institutional statement by seven active mathematics and Lean
      formalization researchers sets out concrete quality, interoperability,
      review, attribution and governance principles for scaling AI-assisted
      formal mathematics. Published in direct response to recent large-scale
      AI-generated mathematical releases, it names ongoing projects and
      actionable priorities rather than merely expressing approval or criticism.
      H2 reflects its substantive contribution to field-level practice debates;
      it does not imply that these recommendations were formally adopted by the
      entire mathematical community.
    zh-CN: >-
      这份由七位活跃于数学与 Lean 形式化研究的学者联合发表的跨机构立场文章，
      为扩展 AI 辅助数学形式化提出了具体的质量、互操作性、评审、
      归属与治理原则。文章直接回应近期大规模 AI 数学生成成果的发布，
      指出已有项目与可执行方向，不只是泛泛支持或反对 AI。
      H2 反映其对领域实践讨论的实质贡献，并不表示这些原则已被整个数学共同体
      正式采纳。

