claim:
  en: >-
    On 16 October 2026, Jeremy Avigad, Kevin Buzzard, Johan Commelin,
    Remy Degenne, Kim Morrison, Oliver Nash and Adam Topaz published
    'How to Formalize All of Mathematics' on the Xena blog. They argued that
    rapid AI-driven formalization should prioritize usable and maintainable
    mathematical knowledge rather than sheer volume, proposed ten principles
    for formal libraries and called for scaling Mathlib-aligned initiatives,
    including Tau Ceti and Formal Frontier.
  zh-CN: >-
    2026 年 10 月 16 日，Jeremy Avigad、Kevin Buzzard、Johan Commelin、
    Rémy Degenne、Kim Morrison、Oliver Nash 与 Adam Topaz 在 Xena 博客
    联合发表《How to Formalize All of Mathematics》。作者主张，
    AI 驱动的大规模形式化应优先形成可复用、可维护的数学知识，而非单纯追求
    代码行数；文章提出十项形式化库建设原则，并呼吁扩大与 Mathlib
    生态衔接的 Tau Ceti 和 Formal Frontier 等项目。

summary:
  en: >-
    The statement discusses the tension between automated proof production
    and human comprehension following major 2026 AI mathematics releases.
    It distinguishes kernel-checked correctness from a library's readability,
    conceptual fidelity, generality and future reusability. It recommends
    deference to human-curated Mathlib, reduction of duplication, public
    review, documentation, links to mathematical literature, and continuous
    compatibility with Lean and Mathlib. The authors outline a three-year
    aspiration for broad formalization, support expert-authored roadmaps and
    call for mathematician-controlled tools and non-profit or academic hosting.
    Terence Tao linked to the statement on the same day and emphasized the
    tension between speed, scale and understanding.
  zh-CN: >-
    文章以 2026 年数次重要 AI 数学成果发布为背景，讨论自动化证明产量与
    人类理解之间的张力，并强调 Lean 内核检查通过不等于形式化库具有
    良好的可读性、概念忠实性、一般性和后续复用价值。作者主张尊重
    人工维护的 Mathlib、减少重复、实行公开评审、完善文档、
    对接数学文献，并持续跟进 Lean 与 Mathlib 版本。文章展望在约三年内
    形成广泛数学形式化基础，建议由专家编写研究路线图、
    由数学家控制工具，并探索非营利或学术机构承载。陶哲轩当天转发该文，
    特别指出速度、规模与理解之间的取舍。

why_it_matters:
  en: >-
    The statement articulates a concrete alternative to equating machine
    checking or mass-produced Lean code with useful mathematical progress.
    It documents a coherent research-community proposal linking AI-generated
    formalization to curated libraries, reviewable artifacts, human expertise
    and institutional stewardship. Its long-run influence remains open and
    should be evaluated from later uptake rather than presumed at publication.
  zh-CN: >-
    这份文章为“形式化代码量或机器检查通过即代表数学进步”的简单评价提出
    具体替代方案，把 AI 生成形式化与人工维护的知识库、可审查的证明产物、
    学者专业判断及机构治理结合起来。它记录了一项清晰的共同体建设倡议；
    其长期影响仍待观察，不应在发表当天预设后续采纳结果。

ai_role:
  level: not_applicable
  description:
    en: >-
      This is a human-authored statement about how mathematical AI systems
      should be deployed and governed, not a mathematical result produced
      through AI execution.
    zh-CN: >-
      该事件是人类作者关于数学 AI 系统如何部署与治理的立场和路线建议，
      并非一次由 AI 执行得到的新数学成果。

human_contribution:
  description:
    en: >-
      Seven named mathematicians and formalization researchers jointly
      authored the statement, synthesized lessons from existing projects,
      specified library-quality principles and proposed community
      infrastructure and stewardship priorities. The article explicitly
      does not speak for their affiliated organizations as a whole.
    zh-CN: >-
      七位署名数学家与形式化研究者共同撰写文章，总结现有项目经验、
      明确形式化库质量原则，并提出共同体基础设施和治理优先级。
      原文明确说明，不代表作者所在机构整体的正式立场。

