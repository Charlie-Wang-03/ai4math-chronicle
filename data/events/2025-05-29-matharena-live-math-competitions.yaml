slug: matharena-live-math-competitions

title:
  en: MathArena turns newly released math competitions into a live contamination-resistant benchmark
  zh-CN: MathArena 将最新数学竞赛转化为低污染的实时评测基准

dates:
  event: '2025-05-29'
  first_public_claim: '2025-05-29'
  paper_release: '2025-05-29'
  artifact_release: null
  independently_verified: null
  added_to_chronicle: '2026-09-11'
