event_types:
- benchmark
- infrastructure

significance:
  tier: H2
  rationale:
    en: >-
      MathArena changed mathematical-reasoning evaluation from repeatedly scoring static historical datasets toward evaluating models on newly released competitions close to their publication date, while also incorporating expert-graded proof-writing tasks.
    zh-CN: >-
      MathArena 将数学推理评测从反复使用静态历史数据集，推进到在竞赛题目刚发布时即评测模型，并进一步纳入由专家评分的证明题，从评测机制上直接降低数据污染风险。

mathematical_novelty:
  type: benchmark_result

interfaces:
- informal
- numeric

claim:
  en: >-
    The MathArena paper introduced a continuously updated benchmark built from newly released mathematics competitions, reported evidence of contamination in AIME 2024, and added human-graded proof-writing evaluation alongside final-answer competitions.
  zh-CN: >-
    MathArena 论文发布了一个由最新数学竞赛持续更新的基准，报告 AIME 2024 存在数据污染迹象，并在最终答案型竞赛之外加入由人工专家评分的证明写作评测。

summary:
  en: >-
    MathArena evaluates models on recurring competitions soon after problems are released and records whether a model predates each competition. Its public pipeline supports final-answer parsing as well as proof-based competitions such as USAMO and IMO, where expert graders assess model-generated proofs.
  zh-CN: >-
    MathArena 在竞赛题目发布后尽快评测模型，并记录模型发布时间与竞赛时间的先后关系。其公开管线既支持最终答案解析，也支持 USAMO、IMO 等证明型竞赛，由专家对模型生成证明进行评分。

why_it_matters:
  en: >-
    As static math benchmarks became increasingly vulnerable to contamination and saturation, MathArena supplied a reusable live-evaluation pattern that better separates current reasoning capability from exposure to old benchmark material and makes proof quality part of the evaluation target.
  zh-CN: >-
    当静态数学基准越来越容易受到污染与饱和影响时，MathArena 提供了可持续复用的实时评测范式，更有利于区分当前推理能力与对旧基准材料的接触，并把证明质量本身纳入评测目标。

ai_role:
  level: computation_only
  description:
    en: >-
      Language models are the systems under evaluation and generate answers or proofs; humans design the benchmark, maintain the competition pipeline and perform expert grading for proof-based tasks.
    zh-CN: >-
      语言模型作为被评测系统生成答案或证明；基准设计、竞赛管线维护以及证明题的专家评分由人类完成。

human_contribution:
  description:
    en: >-
      Researchers designed the live-evaluation protocol, selected and normalized competitions, built parsing and review tooling, ran model evaluations, and organized expert grading for proof-based responses.
    zh-CN: >-
      研究者设计实时评测协议，选择并规范化竞赛题目，开发解析与复核工具，运行模型评测，并组织证明题回答的专家评分。

