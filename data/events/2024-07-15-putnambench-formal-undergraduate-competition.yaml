significance:
  tier: H2
  rationale:
    en: PutnamBench created a difficult multi-system benchmark from the premier North American undergraduate mathematics competition and exposed a large capability gap.
    zh-CN: PutnamBench 基于北美顶尖本科数学竞赛构建高难度多形式系统基准，并揭示当时证明器与高水平本科数学之间的巨大能力差距。
mathematical_novelty:
  type: tooling_only
interfaces:
- formal
- symbolic
claim:
  en: PutnamBench released 1,692 hand-constructed formalizations of 640 Putnam theorems in Lean 4 and Isabelle, with a substantial Coq subset.
  zh-CN: PutnamBench 发布 640 道 Putnam 定理的 1,692 个手工形式化版本，覆盖 Lean 4、Isabelle，并包含相当规模的 Coq 子集。
summary:
  en: Initial neural and symbolic provers solved only a handful of benchmark problems, making the collection a high-difficulty target for formal reasoning.
  zh-CN: 初始神经与符号证明器只能解决极少数题目，使该集合成为高难度形式推理目标。
why_it_matters:
  en: It shifted formal theorem-prover evaluation from high-school Olympiad problems toward broad advanced undergraduate mathematics.
  zh-CN: 它把形式定理证明评测从高中奥赛进一步推进到覆盖广泛的高阶本科数学。
ai_role:
  level: computation_only
  description:
    en: Automated theorem provers are evaluated on the formalized Putnam problems.
    zh-CN: 自动定理证明器在形式化 Putnam 问题上接受评测。
human_contribution:
  description:
    en: Researchers hand-formalized competition problems across multiple proof assistants and built the benchmark.
    zh-CN: 研究者在多个证明助手中手工形式化竞赛题并构建基准。
