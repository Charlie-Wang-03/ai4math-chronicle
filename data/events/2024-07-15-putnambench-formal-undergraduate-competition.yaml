slug: putnambench-formal-undergraduate-competition
title:
  en: PutnamBench raises formal theorem-proving evaluation to Putnam-level mathematics
  zh-CN: PutnamBench 将形式定理证明评测提升到 Putnam 级本科数学
dates:
  event: '2024-07-15'
  first_public_claim: '2024-07-15'
  paper_release: '2024-07-15'
